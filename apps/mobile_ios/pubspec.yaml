name: mobile_ios
description: Run app - iOS target.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.4
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  core_models:
    path: ../../packages/core_models
  gpx_parser:
    path: ../../packages/gpx_parser
  run_recorder:
    path: ../../packages/run_recorder
  api_client:
    path: ../../packages/api_client
  ui_kit:
    path: ../../packages/ui_kit
  supabase_flutter: ^2.3.0
  geolocator: ^14.0.0
  path_provider: ^2.1.0
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  pedometer: ^4.0.2
  flutter_tts: ^4.0.2
  file_picker: ^11.0.0
  shared_preferences: ^2.3.0
  permission_handler: ^12.0.0
  # Held at 12.x because share_plus 13 needs win32 ^6.0.0 but file_picker
  # (latest 11.0.2 as of /audit/all 2026-05-07; pub.dev API confirmed) still
  # constrains win32 to ^5.9.0. We don't ship a desktop build, but the
  # workspace must resolve a single win32 — and forcing 6 with a
  # dependency_overrides cascades into win32_registry 2.x and file_picker
  # 11.x compile errors against win32 5 symbols (e.g. COINIT_DISABLE_OLE1DDE).
  # Revisit once file_picker bumps to win32 6 — there is no file_picker
  # release we can bump to today that would unstick this.
  share_plus: ^12.0.0
  uuid: ^4.5.0
  wakelock_plus: ^1.2.8
  flutter_map_cache: ^2.0.0
  dio: ^5.7.0
  dio_cache_interceptor: ^4.0.0
  http_cache_file_store: ^2.0.0
  connectivity_plus: ^7.0.0
  archive: ^4.0.0
  csv: ^8.0.0
  health: ^13.0.0
  google_sign_in: ^7.0.0
  workmanager: ^0.9.0
  # Bluetooth LE chest-strap HR during live runs. Uses the standard BLE
  # Heart Rate Service (UUID 0x180D) + Heart Rate Measurement
  # characteristic (0x2A37). See `lib/ble_heart_rate.dart`.
  # `flutter_reactive_ble` is BSD-3-Clause — chosen over flutter_blue_plus
  # 2.x to avoid the per-call License.free / License.commercial gate the
  # latter introduced. The reactive (Stream-first) API is also a better
  # fit for the long-lived "subscribe to one notification stream" shape
  # of an HR strap. /audit/all 2026-05-07.
  flutter_reactive_ble: ^5.5.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  # Native OAuth for the in-app Strava connect flow. On Android the
  # package opens a Chrome Custom Tab and intercepts the callback via
  # an intent-filter; on iOS it uses ASWebAuthenticationSession which
  # captures the redirect URL without any Info.plist registration.
  # See lib/strava.dart for the `threkir://strava-callback` URI we
  # pin in the Strava developer console and `STRAVA_ALLOWED_REDIRECTS`.
  flutter_web_auth_2: ^5.0.0
  flutter_markdown: ^0.7.4
  sign_in_with_apple: ^8.0.0
  # RevenueCat native SDK for the in-app Pro purchase sheet. The Dart
  # wrapper in `lib/revenuecat.dart` gates every call on `dotenv.env`
  # carrying a platform-appropriate API key, so an unconfigured build
  # (no `REVENUECAT_API_KEY_ANDROID` / `REVENUECAT_API_KEY_IOS`) keeps
  # the existing "open web /settings/upgrade" fallback and never
  # initialises the SDK. Mirrors the web's
  # `apps/web/src/lib/revenuecat.ts` pattern.
  purchases_flutter: ^10.2.0
  # Crash reporting + breadcrumb trail for production builds. Init in
  # lib/main.dart's runZonedGuarded so unhandled errors land tagged with
  # the build's versionName; off when SENTRY_DSN is unset (dev / debug).
  sentry_flutter: ^9.0.0
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; kept unconstrained so the resolver
  # picks the exact intl the bundled Flutter wants (avoids a version
  # conflict and keeps both twin pubspecs' dep sets identical).
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.development
