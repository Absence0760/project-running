# Fly.io app config for the Go background worker + live spectator
# hub. The worker drains the `jobs` queue (map-match etc.); the hub
# serves the public HTTP + WebSocket routes for live spectator
# tracking. Both share the same binary and the same port.
#
# See apps/job_worker/deployment.md for the full plan (sizing, secrets,
# observability, rollback, DR, hub-specific concerns).
#
# This file lives next to the Dockerfile so `flyctl deploy` picks it
# up without --config flags.

# Name differs from the directory: Fly app names allow only lowercase
# letters, numbers and dashes (they become <name>.fly.dev hostnames),
# so `job_worker` is invalid. `threkir-` matches the product-scoped
# prefix the AWS resources use.
app = "threkir-worker"
# Sited next to Postgres, not next to us: the Supabase project lives in
# East US (Ohio), and every job claim / zone lookup / premium request is
# a round trip to it. lhr would add ~80 ms to each. Spectator WebSocket
# latency is unaffected — that terminates at Fly's edge.
primary_region = "ord"

[build]
# The Dockerfile in this directory is multi-stage; the final image is
# distroless and ~9 MB. Fly's remote-only build runs the same path the
# CI workflow does.
dockerfile = "Dockerfile"

[env]
# WORKER_ID is read by main.go and stamped on jobs.locked_by for
# stuck-job debugging. ${FLY_MACHINE_ID} expands per-machine so
# multiple replicas have distinct IDs.
WORKER_ID = "fly-${FLY_MACHINE_ID}"

# OSRM_URL is deliberately unset: the live spectator hub is deploying
# ahead of the sibling osrm app, and pointing at an osrm.internal that
# doesn't resolve would fail every map_match job on a retry loop.
# Unset selects PassthroughMatcher (main.go:279), so map-matching is a
# no-op and runs still ship — just without the snapped line. Restore
# `OSRM_URL = "http://osrm.internal:5000"` (private 6PN, never publicly
# resolvable — see apps/job_worker/osrm/fly.toml) when osrm deploys.

# Live spectator hub WS upgrade origin allow-list. Comma-separated;
# only requests whose Origin header matches one of these are allowed
# to upgrade. The corresponding clients are `apps/web` (PUBLIC build
# at https://threkir.com) and the preview env. Keep the list tight —
# anything not listed gets a 403 at the WS handshake.
LIVEHUB_ALLOWED_ORIGINS = "https://threkir.com,https://www.threkir.com,https://preview.threkir.com"

# Fail-closed sentinel. With LIVEHUB_REQUIRE_AUTH=1, main.go refuses to
# start the binary unless LIVEHUB_ALLOWED_ORIGINS is set AND some token
# verification is configured — either SUPABASE_JWT_SECRET (legacy HS256
# projects) or SUPABASE_URL, which yields the project's JWKS for the
# asymmetric ES256/RS256 keys this project actually signs with. Prevents an accidental deploy from shipping in
# permissive (no-auth) mode where any caller can push pings as any
# user. Local dev leaves this unset to keep the permissive path.
# /audit/livehub May 2026 H3 + H4.
LIVEHUB_REQUIRE_AUTH = "1"

# SECURITY — live-hub WebSocket subscribers carry their Supabase JWT
# in the `?token=…` query string because the browser WebSocket API
# can't set headers on the upgrade. Fly's edge access logs include
# the full request URL by default — the JWT is therefore log-bearing
# until the log pipeline strips it. Operator task before public
# launch: configure the Fly log shipper (or Fly Postgres / Honeycomb
# / etc.) with a redaction rule masking `[?&]token=[^&]*` on URLs
# matching `/v1/live/.+/(subscribe|snapshot)`. Until then, treat the
# `fly logs` stream for this app as secret-bearing — no public
# screen-shares of the log tail. /audit/owasp May 2026 High #2b.

# Public HTTPS + WebSocket service (live spectator hub).
# Fly.io's "http" handler transparently upgrades WS frames; the
# server (apps/job_worker/internal/livehub/server.go) handles the
# Sec-WebSocket-Accept dance via coder/websocket. The TLS handler
# terminates HTTPS at Fly's edge so the Dockerfile binary stays
# plain HTTP.
[[services]]
internal_port = 8080
protocol = "tcp"
auto_start_machines = true
auto_stop_machines = false
min_machines_running = 1

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.tcp_checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"

# HTTP-level health check on /health — fail-fast on the JSON
# `{"status":"stale"}` body the worker returns when the poll loop
# is wedged. Fly auto-restarts after repeated failures (default
# 3 consecutive). The grace period covers cold-start of the
# Go binary + first poll.
[[services.http_checks]]
interval = "15s"
timeout = "5s"
grace_period = "20s"
method = "get"
path = "/health"
protocol = "http"
restart_limit = 0

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
cpus = 1

# Secrets:
#   SUPABASE_URL                  — Supabase API endpoint
#   SUPABASE_SECRET_KEY           — used by both the worker (jobs)
#                                   and the hub's SupabaseZoneFetcher
#                                   (privacy zones) + SupabaseRunMetaFetcher
#                                   (authorizer).
#   SUPABASE_JWT_SECRET           — optional; only for legacy HS256
#                                   projects. Prod signs ES256, so the
#                                   hub verifies against the JWKS
#                                   derived from SUPABASE_URL
#                                   (decisions §276) — leave unset.
#                                   Permissive (no-auth) mode is never
#                                   inferred from a missing secret; it
#                                   takes an explicit
#                                   LIVEHUB_DISABLE_AUTH=1 (local/CI
#                                   only, refused when
#                                   LIVEHUB_REQUIRE_AUTH=1).
#   STRAVA_CLIENT_ID              — optional; required for the
#   STRAVA_CLIENT_SECRET          — `token_refresh` + `strava_event`
#                                   job kinds that replace
#                                   apps/backend/supabase/functions/
#                                   refresh-tokens + strava-webhook.
#                                   When unset the worker still drains
#                                   map_match jobs but the Strava
#                                   kinds fail permanent.
#   STRAVA_WEBHOOK_SECRET         — URL-query secret that guards the
#                                   /v1/strava/webhook endpoint.
#                                   When unset the endpoint returns
#                                   503 and Strava drops the event;
#                                   set this before flipping Strava's
#                                   webhook URL to point at this app.
#   STRAVA_VERIFY_TOKEN           — verify token for Strava's GET
#                                   subscription handshake (the
#                                   value we pass when registering
#                                   the subscription via the
#                                   /api/v3/push_subscriptions API).
# Set from stdin — `flyctl secrets set` puts values into shell history
# and `ps` output (the leak class bin/secret-set.sh exists to prevent):
#   flyctl secrets import --app threkir-worker
# then paste NAME=VALUE lines (SUPABASE_URL, SUPABASE_SECRET_KEY, plus
# the STRAVA_* four when enabling Strava) and press Ctrl-D.
#
# Optional:
#   REDIS_URL                     — `redis://[user:pass@]host:port[/db]`
#                                   (or `rediss://...` for TLS). When
#                                   set, the live hub uses Redis pub/sub
#                                   for fan-out instead of an in-process
#                                   map — required for multi-replica
#                                   deploys. Unset → in-process Hub.
#                                   The last-known per-run snapshot
#                                   gets a 24h TTL'd key.
