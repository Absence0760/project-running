# GraphHopper config for the self-hosted `foot` round_trip engine.
#
# Trimmed from the upstream config-example.yml down to exactly what the
# "Generate a route by distance" feature needs: one foot profile, flexible
# mode (no CH), no elevation.
#
# WHY no Contraction Hierarchies: round_trip only runs in flexible mode. CH
# (speed mode) cannot serve algorithm=round_trip. Leaving `profiles_ch` empty
# means the foot profile is prepared for flexible routing, so a plain
# round_trip request succeeds without ch.disable=true — which is exactly what
# the generate-route core sends (apps/web/src/lib/routes/generate/graphhopper.ts).
#
# WHY no elevation: the stock foot profile references foot_elevation.json,
# which requires graph.elevation.provider (SRTM tiles → extra disk + RAM +
# download). round_trip distance shaping does not need elevation, so we use a
# flat foot custom model and keep the box small.

graphhopper:
  # datareader.file + graph.location are injected at boot via -Ddw.* in the
  # Dockerfile ENTRYPOINT (both point at the mounted /data volume), so they are
  # intentionally left empty here.
  datareader.file: ""
  graph.location: graph-cache

  # No Contraction Hierarchies (speed mode) — CH cannot serve round_trip, which
  # only runs in flexible mode. Landmarks (LM / hybrid mode) ARE prepared below
  # (profiles_lm): round_trip still routes flexibly, but LM accelerates the
  # bidirectional-A* leg routing it does under the hood. That matters because
  # each generate request fans out several round_trip seeds concurrently onto a
  # single engine machine, so per-query CPU — not single-call latency — is the
  # real bottleneck under load. LM costs a little import time + RAM and pays it
  # back in p95.
  # Encoded values the foot model references. GraphHopper 10 imports these into
  # the graph only when listed here — neither an inline custom_model nor the
  # built-in custom_model_files path auto-declares them, so a missing entry
  # fails the boot with "Encoded values missing: foot_access, …". This is the
  # exact set GH 10's bundled foot.json uses.
  graph.encoded_values: foot_access, foot_priority, foot_average_speed, hike_rating, mtb_rating

  # Foot profile via GraphHopper's BUILT-IN foot.json custom model, resolved
  # from the jar classpath. Inlining a hand-copied model is fragile — GH 10
  # renamed/retired encoded values, so a "verbatim" copy referenced ones that
  # don't exist (foot_road_access). Deferring to the bundled model keeps this
  # correct across GH releases. No foot_elevation.json overlay (see WHY no
  # elevation above).
  profiles:
    - name: foot
      custom_model_files: [foot.json]

  profiles_ch: []
  profiles_lm:
    - profile: foot

  # Keep the import lean — runners' tracks live on footways/paths/residential
  # streets, never motorways. Mirrors the OSRM foot.lua intent.
  import.osm.ignored_highways: motorway,trunk

# Dropwizard server block. GraphHopper listens on 8990 bound to LOCALHOST only —
# it is NOT the public port. The public 8989 is owned by the Caddy guard
# (Caddyfile), which checks the X-Engine-Key shared secret and reverse-proxies
# to 8990 here. Binding 127.0.0.1 means nothing outside the container can reach
# GraphHopper directly, even by IP. 8081 is the unused Dropwizard admin port.
server:
  application_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8081
      bind_host: 127.0.0.1
  request_log:
    appenders: []

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d %-5level %logger{36} - %msg%n"
