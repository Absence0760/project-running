project_id = "project-running"

[api]
port = 54321

[db]
port = 54322

[auth]
site_url = "http://localhost:7777"
additional_redirect_urls = ["http://localhost:7777/auth/callback", "http://localhost:7779/auth/callback"]
enable_signup = true

[auth.email]
enable_confirmations = false

# Pin the local mail-catcher ports rather than relying on the CLI default
# (web 54324 / SMTP 54325 / POP3 54326). The Go worker's notification-email
# sender targets SMTP 54325 in local dev (SMTP_HOST=127.0.0.1
# SMTP_PORT=54325); inspect sent mail at http://127.0.0.1:54324. Auth
# emails (GoTrue) land here too.
[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false

# Generic OIDC provider used ONLY by the SSO e2e lane (apps/web,
# tests-e2e/sso). GoTrue special-cases `google`/`apple` and validates
# them against the real Google/Apple, so they cannot point at a mock —
# `keycloak` is the canonical generic OIDC provider that accepts a custom
# `url`. In the SSO lane that url points at a local oauth2-mock-server
# (see apps/web/tests-e2e/sso/README.md). When the env vars are unset
# (every other job + local dev) the provider is enabled but inert: GoTrue
# fetches the OIDC endpoints lazily at request time, so an unreachable
# url never breaks `supabase start`, and nothing initiates a keycloak
# sign-in. The values below are non-secret test placeholders; the lane
# overrides url/client_id/secret via env() at start time.
[auth.external.keycloak]
enabled = true
client_id = "env(SSO_MOCK_OIDC_CLIENT_ID)"
secret = "env(SSO_MOCK_OIDC_SECRET)"
url = "env(SSO_MOCK_OIDC_URL)"

# Edge Function defaults bake in verify_jwt = true, which gates the
# function on a Supabase-issued JWT (anon or user). The three handlers
# below authenticate themselves another way — Strava signs nothing, so
# strava-webhook gates on a URL-embedded shared secret + timing-safe
# HMAC; revenuecat-webhook validates an HMAC over the raw body;
# stripe-events-webhook verifies the Stripe-Signature HMAC over the raw
# body against STRIPE_EVENTS_WEBHOOK_SECRET; and refresh-tokens is
# invoked by pg_cron with a shared bearer token.
# Without these blocks the platform 401s the requests before our code
# runs, so the secrets we *do* check would never get the chance.
#
# donations-checkout also opts out: a charity donor may be logged out
# (a donation has no seat, unlike a paid registration), so the platform
# JWT gate would block legitimate anonymous donations. The function still
# attributes a donation when a JWT IS present; the visibility read is done
# as the caller so a private-anchor fundraiser stays unreachable.
#
# The other functions (strava-import, parkrun-import, export-data,
# delete-account, clip-public-track, events-connect-onboard,
# events-checkout) all need a Supabase JWT (anon for clip-public-track,
# user-scoped for the rest) and are correct on the default
# verify_jwt = true.

[functions.strava-webhook]
verify_jwt = false

[functions.donations-checkout]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

[functions.stripe-events-webhook]
verify_jwt = false

[functions.refresh-tokens]
verify_jwt = false
