# Pinned to 9.5.1 — the ceiling AGP 8.13.0 (settings.gradle.kts) tolerates.
# Gradle 9.6.0 changed the internal `InternalProblems` /
# `ProblemsBuildTreeServices` API that AGP 8.13's
# `AndroidProblemReporterProvider` binds to, so applying
# `com.android.application` fails at config time with "Could not create
# an instance of type AndroidProblemReporterProvider" (Dependabot bump
# 9.5.1 -> 9.6.0 broke the APK smoke build, run 28027750381). Bump this
# only together with AGP (the agp-and-kotlin Dependabot group); the
# matching ignore lives in .github/dependabot.yml.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-all.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
