<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="application-name" content="Threkir" />
		<meta name="apple-mobile-web-app-title" content="Threkir" />
		<title>Threkir</title>
		<!--
		Material Symbols Outlined: self-hosted via the `material-symbols`
		npm package, imported from app.css (`@import 'material-symbols/outlined.css'`).
		Prior shape loaded the font from fonts.googleapis.com /
		fonts.gstatic.com unconditionally on every page hit, which
		audit/cookie-consent (May 2026) flagged as a critical ePrivacy
		Art 5(3) violation: EU users' IPs reached a US sub-processor
		before the consent banner had rendered. Self-hosting moves the
		fetch onto our own origin (CloudFront) so no third-party data
		flow occurs.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
