<!doctype html>
<!-- Prerender default only. The web app is statically prerendered with no
     per-request SSR (adapter-static), so lang/dir are baked as en/ltr at
     build time and then updated client-side on first mount by the i18n
     runtime ($lib/i18n/store.svelte initLocale → document.documentElement),
     mirroring the theme + unit signals. dir is the single RTL switch-point:
     the app shell uses CSS logical properties so flipping it to "rtl"
     mirrors the frame with no further plumbing. audit/i18n-readiness W-2. -->
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Declares the page adapts to both schemes so the user agent
		     paints the correct default background (and form-control /
		     scrollbar colours) BEFORE app.css loads. This is the earliest,
		     CSP-safe mitigation for the dark/auto first-paint flash: the
		     hash-based CSP (svelte.config.js) forbids a hand-written inline
		     bootstrap <script>, so this meta is the tool that runs before
		     paint. The theme reconciles to the persisted [data-theme] on
		     first mount (settings/theme.ts). -->
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#FE5932" />
		<meta name="application-name" content="Threkir" />
		<meta name="apple-mobile-web-app-title" content="Threkir" />
		<title>Threkir</title>
		<!--
		Material Symbols Outlined: self-hosted via the `material-symbols`
		npm package, imported from app.css (`@import 'material-symbols/outlined.css'`).
		Prior shape loaded the font from fonts.googleapis.com /
		fonts.gstatic.com unconditionally on every page hit, which
		audit/cookie-consent (May 2026) flagged as a critical ePrivacy
		Art 5(3) violation: EU users' IPs reached a US sub-processor
		before the consent banner had rendered. Self-hosting moves the
		fetch onto our own origin (CloudFront) so no third-party data
		flow occurs.
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
