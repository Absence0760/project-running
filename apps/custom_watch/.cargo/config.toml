# Cargo config for the custom_watch firmware workspace.
# Default target is the nRF52840's Cortex-M4F. probe-rs handles flash + RTT.
# Host-only test runs use `bin/watch-test.sh`, which overrides --target to the
# host triple and excludes embedded-only crates (app, nrf52840_dk).

[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
