[package]
name = "app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "app"
path = "src/main.rs"
test = false
bench = false

# Versions below are best-effort against the Embassy ecosystem as of 2026-05.
# If `cargo build` complains about API changes, check the Embassy migration
# notes and update accordingly — this is research-tier code, version drift is
# expected. Pin tighter once the scaffold has a known-good build.

[dependencies]
# Embassy async runtime + nRF52 HAL + time driver
embassy-executor = { version = "0.6", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time     = { version = "0.3", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf      = { version = "0.2", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-sync     = "0.6"
embassy-futures  = "0.1"

# Cortex-M runtime + interrupt vectors
cortex-m         = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7"

# Logging: defmt over RTT, panic-probe so panics print + halt cleanly
defmt        = "0.3"
defmt-rtt    = "0.4"
panic-probe  = { version = "0.3", features = ["print-defmt"] }

# Workspace crates
sharp_mip   = { path = "../drivers/sharp_mip" }
ublox_nmea  = { path = "../drivers/ublox_nmea" }
max86177    = { path = "../drivers/max86177" }
nrf52840_dk = { path = "../boards/nrf52840_dk" }
