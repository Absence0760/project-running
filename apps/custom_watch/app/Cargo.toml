[package]
name = "app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "app"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Restores the pre-button "auto-start the run on the first GPS fix" path in the
# record task. OFF by default: on real hardware BTN1 is the only start path.
# The Renode sim (bin/watch-sim.sh) has no way to inject a button press, so it
# builds with this feature to keep showing distance accrue — see
# apps/custom_watch/local_testing.md § Simulating without a board.
sim-autostart = []

# Versions pinned to crates.io latest as of 2026-05-28 (post-scaffold audit).
# When bumping, check the relevant CHANGELOG — Embassy's executor / time / nrf
# crates ship breaking changes between minor versions (the 0.6→0.10 jump in
# embassy-executor renamed `arch-cortex-m` to `platform-cortex-m` and removed
# `task-arena-size-*` + `integrated-timers`; embassy-nrf 0.10 retired the
# `Pin::degrade()` method in favour of `AnyPin::from(...)` / `.into()`).

[dependencies]
# Embassy async runtime + nRF52 HAL + time driver
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5",  features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf      = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote", "defmt"] }
embassy-sync     = { version = "0.8",  features = ["defmt"] }
embassy-futures  = "0.1"

# Cortex-M runtime + interrupt vectors
cortex-m         = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7"

# I²C Operation type for the timeout-bounded sensor presence probes
embedded-hal     = "1.0"

# Logging: defmt over RTT, panic-probe so panics print + halt cleanly
defmt        = "1.1"
defmt-rtt    = "1.2"
panic-probe  = { version = "1.0", features = ["print-defmt"] }

# Workspace crates
watch_core  = { path = "../core",               features = ["defmt"] }
sharp_mip   = { path = "../drivers/sharp_mip",  features = ["defmt"] }
ublox_nmea  = { path = "../drivers/ublox_nmea", features = ["defmt"] }
max86177    = { path = "../drivers/max86177",   features = ["defmt"] }
bmp581      = { path = "../drivers/bmp581",     features = ["defmt"] }
nrf52840_dk = { path = "../boards/nrf52840_dk" }
