[package]
name = "watch_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
ublox_nmea = { path = "../drivers/ublox_nmea" }
heapless   = "0.9"
libm       = "0.2"
defmt      = { version = "1.1", optional = true }

[features]
default = []
defmt   = ["dep:defmt", "ublox_nmea/defmt"]

# Host-testable, so no embedded dev-deps. `cargo test --target <host>` works.
# serde_json only compiles into host test builds — link.rs uses it to prove
# every emitted frame is real JSON, not to produce frames.
#
# proptest backs the wire-format property suites under `tests/`. `default-
# features = false` drops its fork / rusty-fork / tempfile / regex machinery:
# the suites use none of it, and the fork harness would spawn a process per
# failing case in CI.
#
# embassy-sync is a DEV-dep only, and must stay one: a real dependency would put
# an embedded async runtime inside the crate whose whole contract is "pure logic
# over plain data, no Embassy". The `ble_sync` queue tests instantiate the same
# `Channel` the radio task runs the phone's pipelined chunk requests through, so
# CHUNK_QUEUE_DEPTH is checked against the type that consumes it rather than
# asserted about in prose. Version pinned to what `app/Cargo.toml` declares —
# testing a different Channel than the firmware links is worse than no test.
# `critical-section/std` comes with it: `CriticalSectionRawMutex` is an extern
# call the firmware resolves against the SoftDevice, and nothing provides it on
# the host, so the test binary would not link without an impl to bind to.
#
# embassy-futures joins them on the same terms and for the same reason: the
# `settings_queue` wake tests assemble the record task's `select3`/`select4`
# wait out of the real combinators and the real channels, so the arm ordering
# and the "a pushed frame is its own wake source" property are checked against
# what the firmware links rather than against a hand-rolled stand-in.
[dev-dependencies]
serde_json = "1"
proptest = { version = "1.11", default-features = false, features = ["std"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
critical-section = { version = "1", features = ["std"] }
