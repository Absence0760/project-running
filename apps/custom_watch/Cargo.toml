[workspace]
resolver = "2"
members = [
    "app",
    "core",
    "drivers/sharp_mip",
    "drivers/ublox_nmea",
    "drivers/max86177",
    "drivers/bmp581",
    "boards/nrf52840_dk",
]

[workspace.package]
edition = "2021"
publish = false

# On a power-constrained Cortex-M4F, optimising for size (-Os) typically beats
# -O3: smaller code fits more in the instruction cache + flash is the slowest
# part of the wake-up path. We keep full debug info for defmt-rtt + probe-rs.
# See docs/custom_watch/performance_path.md for the rationale.

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "s"
overflow-checks = false

[profile.dev]
debug = 2
# opt-level = "s" in dev too (not the default 0): at opt-level = 0 the Embassy +
# nrf-softdevice debug binary tends to overflow the nRF52840's 1 MB flash budget
# (the unoptimised async-state-machine code expansion is significant). Trades
# incremental-build speed for a binary that actually fits. Can drop back to
# opt-level = 0 if flash overflow stops being a concern — likely after the
# tier-2 migration to Apollo510B (4 MB MRAM + 3.75 MB SRAM per decisions.md § 90).
opt-level = "s"
overflow-checks = true
