[package]
name = "ublox_nmea"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
defmt = { version = "1.1", optional = true }

[features]
default = []
defmt   = ["dep:defmt"]

# Host-testable, so no embedded dev-deps. `cargo test --target <host>` works.
#
# proptest backs `tests/properties.rs`. `default-features = false` drops its
# fork / rusty-fork / tempfile / regex machinery, which the suite doesn't use.
[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
