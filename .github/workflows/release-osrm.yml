name: Release OSRM

# Per-app tag convention: `osrm@1.2.3`. The workflow redeploys the OSRM
# container; it does NOT rebuild the graph. The graph lives on the Fly
# Volume (`osrm_data` mounted at `/data`) and persists across image
# deploys — that's deliberate, so a tag for a config tweak never costs
# 15 min of regraph time.
#
# Graph rebuilds happen out of band — see apps/job_worker/deployment.md
# § Weekly rebuild cron (proposed) for that path.
#
# Secret required:
#   FLY_API_TOKEN  — same token as release-worker.yml; scoped to the
#                    runonward org.

# Release-triggered: publishing a GitHub Release whose tag is `osrm@*`
# runs this workflow — a bare `osrm@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `osrm@*` tags.
on:
  release:
    types: [published]

# Least-privilege default. This workflow only deploys to Fly.io; it writes
# nothing back to the triggering Release, so the job needs no
# `contents: write` — checkout's `contents: read` is enough.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: flyctl deploy (OSRM)
    runs-on: ubuntu-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on osrm@* releases.
    if: startsWith(github.event.release.tag_name, 'osrm@')
    # Pause on the `production` environment's required-reviewer rule
    # before any prod credentials/steps run (repo Settings → Environments).
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/osrm@}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "Version: ${ref}"

      - name: Setup flyctl
        # SHA-pinned to the v1 tag (May 2026). The action's @master ref
        # is a *branch*, force-pushable by the publisher; this workflow
        # consumes secrets.FLY_API_TOKEN to deploy production OSRM, so
        # the pin closes a real supply-chain risk. Bump by re-resolving
        # the v1 tag's commit SHA — `gh api repos/superfly/flyctl-actions/git/refs/tags/v1`.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      - name: Deploy to Fly.io
        # The fly.toml in apps/job_worker/osrm/ pins app=osrm,
        # image=osrm/osrm-backend:latest, and the volume mount. A
        # redeploy is essentially "pull the latest osrm-backend image
        # and restart the machine"; the graph on the volume rides
        # along untouched.
        run: flyctl deploy --remote-only
        working-directory: apps/job_worker/osrm
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: flyctl status --app osrm
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
