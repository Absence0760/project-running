name: Release iOS

# Tag: `mobile_ios@1.2.3`. Skeleton workflow — the iOS Flutter app is
# still scaffolded (see `apps/mobile_ios/CLAUDE.md`), so this workflow
# builds an unsigned IPA today and is ready to flip on code-signing +
# TestFlight upload when the app is shippable.
#
# To activate TestFlight upload, uncomment the signing + upload steps
# and add these secrets:
#   IOS_BUILD_CERTIFICATE_BASE64   Apple distribution certificate (.p12)
#   IOS_P12_PASSWORD               password for the .p12
#   IOS_PROVISIONING_PROFILE_BASE64
#   KEYCHAIN_PASSWORD              anything — used to create an ephemeral keychain
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_BASE64   .p8 key from App Store Connect

# Release-triggered: publishing a GitHub Release whose tag is `mobile_ios@*`
# runs this workflow — a bare `mobile_ios@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `mobile_ios@*` tags.
on:
  release:
    types: [published]

# Least-privilege default; the release job opts up to `contents: write`
# for the GitHub Release step.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must equal ci.yml's FLUTTER_VERSION: CI is what validates the code this
  # workflow ships, so a release built on a different SDK than CI tested is
  # an untested binary. A release has no green/red signal to tell you the
  # toolchain moved either — an unpinned `channel: stable` here would ship
  # whatever Flutter was newest at tag time. `scripts/check_toolchain_pins.mjs`
  # (the `workflow-lint` job) fails CI if the three workflows disagree, so
  # bump them together. Rationale: decisions.md § 595.
  FLUTTER_VERSION: "3.47.0"

jobs:
  release:
    name: Build iOS (unsigned until app ships)
    runs-on: macos-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on mobile_ios@* releases.
    if: startsWith(github.event.release.tag_name, 'mobile_ios@')
    # Pause on the `production` environment's required-reviewer rule
    # before any prod credentials/steps run (repo Settings → Environments).
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#mobile_ios@}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: dart pub global activate melos 7.8.2
      - run: melos bootstrap

      - name: Pin version from tag
        working-directory: apps/mobile_ios
        run: |
          sed -i '' "s/^version: .*/version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      # TestFlight-ready signing + upload. Uncomment when the iOS app
      # is ready to ship.
      #
      # - name: Install signing assets
      #   env:
      #     IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      #     IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      #     IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERT_PATH=$RUNNER_TEMP/build_certificate.p12
      #     PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
      #     KEYCHAIN=$RUNNER_TEMP/build.keychain-db
      #     echo "$IOS_BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
      #     echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PP_PATH"
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN"
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
      #     security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security list-keychain -d user -s "$KEYCHAIN"
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      #
      # - name: Build signed IPA
      #   working-directory: apps/mobile_ios
      #   run: flutter build ipa --release
      #
      # - name: Upload to TestFlight
      #   uses: apple-actions/upload-testflight-build@v1
      #   with:
      #     app-path: apps/mobile_ios/build/ios/ipa/mobile_ios.ipa
      #     issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      #     api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      #     api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Build IPA (unsigned)
        working-directory: apps/mobile_ios
        run: flutter build ipa --no-codesign

      - name: Attach IPA to the Release
        # The Release already exists — it triggered this run. Upload the
        # IPA onto it (no name/notes → the human-authored release title +
        # notes aren't clobbered).
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: apps/mobile_ios/build/ios/ipa/*.ipa
