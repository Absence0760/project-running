name: Release worker

# Per-app tag convention: `worker@1.2.3`. The workflow runs `flyctl deploy`
# against the `job_worker` Fly.io app. Fly.io builds the Docker image remotely so the runner
# stays small.
#
# Secret required:
#   FLY_API_TOKEN  — Fly.io dashboard → Account → Access Tokens, scoped
#                    to the runonward org.
#
# See apps/job_worker/deployment.md for the cross-cutting concerns
# (sizing, secrets, observability, rollback, DR) and docs/ops/releasing.md
# for the tag conventions.

# Release-triggered: publishing a GitHub Release whose tag is `worker@*`
# runs this workflow — a bare `worker@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `worker@*` tags.
on:
  release:
    types: [published]

# Least-privilege default. This workflow only deploys to Fly.io; it writes
# nothing back to the triggering Release, so the job needs no
# `contents: write` — checkout's `contents: read` is enough.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: flyctl deploy
    runs-on: ubuntu-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on worker@* releases.
    if: startsWith(github.event.release.tag_name, 'worker@')
    # Pause on the `production` environment's required-reviewer rule
    # before any prod credentials/steps run (repo Settings → Environments).
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/worker@}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "Version: ${ref}"

      - name: Setup flyctl
        # SHA-pinned to the v1 tag (May 2026). The action's @master ref
        # is a *branch*, force-pushable by the publisher; this workflow
        # consumes secrets.FLY_API_TOKEN to deploy the production job
        # worker, so the pin closes a real supply-chain risk. Bump by
        # re-resolving the v1 tag's commit SHA —
        # `gh api repos/superfly/flyctl-actions/git/refs/tags/v1`.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      - name: Deploy to Fly.io
        # --remote-only builds the image on Fly's builder rather than the
        # runner; saves us shipping the Go toolchain into the runner.
        # The fly.toml in apps/job_worker/ pins app=job_worker and
        # primary_region=lhr.
        run: flyctl deploy --remote-only
        working-directory: apps/job_worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        # Confirms the new release is the one Fly is serving. flyctl
        # status exits non-zero if no machine is healthy, which surfaces
        # a deploy-but-machine-crashloops failure as a workflow failure.
        run: flyctl status --app job_worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
