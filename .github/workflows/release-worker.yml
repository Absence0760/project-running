name: Release worker

# Per-app tag convention: `worker@1.2.3`. The workflow runs `flyctl deploy`
# against the `job_worker` Fly.io app, then attaches a GitHub Release for
# the audit trail. Fly.io builds the Docker image remotely so the runner
# stays small.
#
# Secret required:
#   FLY_API_TOKEN  — Fly.io dashboard → Account → Access Tokens, scoped
#                    to the runonward org.
#
# See apps/job_worker/deployment.md for the cross-cutting concerns
# (sizing, secrets, observability, rollback, DR) and docs/releasing.md
# for the tag conventions.

on:
  push:
    tags:
      - 'worker@*'

jobs:
  release:
    name: flyctl deploy + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/worker@}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "Version: ${ref}"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # --remote-only builds the image on Fly's builder rather than the
        # runner; saves us shipping the Go toolchain into the runner.
        # The fly.toml in apps/job_worker/ pins app=job_worker and
        # primary_region=lhr.
        run: flyctl deploy --remote-only
        working-directory: apps/job_worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        # Confirms the new release is the one Fly is serving. flyctl
        # status exits non-zero if no machine is healthy, which surfaces
        # a deploy-but-machine-crashloops failure as a workflow failure.
        run: flyctl status --app job_worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: worker ${{ steps.version.outputs.version }}
          body: |
            Deployed worker `${{ steps.version.outputs.version }}` to Fly.io
            (`job_worker` app, `lhr` region) via `flyctl deploy --remote-only`.

            See [`apps/job_worker/deployment.md`](apps/job_worker/deployment.md)
            for the full deploy plan including rollback (`flyctl releases
            rollback`) and DR procedures.
