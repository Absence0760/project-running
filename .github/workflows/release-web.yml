name: Release Web

# Release-triggered: publishing a GitHub Release whose tag is `web@*`
# runs this workflow  →  prod  →  threkir.com + www.threkir.com. A bare
# `web@*` tag push does NOT deploy — the published Release is the deploy
# gate (`gh release create web@1.2.3 …`, the Releases UI, or the /release
# skill), so the notes/title are authored up front and the deploy is a
# deliberate human action rather than a tag side effect.
#
# `on: release` fires for every published release in the repo, so the job
# is guarded to `web@*` tags below — a backend@/mobile_android@/… release
# publish is ignored.
#
# A preview deploy on push-to-main is supported by the rest of the
# workflow (env=preview, ARN_PREVIEW, preview.threkir.com), but the
# trigger is left out here because this fork doesn't have the AWS
# Terraform stacks applied or the GitHub secrets populated — every
# push to main would otherwise fail the configure-aws-credentials
# step. Re-enable by adding a `push: branches: [main]` trigger once the
# AWS_DEPLOY_ROLE_ARN_PREVIEW + PUBLIC_* secrets exist (see
# infra/README.md § First-time deploy).
#
# Hosted on AWS (S3 + CloudFront + Lambda + Route 53). Provisioned by
# Terraform (infra/) — see decisions.md § 53 and apps/web/deployment.md.
#
# AWS auth: GitHub OIDC. The deploy roles are created by infra/github-
# oidc and their ARNs land in repo Secrets as AWS_DEPLOY_ROLE_ARN_PROD
# and AWS_DEPLOY_ROLE_ARN_PREVIEW. No long-lived AWS keys are stored
# anywhere.
#
# Build artifact: a .zip of the static SvelteKit build is attached back
# to the triggering GitHub Release so a rollback is one workflow re-run
# against the older tag.

on:
  release:
    types: [published]

# Least-privilege default; the release job opts up to `id-token: write`
# (OIDC) + `contents: write` (GitHub Release).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build + deploy web
    runs-on: ubuntu-latest

    # Guard: `on: release` fires for every published release in the repo,
    # so only act on web@* releases.
    if: startsWith(github.event.release.tag_name, 'web@')

    # Prod tags pause on the `production` environment's required-reviewer
    # rule (repo Settings → Environments) before any AWS step runs. The
    # preview leg (when the push-to-main trigger returns) resolves to the
    # ungated `preview` environment instead — approving every push to
    # main would defeat continuous preview deploys.
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/web@') && 'production' || 'preview' }}
      url: ${{ startsWith(github.ref, 'refs/tags/web@') && 'https://threkir.com' || 'https://preview.threkir.com' }}

    permissions:
      id-token: write    # OIDC AssumeRoleWithWebIdentity
      contents: write    # softprops/action-gh-release writes a Release

    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine env + version
        id: env
        run: |
          if [[ "$GITHUB_REF" == refs/tags/web@* ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/web@}" >> "$GITHUB_OUTPUT"
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "version=preview-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 (current Active LTS). Must match the Lambda
          # runtime in infra/modules/web-stack/main.tf so the bundle
          # esbuild produces actually runs in Lambda. Node 22+ is
          # also a hard requirement for @supabase/realtime-js >=2.105
          # which the coach Lambda transitively imports.
          node-version: "24.20.0"

      - run: npm ci

      # The share Lambdas run on arm64 and bundle resvg's NATIVE arm64
      # binary into their zips, but npm ci on the x64 runner installs
      # only host-platform optional deps (failed web@1.0.0/1.0.1) — and
      # any `npm install --cpu=arm64 --os=linux` re-evaluates the WHOLE
      # tree for that platform, pruning the x64 bindings the build
      # toolchain itself needs (rolldown lost its host binding on
      # web@1.0.2). So: fetch the tarball directly and unpack it into
      # node_modules without touching npm's dependency tree, version
      # pinned to the installed loader.
      - name: Install arm64 resvg binary for the share Lambdas
        run: |
          ver="$(node -p "require('@resvg/resvg-js/package.json').version")"
          npm pack "@resvg/resvg-js-linux-arm64-gnu@${ver}" --pack-destination "$RUNNER_TEMP"
          dest="node_modules/@resvg/resvg-js-linux-arm64-gnu"
          mkdir -p "$dest"
          tar -xzf "$RUNNER_TEMP/resvg-resvg-js-linux-arm64-gnu-${ver}.tgz" -C "$dest" --strip-components=1

      # ──────────────────── Build static site ────────────────────

      - name: Write apps/web/.env from secrets
        # PUBLIC_* vars are inlined into the static build — they're
        # stripped after the build step so they don't leak into the
        # uploaded build zip's source artifacts.
        #
        # We write `.env` (not `.env.production`) because the preceding
        # `npm run check` step runs `svelte-kit sync` in default
        # (development) mode, which loads `.env` and `.env.local` but
        # NOT `.env.production`. Without `.env`, the env-typegen produces
        # an empty `$env/static/public` and svelte-check fails on every
        # PUBLIC_* import. `vite build` reads `.env` in either mode too,
        # so the build step picks the values up the same way.
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
          PUBLIC_REVENUECAT_WEB_CHECKOUT_URL: ${{ secrets.PUBLIC_REVENUECAT_WEB_CHECKOUT_URL }}
          PUBLIC_REVENUECAT_WEB_PORTAL_URL: ${{ secrets.PUBLIC_REVENUECAT_WEB_PORTAL_URL }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_COACH_ENABLED: ${{ secrets.PUBLIC_COACH_ENABLED }}
          PUBLIC_ROUTE_GEN_ENABLED: ${{ secrets.PUBLIC_ROUTE_GEN_ENABLED }}
          # Optional — unset keeps the web client on the Supabase
          # Realtime live path; set to https://live.threkir.com once the
          # Fly live hub is deployed (apps/job_worker/deployment.md).
          PUBLIC_LIVE_HUB_URL: ${{ secrets.PUBLIC_LIVE_HUB_URL }}
          PUBLIC_APP_RELEASE: web@${{ steps.env.outputs.version }}
        run: |
          cat <<EOF > apps/web/.env
          PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL}
          PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY}
          PUBLIC_MAPTILER_KEY=${PUBLIC_MAPTILER_KEY}
          PUBLIC_REVENUECAT_WEB_CHECKOUT_URL=${PUBLIC_REVENUECAT_WEB_CHECKOUT_URL}
          PUBLIC_REVENUECAT_WEB_PORTAL_URL=${PUBLIC_REVENUECAT_WEB_PORTAL_URL}
          PUBLIC_SENTRY_DSN=${PUBLIC_SENTRY_DSN}
          PUBLIC_COACH_ENABLED=${PUBLIC_COACH_ENABLED}
          PUBLIC_ROUTE_GEN_ENABLED=${PUBLIC_ROUTE_GEN_ENABLED}
          PUBLIC_LIVE_HUB_URL=${PUBLIC_LIVE_HUB_URL}
          PUBLIC_APP_RELEASE=${PUBLIC_APP_RELEASE}
          EOF

      - run: npm run check --workspace=apps/web

      - name: Guard production env (no placeholder / empty secrets)
        # Without this, a missing repo secret in the release workflow
        # writes an empty PUBLIC_SUPABASE_URL into apps/web/.env, the
        # build's `entries()` calls all return [], svelte.config.js's
        # `handleUnseenRoutes: 'warn'` quietly accepts the empty set,
        # and we ship a static artifact whose share + og pages are
        # all missing. The guard fails loud instead. See
        # apps/web/scripts/check_production_env.mjs for the rules.
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
          PUBLIC_REVENUECAT_WEB_CHECKOUT_URL: ${{ secrets.PUBLIC_REVENUECAT_WEB_CHECKOUT_URL }}
          PUBLIC_COACH_ENABLED: ${{ secrets.PUBLIC_COACH_ENABLED }}
          PUBLIC_ROUTE_GEN_ENABLED: ${{ secrets.PUBLIC_ROUTE_GEN_ENABLED }}
        run: node apps/web/scripts/check_production_env.mjs

      - run: npm run build --workspace=apps/web

      - name: Strip .env after build
        run: rm -f apps/web/.env

      # ──────────────────── Build Lambda zip ────────────────────

      - name: Bundle coach Lambda
        working-directory: apps/web
        run: node lambda/coach/build.mjs

      - name: Bundle share-run Lambda
        # Persona-hunt finding Casual #4. Per-request SSR handler for
        # /share/run/* + /og/run/*.png. Must run AFTER the web build so
        # apps/web/build/200.html (the SPA shell the Lambda embeds) exists.
        # The shell is adapter-static's `fallback`, and it moved off
        # index.html so the prerendered landing page could occupy that
        # name — an embed still reading index.html would bake the LANDING
        # PAGE into every share handler, 200s and 404s alike. See
        # apps/web/lambda/share-run/README.md.
        working-directory: apps/web
        run: node lambda/share-run/build.mjs

      - name: Bundle share-route Lambda
        # Web SEO parity with share-run. Per-request SSR handler for
        # /share/route/* + /og/route/*.png. Same post-build ordering
        # constraint — it embeds apps/web/build/200.html. See
        # apps/web/lambda/share-route/README.md.
        working-directory: apps/web
        run: node lambda/share-route/build.mjs

      - name: Bundle share-recap Lambda
        # Year-in-Running "Wrapped" share parity with share-run/route.
        # Per-request SSR handler for /recap/share/* + /og/recap/*.png.
        # Same post-build ordering constraint — it embeds
        # apps/web/build/200.html. See apps/web/lambda/share-recap/README.md.
        working-directory: apps/web
        run: node lambda/share-recap/build.mjs

      - name: Bundle share-badge Lambda
        # Per-badge achievement share parity with share-run/route/recap.
        # Per-request SSR handler for /share/badge/* + /og/badge/*.png.
        # Same post-build ordering constraint — it embeds
        # apps/web/build/200.html. See apps/web/lambda/share-badge/README.md.
        working-directory: apps/web
        run: node lambda/share-badge/build.mjs

      - name: Bundle share-entity Lambda
        # One HTML-only Lambda serving /share/{event,profile,club,race}
        # per-request SSR. Same post-build ordering constraint — it embeds
        # apps/web/build/200.html. See apps/web/lambda/share-entity/README.md.
        working-directory: apps/web
        run: node lambda/share-entity/build.mjs

      - name: Bundle generate-route Lambda
        # Server-side loop generation for POST /api/routes/generate. Pure
        # esbuild bundle, no SPA-shell dependency. See
        # apps/web/lambda/generate-route/README.md.
        working-directory: apps/web
        run: node lambda/generate-route/build.mjs

      - name: Bundle osrm-proxy Lambda
        # Server-side OSRM proxy for the route builder's waypoint
        # snapping/routing (GET /api/routes/osrm/*, issue #198). Pure esbuild
        # bundle. See apps/web/lambda/osrm-proxy/README.md.
        working-directory: apps/web
        run: node lambda/osrm-proxy/build.mjs

      # ──────────────────── AWS auth via OIDC ────────────────────

      - name: Pick deploy role ARN
        id: role
        env:
          ARN_PROD: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          ARN_PREVIEW: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PREVIEW }}
        run: |
          if [[ "${{ steps.env.outputs.is_prod }}" == "true" ]]; then
            ARN="$ARN_PROD"
          else
            ARN="$ARN_PREVIEW"
          fi
          # Mask the ARN before writing it to a step output so the
          # account ID embedded in it doesn't appear in subsequent
          # step logs (configure-aws-credentials masks the value
          # itself, but a step interpolating `steps.role.outputs.arn`
          # would otherwise leak it). The ARN itself is not a
          # credential — OIDC assumes the role — but the account ID
          # is identifying information.
          echo "::add-mask::$ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      # ──────────────────── Resource discovery ────────────────────
      #
      # The bucket / Lambda names are deterministic from the env. The
      # CloudFront distribution ID is discovered by alias to avoid
      # hard-coding a UUID per env.

      - name: Resolve target resources
        id: aws
        run: |
          ENV="${{ steps.env.outputs.env }}"
          echo "bucket=threkir-web-${ENV}-site" >> "$GITHUB_OUTPUT"
          echo "lambda=threkir-web-${ENV}-coach" >> "$GITHUB_OUTPUT"
          echo "share_run_lambda=threkir-web-${ENV}-share-run" >> "$GITHUB_OUTPUT"
          echo "share_route_lambda=threkir-web-${ENV}-share-route" >> "$GITHUB_OUTPUT"
          echo "share_recap_lambda=threkir-web-${ENV}-share-recap" >> "$GITHUB_OUTPUT"
          echo "share_badge_lambda=threkir-web-${ENV}-share-badge" >> "$GITHUB_OUTPUT"
          echo "share_entity_lambda=threkir-web-${ENV}-share-entity" >> "$GITHUB_OUTPUT"
          echo "generate_route_lambda=threkir-web-${ENV}-generate-route" >> "$GITHUB_OUTPUT"
          echo "osrm_proxy_lambda=threkir-web-${ENV}-osrm-proxy" >> "$GITHUB_OUTPUT"

          if [[ "$ENV" == "prod" ]]; then ALIAS="threkir.com"; else ALIAS="preview.threkir.com"; fi
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items != null && contains(Aliases.Items, '${ALIAS}')] | [0].Id" \
            --output text)
          if [[ -z "$DIST_ID" || "$DIST_ID" == "None" ]]; then
            echo "::error::could not find CloudFront distribution for alias ${ALIAS}"
            exit 1
          fi
          echo "distribution=${DIST_ID}" >> "$GITHUB_OUTPUT"

      # ──────────────────── Deploy ────────────────────

      - name: Sync static build to S3
        run: |
          # Hashed assets get a year-long immutable cache; HTML gets
          # a short cache so route-table changes propagate within the
          # next page load. app-capabilities.json rides with the HTML:
          # the native clients read it to decide whether Pro is sellable
          # (decisions §466), so an immutable year-long cache would keep
          # a mobile storefront selling a perk the deploy has turned off.
          #
          # The filter list needs nothing added for the SPA shell's move to
          # 200.html, and the reason is worth writing down because it is not
          # obvious in either direction (decisions § 1265). Pass 2's
          # `--exclude "*"` + `--include "*.html"` matches 200.html on the
          # last-match-wins rule, so it uploads with the 60 s cache like any
          # other HTML. And pass 1's `--exclude "*.html"` applies to the
          # DESTINATION listing as well as the source, so `--delete` never
          # considers an HTML key — which is the only reason index.html has
          # survived every deploy to date. `--exclude "index.html"` beside it
          # is subsumed by that glob and has been redundant since the glob was
          # added; it is left as documentation of intent.
          aws s3 sync apps/web/build/ "s3://${{ steps.aws.outputs.bucket }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "app-capabilities.json"
          aws s3 sync apps/web/build/ "s3://${{ steps.aws.outputs.bucket }}/" \
            --cache-control "public,max-age=60,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "app-capabilities.json"

      - name: Update coach Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.lambda }}" \
            --zip-file "fileb://apps/web/lambda/coach/dist/coach.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Coach Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update share-run Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.share_run_lambda }}" \
            --zip-file "fileb://apps/web/lambda/share-run/dist/share-run.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.share_run_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Share-run Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update share-route Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.share_route_lambda }}" \
            --zip-file "fileb://apps/web/lambda/share-route/dist/share-route.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.share_route_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Share-route Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update share-recap Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.share_recap_lambda }}" \
            --zip-file "fileb://apps/web/lambda/share-recap/dist/share-recap.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.share_recap_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Share-recap Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update share-badge Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.share_badge_lambda }}" \
            --zip-file "fileb://apps/web/lambda/share-badge/dist/share-badge.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.share_badge_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Share-badge Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update share-entity Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.share_entity_lambda }}" \
            --zip-file "fileb://apps/web/lambda/share-entity/dist/share-entity.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.share_entity_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Share-entity Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update generate-route Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.generate_route_lambda }}" \
            --zip-file "fileb://apps/web/lambda/generate-route/dist/generate-route.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.generate_route_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Generate-route Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Update osrm-proxy Lambda
        run: |
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name "${{ steps.aws.outputs.osrm_proxy_lambda }}" \
            --zip-file "fileb://apps/web/lambda/osrm-proxy/dist/osrm-proxy.zip" \
            --publish \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "${{ steps.aws.outputs.osrm_proxy_lambda }}" \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Osrm-proxy Lambda alias 'live' now points at version $NEW_VERSION"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.aws.outputs.distribution }}" \
            --paths "/*" > /dev/null

      # ──────────────────── Attach build to the Release (prod only) ────────────────────
      #
      # The Release already exists — it's what triggered this run. We only
      # upload the build zip back onto it (no name/notes, so the human-
      # authored title + notes aren't clobbered) so a rollback is
      # `gh release download <older-tag>` + a workflow re-run.

      - name: Package build for release
        if: steps.env.outputs.is_prod == 'true'
        run: |
          cd apps/web
          zip -qr "../../web-build-${{ steps.env.outputs.version }}.zip" build

      - name: Attach build zip to the Release
        if: steps.env.outputs.is_prod == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: web-build-${{ steps.env.outputs.version }}.zip
