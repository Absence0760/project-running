name: Release Android

# Per-app tag convention: `mobile_android@1.2.3`. The workflow parses the
# version out of the tag, injects it into the AAB, signs it with the
# release keystore from Secrets, uploads to Play Internal track, and
# attaches the AAB to a GitHub Release so there's an audit trail.
#
# Signing / upload secrets (configure under Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64       base64-encoded upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD     store password
#   ANDROID_KEY_ALIAS             alias inside the keystore
#   ANDROID_KEY_PASSWORD          key password (often same as store)
#   PLAY_SERVICE_ACCOUNT_JSON     Google Play service-account JSON key
#                                 (grant the account "Release apps to testing
#                                 tracks" on the Play Console)
#
# Production runtime config, injected as `--dart-define`s at build time
# (main.dart seeds each non-empty one into dotenv — decisions §137). Leave a
# secret unset to keep that feature fail-closed.
#
# REUSED (already set — the web + Wear OS releases inject the same ones, so
# there's a single prod source of truth, no re-pasting):
#   PUBLIC_SUPABASE_URL           prod Supabase URL                (required)
#   PUBLIC_SUPABASE_ANON_KEY      Supabase publishable key         (required)
#   PUBLIC_MAPTILER_KEY           MapTiler key — no maps without it (required)
#   PUBLIC_SENTRY_DSN             Sentry DSN (empty → Sentry off)
# (WEB_BASE_URL is a literal https://threkir.com in the build step — no secret.)
#
# MOBILE-SPECIFIC (create these):
#   MOBILE_OSRM_URL               https://osrm.threkir.com — REQUIRED or the
#                                 release route builder throws on first use
#   MOBILE_LIVE_HUB_URL           Go live-hub base URL (optional; empty →
#                                 falls back to Supabase live pings)
#   MOBILE_GOOGLE_WEB_CLIENT_ID   Google Sign-In web client id (optional)
#   MOBILE_STRAVA_CLIENT_ID       Strava OAuth client id (optional)
#   MOBILE_REVENUECAT_API_KEY_ANDROID  RevenueCat Android key (optional; empty
#                                 → Subscribe falls back to the web page)
#
# See docs/ops/releasing.md for the end-to-end flow.

# Release-triggered: publishing a GitHub Release whose tag is `mobile_android@*`
# runs this workflow — a bare `mobile_android@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `mobile_android@*` tags.
on:
  release:
    types: [published]

# Least-privilege default; the release job opts up to `contents: write`
# for the GitHub Release step.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, sign, upload to Play Internal
    runs-on: ubuntu-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on mobile_android@* releases.
    if: startsWith(github.event.release.tag_name, 'mobile_android@')
    # Pause on the `production` environment's required-reviewer rule
    # before any prod credentials/steps run (repo Settings → Environments).
    environment: production
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # git rev-list --count needs full history

      - name: Parse version from tag
        id: version
        run: |
          # `mobile_android@1.2.3` → `1.2.3`. Version code derives from
          # the total commit count so it always increases across releases
          # regardless of how versionName moves.
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#mobile_android@}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - run: dart pub global activate melos
      - run: melos bootstrap

      - name: Pin versionName / versionCode from tag
        working-directory: apps/mobile_android
        run: |
          # Flutter reads `version:` from pubspec.yaml as
          # `{versionName}+{versionCode}`. Rewrite it in place so the
          # AAB carries the tag's numbers rather than whatever's
          # committed.
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile_android/android/app/upload-keystore.jks
          cat > apps/mobile_android/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Stub the bundled dotenv asset
        # pubspec ships `.env.development` as an asset, so the file must
        # exist for the build to resolve. Release builds NEVER read it at
        # runtime (main.dart gates the load behind kDebugMode) — production
        # config comes exclusively from the `--dart-define`s below — so we
        # write an EMPTY file rather than copying `.env.example`, keeping the
        # dev localhost URLs + empty keys out of the shipped bundle.
        run: 'echo > apps/mobile_android/.env.development'

      - name: Build signed AAB
        working-directory: apps/mobile_android
        # Production config is injected as compile-time defines; main.dart's
        # `String.fromEnvironment` block seeds each non-empty one into dotenv
        # (decisions §137). Anything left unset stays fail-closed (e.g. an
        # empty RevenueCat key falls back to the web upgrade page). Dev-only
        # keys (DEV_USER_*, BYPASS_PAYWALL, *_GATE) are deliberately NOT
        # passed — release must not carry them.
        env:
          # Shared prod values reuse the SAME canonical secrets the web +
          # Wear OS releases inject — one source of truth, no web↔mobile
          # drift. Same prod Supabase project, same publishable anon key,
          # same MapTiler key. WEB_BASE_URL is a public host, passed as a
          # literal (no secret).
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          MAPTILER_KEY: ${{ secrets.PUBLIC_MAPTILER_KEY }}
          SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          # Mobile-specific secrets (create these). Any left unset stays
          # fail-closed at runtime.
          OSRM_URL: ${{ secrets.MOBILE_OSRM_URL }}
          LIVE_HUB_URL: ${{ secrets.MOBILE_LIVE_HUB_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.MOBILE_GOOGLE_WEB_CLIENT_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.MOBILE_STRAVA_CLIENT_ID }}
          REVENUECAT_API_KEY_ANDROID: ${{ secrets.MOBILE_REVENUECAT_API_KEY_ANDROID }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=MAPTILER_KEY="$MAPTILER_KEY" \
            --dart-define=WEB_BASE_URL="https://threkir.com" \
            --dart-define=OSRM_URL="$OSRM_URL" \
            --dart-define=LIVE_HUB_URL="$LIVE_HUB_URL" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=STRAVA_CLIENT_ID="$STRAVA_CLIENT_ID" \
            --dart-define=REVENUECAT_API_KEY_ANDROID="$REVENUECAT_API_KEY_ANDROID" \
            --dart-define=APP_RELEASE="${{ steps.version.outputs.name }}"

      - name: Upload to Play Internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.threkir.app
          releaseFiles: apps/mobile_android/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # Rolling out to a fraction isn't meaningful on the internal
          # track — always 100% there. Promote to beta / prod manually
          # via the Play Console once tested.

      - name: Attach AAB to the Release
        # The Release already exists — it triggered this run. Upload the
        # signed AAB onto it (no name/notes → the human-authored release
        # title + notes aren't clobbered).
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: apps/mobile_android/build/app/outputs/bundle/release/app-release.aab
