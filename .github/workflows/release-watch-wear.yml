name: Release Wear OS

# Tag: `watch_wear@1.2.3`. Builds a signed release AAB + uploads to the
# Play Internal track under a distinct `applicationId` from the phone
# app (Play lists Wear OS apps separately even when they share a phone
# app — the current release workflow treats them independently).
#
# Secrets read:
#   WATCH_WEAR_KEYSTORE_BASE64    base64-encoded upload-keystore.jks for Wear
#   WATCH_WEAR_KEYSTORE_PASSWORD
#   WATCH_WEAR_KEY_ALIAS
#   WATCH_WEAR_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON     same service account as release-android.yml
#                                 (or a second one scoped to watch_wear)
#
# The Wear keystore can be the same key as mobile_android if you want to
# share the upload identity; Play only requires that the key matches
# whatever's already associated with each package name.

# Release-triggered: publishing a GitHub Release whose tag is `watch_wear@*`
# runs this workflow — a bare `watch_wear@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `watch_wear@*` tags.
on:
  release:
    types: [published]

# Least-privilege default; the release job opts up to `contents: write`
# for the GitHub Release step.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, sign, upload Wear AAB
    runs-on: ubuntu-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on watch_wear@* releases.
    if: startsWith(github.event.release.tag_name, 'watch_wear@')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#watch_wear@}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-watch-wear-${{ hashFiles('apps/watch_wear/android/**/*.gradle*', 'apps/watch_wear/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Pin versionCode + versionName from tag
        working-directory: apps/watch_wear/android/app
        run: |
          # watch_wear's gradle file hardcodes versionCode / versionName
          # today. Rewrite those two lines in place before building so
          # the signed artifact carries the tag's numbers.
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.code }}/" build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.name }}\"/" build.gradle.kts
          grep -E 'versionCode|versionName' build.gradle.kts

      - name: Decode release keystore
        env:
          WATCH_WEAR_KEYSTORE_BASE64: ${{ secrets.WATCH_WEAR_KEYSTORE_BASE64 }}
          WATCH_WEAR_KEYSTORE_PASSWORD: ${{ secrets.WATCH_WEAR_KEYSTORE_PASSWORD }}
          WATCH_WEAR_KEY_PASSWORD: ${{ secrets.WATCH_WEAR_KEY_PASSWORD }}
          WATCH_WEAR_KEY_ALIAS: ${{ secrets.WATCH_WEAR_KEY_ALIAS }}
        run: |
          echo "$WATCH_WEAR_KEYSTORE_BASE64" | base64 -d > apps/watch_wear/android/app/upload-keystore.jks
          # Both halves mirror the mobile release workflow, which documents
          # having already hit each of them:
          #  - printf from env vars, NOT a secrets-interpolated heredoc: an
          #    unquoted heredoc shell-expands the substituted values, silently
          #    mangling a password containing a dollar sign or a backtick.
          #  - storeFile is resolved by Gradle's file() relative to the
          #    android/app module dir, not android/ where key.properties lives,
          #    so an `app/` prefix doubles into android/app/app/ and
          #    validateSigningRelease fails with "Keystore file not found".
          #    key.properties exists by then, so the release signing config is
          #    selected and the build fails hard rather than falling back.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$WATCH_WEAR_KEYSTORE_PASSWORD" "$WATCH_WEAR_KEY_PASSWORD" "$WATCH_WEAR_KEY_ALIAS" \
            > apps/watch_wear/android/key.properties

      - name: Build AAB (signed)
        working-directory: apps/watch_wear/android
        run: |
          # Use the same PUBLIC_SUPABASE_* secret names the web release
          # workflow reads — keeps a single pair of GitHub secrets in
          # sync with the Supabase project's anon key + URL across all
          # client deploys.
          ./gradlew bundleRelease \
            -PSUPABASE_URL='${{ secrets.PUBLIC_SUPABASE_URL }}' \
            -PSUPABASE_ANON_KEY='${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}' \
            --no-daemon

      - name: Upload to Play Internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.threkir.watchwear
          releaseFiles: apps/watch_wear/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Attach artifacts to the Release
        # The Release already exists — it triggered this run. Upload the
        # signed AAB onto it (no name/notes → the human-authored release
        # title + notes aren't clobbered).
        #
        # Deliberately AAB-only, matching release-android.yml. A directly
        # installable `.apk` here would be distribution outside Google
        # Play, which from 2026-09-30 requires registering
        # `com.threkir.watchwear` by hand in the Android Developer
        # Console. Play-only distribution auto-registers the package.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: apps/watch_wear/android/app/build/outputs/bundle/release/app-release.aab
