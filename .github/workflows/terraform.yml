name: Terraform

# Guards the Terraform stacks under `infra/` against three classes
# of regression:
#   1. `terraform fmt` drift — keeps the formatter idempotent so the
#      PR diff is the real change, not whitespace churn. ONE recursive
#      pass over the whole tree, not a per-stack step: a per-stack
#      `working-directory` sees only that stack's own .tf files, so
#      drift in a directory nobody listed is invisible. Measured: with
#      drift added to infra/modules/web-stack, all five per-stack steps
#      exited 0 and the recursive pass exited 3 (decisions § 1111).
#   2. `terraform validate` — syntax + provider-version + ref-shape
#      checks. Doesn't touch state (we pass `-backend=false`), so the
#      check can run without AWS credentials.
#   3. Trivy IaC mode — known-bad patterns (public S3 buckets, IAM
#      `Action: *`, security-group 0.0.0.0/0 ingress, etc.). Cheaper
#      to surface in CI than discover after `terraform apply`. Trivy
#      is reused from the security workflow so we don't introduce a
#      second IaC scanner; the same SARIF flows to the Security tab.
#      `scan-ref: infra` walks the tree, so it is not per-stack either.
#
# Called by ci.yml's `terraform` job, and by nothing else. It ran on
# its own path-filtered `push` + `pull_request` triggers until
# 2026-09-04, which made every row it produced ADVISORY: branch
# protection requires exactly one context, the `CI gate` aggregator in
# ci.yml, and a `needs:` entry cannot name a job in another workflow —
# so `fmt`, `validate` and the Trivy scan could each be red on a PR
# that merged anyway (decisions § 1149). A called workflow's jobs run
# inside the caller's run and the calling job fails when any of them
# does, so one `needs:` entry over there covers every job this file
# has and every job it gains later. The path filter moved with it, to
# the `infra` output of ci.yml's `changes` job.
#
# Stacks scanned (matrix expanded inline; keep in lockstep with
# `infra/README.md` § Layout):
#   - infra/bootstrap        (S3 state bucket — one-time; locking is
#                             S3-native, there is no DynamoDB table)
#   - infra/dns              (Route 53 zone + ACM cert)
#   - infra/github-oidc      (OIDC provider + per-env deploy roles)
#   - infra/envs/prod        (prod root module)
#   - infra/envs/preview     (preview root module)
#
# infra/modules/web-stack is deliberately NOT in the matrix:
# `terraform validate` against a module fails with "Provider
# configuration not present" because the module references an
# `aws.us_east_1` aliased provider passed in by the caller — still
# true under `configuration_aliases`, re-measured 2026-09-03. The
# module IS validated transitively, also measured: an undeclared-
# variable reference added to waf.tf fails `validate` in envs/prod.
# The matrix is therefore the validate list only. fmt and Trivy both
# walk the whole tree above, so nothing under infra/ is exempt from
# either (decisions § 1111).
#
# When adding a new stack: append it to the `stack` matrix below
# AND add a `terraform` ecosystem entry to `.github/dependabot.yml`.
# Both obligations are enforced — `scripts/check_infra_coverage.mjs`,
# run by the `infra-guards` job in ci.yml, compares this matrix and
# that manifest against the directories that actually hold `.tf`
# files, so a stack nobody listed fails the PR instead of quietly
# having one fewer green row than its siblings (decisions § 890).

on:
  workflow_call:

# A called workflow cannot escalate past what the calling job grants,
# so these are declared in BOTH places and the caller's are the ceiling.
# `pull-requests: write` used to sit here for a `terraform validate` PR
# comment nobody ever wired up; no step in this file posts anything, and
# a write scope granted to no caller of it is standing privilege.
permissions:
  contents: read
  security-events: write

jobs:
  fmt:
    name: fmt (whole tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.13.0'
          terraform_wrapper: false

      - name: terraform fmt -check
        # Recursive from infra/ rather than per stack, so a directory
        # outside the validate matrix — the web-stack module today,
        # any module added later — is still format-checked.
        # scripts/check_infra_coverage.mjs claim 1 fails the PR if a
        # Terraform directory ever falls outside this scope.
        run: terraform fmt -check -diff -recursive infra

  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        stack:
          - infra/bootstrap
          - infra/dns
          - infra/github-oidc
          - infra/envs/prod
          - infra/envs/preview

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Matches the `>= 1.13` floor pinned in every stack's
          # `versions.tf`. Bump in lockstep when the floor moves.
          terraform_version: '1.13.0'
          terraform_wrapper: false

      - name: terraform init (backend=false)
        working-directory: ${{ matrix.stack }}
        # `-backend=false` skips the S3 state lookup — `validate`
        # doesn't need it, and we don't want to give CI write access
        # to the prod state bucket just to run a syntax check.
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate -no-color

  trivy-iac:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # `scan-type: config` runs the IaC ruleset across HCL / yaml
          # / json (so it picks up the workflows too, harmlessly).
          # Trivy bundles tfsec-derived checks so we get the same
          # coverage without standing up tfsec separately.
          scan-type: config
          scan-ref: infra
          # Centralised suppressions with rationale. Inline
          # `# trivy:ignore:` comments don't accept trailing text on
          # the same line; the .trivyignore file at the repo root
          # keeps the rule IDs + per-rule rationale in one place.
          trivyignores: .trivyignore
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy IaC SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
