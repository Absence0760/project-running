# Companion to ci.yml's `CI gate`. The main CI workflow is skipped
# entirely on docs-only / *.md / .claude-only PRs (its `paths-ignore`),
# which would leave the required "CI gate" status check pending forever
# and block those PRs from merging. This workflow triggers on exactly
# the inverse path set and reports an identically named "CI gate"
# context as passing, so the required check is always satisfied.
#
# A PR that touches both code and docs triggers both workflows; both
# emit a "CI gate" check and GitHub requires all of them green — the
# real gate in ci.yml still does the gating, this one passes trivially.
#
# Keep the job name "CI gate" in lock-step with ci.yml.
name: CI gate (docs)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only change — heavy CI skipped, gate passes
        run: echo "Docs-only PR; ci.yml skipped by paths-ignore. CI gate passes trivially."
