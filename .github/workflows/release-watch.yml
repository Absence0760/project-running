name: Release Apple Watch

# Tag: `watch_ios@1.2.3`. Apple Watch apps don't ship independently on
# the App Store — they bundle with the phone app's release. This
# workflow exists so the repo can build and verify the watchOS target in
# isolation, but the canonical "ship to users" path goes through
# `release-ios.yml` once that's code-signed.

# Release-triggered: publishing a GitHub Release whose tag is `watch_ios@*`
# runs this workflow — a bare `watch_ios@*` tag push does NOT deploy. `on:
# release` fires for every published release in the repo, so the job below
# is guarded to `watch_ios@*` tags.
on:
  release:
    types: [published]

# Least-privilege default. This workflow is a build smoke-check only; it
# writes nothing back to the triggering Release, so the job needs no
# `contents: write` — checkout's `contents: read` is enough.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build watchOS target
    runs-on: macos-latest
    # Guard: `on: release` fires for every published release in the repo,
    # so only act on watch_ios@* releases.
    if: startsWith(github.event.release.tag_name, 'watch_ios@')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#watch_ios@}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build for simulator (smoke check)
        # `build` resolves the generic simulator placeholder without a
        # concrete device, so target it directly rather than a model name —
        # concrete watch-simulator names rotate with Xcode releases (the
        # hardcoded "Apple Watch Series 9" broke the test job in CI run
        # 27659555491). For `test`, which needs a real bootable simulator,
        # ci.yml's test-watch-ios job resolves a UDID via simctl.
        run: |
          xcodebuild -project apps/watch_ios/WatchApp.xcodeproj \
            -scheme WatchApp \
            -destination 'generic/platform=watchOS Simulator' \
            build
