name: Release Apple Watch

# Tag: `watch_ios@1.2.3`. Apple Watch apps don't ship independently on
# the App Store — they bundle with the phone app's release. This
# workflow exists so the repo can build and verify the watchOS target in
# isolation, but the canonical "ship to users" path goes through
# `release-ios.yml` once that's code-signed.

on:
  push:
    tags:
      - 'watch_ios@*'

# Least-privilege default; the build job opts up to `contents: write`
# for the GitHub Release step.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build watchOS target
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#watch_ios@}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build for simulator (smoke check)
        # `build` resolves the generic simulator placeholder without a
        # concrete device, so target it directly rather than a model name —
        # concrete watch-simulator names rotate with Xcode releases (the
        # hardcoded "Apple Watch Series 9" broke the test job in CI run
        # 27659555491). For `test`, which needs a real bootable simulator,
        # ci.yml's test-watch-ios job resolves a UDID via simctl.
        run: |
          xcodebuild -project apps/watch_ios/WatchApp.xcodeproj \
            -scheme WatchApp \
            -destination 'generic/platform=watchOS Simulator' \
            build

      - name: Create GitHub Release (audit record)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: Apple Watch ${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Apple Watch builds ship inside the paired iOS app (see the
            corresponding `mobile_ios@${{ steps.version.outputs.name }}`
            tag). This release is a build-only audit record.
          generate_release_notes: true
