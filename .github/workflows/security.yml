name: Security

# Static analysis + container scanning — the single home for every CodeQL
# analysis in the repo. (A separate codeql.yml used to duplicate the
# javascript-typescript and actions categories; two workflows uploading
# the same SARIF category made the alert set flip-flop between their
# different query suites and left the Security tab flagging configuration
# errors whenever either workflow failed. Merged here 2026-07-14.)
# Runs on every push to main and every PR — including docs-only changes:
# Scorecard's SAST check requires a completed scan on each recent commit,
# and a docs-only paths-ignore left commits unchecked (code-scanning
# alert 162). Also weekly, to catch CVEs disclosed since the last commit.
# Findings flow to the GitHub Security tab via SARIF.
#
# Language coverage for this monorepo's mix:
#   - javascript-typescript covers apps/web + apps/web/lambda/coach
#     + apps/backend/supabase/functions (Deno EFs)
#   - go covers BOTH Go modules — apps/job_worker and apps/graph_cycle.
#     The build step below enumerates them from the tree rather than
#     naming them, because CodeQL analyses only what the build compiles
#     and a module nobody builds is a module nobody scans (§ 1304).
#   - java-kotlin covers apps/watch_wear (native Kotlin + Compose) ONLY.
#     It claimed apps/mobile_android/android (the Flutter Gradle host) too
#     and does not reach it, for the same reason § 1304 found on the Go
#     leg: CodeQL analyses what the build steps compile, the only build
#     step below was watch_wear's, and the Go-specific autobuild fallback
#     has no Java/Kotlin analogue. That leaves 11 platform-channel bridges
#     unscanned, RunActionReceiver.kt among them. Covering them means
#     building the Flutter host, which needs the pinned SDK set up in this
#     job — a trade still to be taken. What HAS changed (§ 1352) is that the
#     build step now enumerates the Gradle projects from the tree, so a
#     third one is scanned the day it lands, and the one exclusion is a
#     declared value that `scripts/check_codeql_coverage.mjs` re-measures
#     against the tree on every PR rather than a sentence in this header.
#   - actions covers every workflow under .github/workflows/
#   - Trivy scans both Go service images — apps/job_worker and
#     apps/graph_cycle (multi-stage, final image distroless). They
#     share one pinned golang builder digest, so an unpatched stdlib
#     lands in both at once; scanning only one left the other's copy
#     of the same CVEs invisible (alerts 179-186).
#     apps/job_worker/graphhopper/Dockerfile is a JVM image built from
#     a pinned upstream tag and is not scanned here.
#
# What's deliberately NOT covered:
#   - Swift (apps/watch_ios + apps/mobile_ios/ios). CodeQL's Swift
#     analyzer requires Xcode + a macOS runner, which is ~10x the
#     ubuntu cost. The two Swift surfaces are small and pre-launch;
#     revisit once the watchOS / iOS apps grow material attack surface.
#   - Dart / Flutter (apps/mobile_*/lib, packages/*). CodeQL has no
#     Dart analyzer. We rely on `dart analyze` + the architecture-
#     guards suite in the existing CI for these.
#
# Every action below is pinned by commit SHA with the tag in a trailing
# comment, per the /audit/all GHA pinning pass.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sundays at 06:00 UTC — catches new CodeQL queries / CVEs disclosed
    # since the last commit. Offset by ~24h from audit.yml / gitleaks /
    # scorecard (Monday 06:00 UTC) so the scans don't compete for
    # hosted-runner scheduler slots.
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  # PR pushes cancel the superseded head's analysis (no point analysing a
  # stale SHA), but every push to main gets its own per-SHA group and is
  # never cancelled: back-to-back merges would otherwise race the older
  # commit's analysis into a cancellation and leave that commit without
  # the completed SAST run Scorecard checks for (code-scanning alert 162).
  group: security-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow-level permission is the least-privilege baseline; each job
# below requests the additional scopes it actually needs. Per Scorecard
# Token-Permissions guidance: prefer per-job permission blocks over a
# single elevated top-level set.
permissions: read-all

jobs:
  codeql-javascript:
    name: CodeQL (TypeScript/JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # SARIF upload requires `security-events: write`. `actions: read`
      # is needed by the analyze step's workflow-run lookup (without it
      # you get "Resource not accessible by integration" which fails the
      # whole job even when the analysis itself succeeded).
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          # Interpreted language — no compile step. Skips the autobuild
          # tracer and shaves a few minutes off each run.
          build-mode: none
          # security-and-quality is the broadest of the three suites
          # (security < security-extended < security-and-quality). For a
          # small codebase the extra noise is manageable and the
          # maintainability/correctness queries are useful.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:javascript-typescript'

  codeql-go:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Both modules declare the same patch-level Go floor, so one
          # toolchain serves both; `go build` would resolve a higher one
          # per-module anyway if that ever stopped being true.
          go-version-file: apps/job_worker/go.mod
          cache-dependency-path: |
            apps/job_worker/go.sum
            apps/graph_cycle/go.sum
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go
      - name: Build every Go module for CodeQL
        # Go has no build-less extraction: "CodeQL will analyze whatever
        # source code is built by your specified build steps", so the set of
        # modules built here IS the set of modules scanned.
        #
        # This step used to build apps/job_worker alone, under a comment
        # asserting it was "our only Go module". apps/graph_cycle has been a
        # second one since the route-loop sidecar landed — security.yml's own
        # Trivy job builds its image, and ci.yml has a `Test graph_cycle
        # sidecar (Go)` job — so its source went unscanned by CodeQL for the
        # whole of its life while its dependencies were scanned, which is the
        # worse half to be missing on a network-facing service (§ 1304).
        #
        # The single build was ALSO what suppressed the safety net. The
        # analyze action's `runAutobuildIfLegacyGoWorkflow` runs autobuild —
        # which walks every module — but skips when "at least one file of Go
        # code has already been extracted", and building job_worker extracts
        # plenty. So the explicit build did not merely fail to cover
        # graph_cycle, it turned off the thing that would have.
        #
        # Enumerated from the tree, never from a roster: a third module is
        # scanned the day it lands rather than the day someone remembers this
        # file. The floor is what keeps that honest — a `find` that stopped
        # matching would build nothing, and a Go database with no source
        # extracted is exactly the state the legacy autobuild silently
        # papers over.
        shell: bash
        run: |
          set -euo pipefail
          MODULES=$(find . -name go.mod \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -printf '%h\n' | sort)
          COUNT=$(printf '%s' "$MODULES" | grep -c . || true)
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::found $COUNT Go module(s) under the repo root; this repo has at least 2 (apps/job_worker, apps/graph_cycle). A walk that stopped matching would leave CodeQL analysing no Go source at all, so this fails rather than scanning nothing."
            exit 1
          fi
          echo "Building $COUNT Go module(s) for the CodeQL extractor:"
          printf '  %s\n' $MODULES
          for m in $MODULES; do
            echo "::group::go build ./... ($m)"
            if ! (cd "$m" && go build ./...); then
              echo "::error::go build ./... failed in $m, so CodeQL extracted none of its source. This is a build break, not a CodeQL finding; reproduce with: cd $m && go build ./..."
              exit 1
            fi
            echo "::endgroup::"
          done
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:go'

  codeql-kotlin:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: java-kotlin
      # Every Gradle project in the tree, enumerated rather than named. This
      # step used to be a single `working-directory: apps/watch_wear/android`
      # under a comment claiming "both Kotlin surfaces" were covered by it,
      # which is the § 1304 defect on the leg it was found on next: CodeQL
      # analyses what the build steps compile, so the set of projects built
      # here IS the set of projects scanned, and the java-kotlin analysis
      # reported clean over 11 files it had never read. There is no fallback
      # to catch it either — the `runAutobuildIfLegacyGoWorkflow` net that had
      # quietly been covering the Go side is Go-specific with no Java/Kotlin
      # analogue, and `build-mode: none` cannot stand in because CodeQL's
      # buildless Java extractor does not process Kotlin at all.
      #
      # A project this job cannot build yet is DECLARED below rather than
      # omitted, so the gap is a value a guard can read instead of a sentence
      # a reader has to notice. A third Gradle project is built the day it
      # lands; if it cannot be built here, CI goes red and somebody decides,
      # which is the outcome the silent version never produced.
      - name: Build every Gradle project for the CodeQL extractor
        env:
          # `<path>=<hidden-source-count>=<reason>`, one per line. Every entry
          # must name a project the walk below actually finds, so an entry
          # cannot outlive the directory it excuses, and the count is
          # RECOMPUTED from the tree rather than read: an exclusion that stops
          # saying how much it hides is one nobody is deciding any more, and a
          # bridge added to an excluded project has to be somebody's edit
          # rather than nobody's (decisions § 1500).
          # `scripts/check_codeql_coverage.mjs` in the `workflow-lint` job
          # fails the PR on a stale entry, on a walk that has stopped matching
          # the tree, on a reason left blank, and on a count that no longer
          # matches the .kt/.java files under the path.
          CODEQL_KOTLIN_UNBUILT: |
            apps/mobile_android/android=11=the Flutter Gradle host, and what stands in the way is toolchain minutes rather than a missing file. settings.gradle.kts reads flutter.sdk out of a local.properties that only the Flutter tool writes, and :app compiles against every plugin subproject melos bootstraps, so building it here makes this job a second copy of ci.yml's build-mobile-android - the pinned Flutter SDK (a fourth site check_toolchain_pins.mjs then holds in lockstep), a melos bootstrap, the pub cache and a full Gradle configuration - paid on every PR and every weekly cron. The wrapper is no longer the blocker: decisions § 1439 committed apps/mobile_android/android/gradlew, so the loop below has an executable to run here. The cheaper close is to drive the extractor from build-mobile-android, which already pays for every one of those, and that is deliberately not taken blind: that job is in the CI gate's needs: list, so a tracer that misbehaves blocks every merge rather than one workflow, and its Kotlin task is UP-TO-DATE by the time it could run - which extracts no source and reports exactly as clean as a full scan, the state § 1304 and § 1352 exist to prevent. Unread meanwhile: MainActivity.kt, RunActionReceiver.kt (a BroadcastReceiver) and the platform-channel bridges mediating health permissions, calendar access and foreground-service actions (decisions § 1352, § 1500).
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -printf '%h\n' | sort -u)
          COUNT=$(printf '%s' "$PROJECTS" | grep -c . || true)
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::found $COUNT Gradle project(s) under the repo root; this repo has at least 2 (apps/watch_wear/android, apps/mobile_android/android). A walk that stopped matching would build nothing, and a java-kotlin database with no source extracted is indistinguishable from a clean scan."
            exit 1
          fi
          BUILT=0
          for p in $PROJECTS; do
            rel=${p#./}
            reason=""
            hidden=""
            while IFS= read -r line; do
              case "$line" in
                "$rel="*)
                  rest=${line#*=}
                  hidden=${rest%%=*}
                  reason=${rest#*=}
                  ;;
              esac
            done <<< "$CODEQL_KOTLIN_UNBUILT"
            if [ -n "$reason" ]; then
              echo "::warning::$rel is NOT scanned by the java-kotlin analysis; $hidden source file(s) go unread: $reason"
              continue
            fi
            echo "::group::gradlew compileDebugKotlin ($rel)"
            if ! (cd "$p" && ./gradlew --no-daemon compileDebugKotlin); then
              echo "::error::./gradlew --no-daemon compileDebugKotlin failed in $rel, so CodeQL extracted none of its Kotlin. This is a build break, not a CodeQL finding; reproduce with: cd $rel && ./gradlew compileDebugKotlin"
              exit 1
            fi
            echo "::endgroup::"
            BUILT=$((BUILT + 1))
          done
          if [ "$BUILT" -lt 1 ]; then
            echo "::error::every Gradle project in the tree is listed in CODEQL_KOTLIN_UNBUILT, so this job extracted no Kotlin and the java-kotlin analysis will report clean over nothing. Build at least one, or delete the language from the init step rather than leaving an empty analysis in place."
            exit 1
          fi
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:java-kotlin'

  codeql-actions:
    name: CodeQL (GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: actions
          build-mode: none
          # The `actions` language only ships a `security-extended`
          # ceiling; CodeQL silently falls back to that when
          # security-and-quality isn't available. Asking for the broadest
          # anyway is the right direction to fail in — the fallback is a
          # superset of every narrower suite — but the fallback is silent, so
          # the step below reads what actually ran out of the SARIF instead of
          # leaving the workflow's request to stand as the record (§ 1503).
          queries: security-and-quality
          # Every entry below narrows this analysis, so each one carries its
          # reason in the comment lines directly above it — inside the block,
          # where they are comments in the config document CodeQL parses AND
          # where `scripts/check_codeql_coverage.mjs` reads them. A narrowing
          # here is a hole in a security scan; the guard fails the PR on one
          # bought with fewer than 40 characters of prose, on a `paths` glob
          # that has stopped matching anything, and on a rule id whose family
          # this leg cannot emit (which would filter nothing while reading as
          # a deliberate exclusion).
          config: |
            query-filters:
              # unnecessary-use-of-advanced-config suggests replacing this
              # workflow with GitHub's settings-configured "default setup".
              # The advanced config here is deliberate: explicit language
              # selection (Swift excluded for macOS-runner cost — see the
              # header), a pinned Go toolchain + explicit build, the JDK-17
              # Gradle prebuild for the Kotlin extractor, SHA-pinned actions,
              # and the Trivy SARIF upload — none of which default setup can
              # express. Filter the note out instead of dismissing four
              # alerts by hand every time an init step moves.
              - exclude:
                  id: actions/unnecessary-use-of-advanced-config
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:actions'
          # Kept on disk as well as uploaded, so the step below can read what
          # ran. Nothing else in this workflow needs its SARIF locally.
          output: sarif-results
      - name: Report the query suite that actually ran
        # `queries: security-and-quality` above is a REQUEST. CodeQL resolves
        # it against what the language ships and falls back without saying so,
        # which left the workflow asserting a suite nothing could confirm we
        # got: if a release stopped honouring the fallback or renamed the
        # suite, this leg would run something narrower and every guard reading
        # the workflow would still be green (decisions § 1503).
        #
        # The SARIF is the record of what executed, and the discriminator is
        # version-independent rather than a rule-id allowlist: the quality half
        # of `security-and-quality` is exactly the queries tagged for
        # maintainability / correctness / readability and NOT tagged security,
        # so if none of those ran, the fallback happened. Reported rather than
        # failed, because the fallback is CodeQL's decision and the suite we
        # get is still the widest one available.
        #
        # An empty rule set IS a failure: a SARIF naming no queries is an
        # analysis that ran none, and it reports exactly as clean as one that
        # ran everything — the state §§ 1304 and 1352 exist to make loud.
        shell: bash
        run: |
          set -euo pipefail
          # `find` on a missing directory exits non-zero, and under `set -e`
          # that aborts before any of the diagnoses below are printed — the one
          # failure mode of this step that would report nothing at all.
          files=$(find sarif-results -name '*.sarif' -type f 2>/dev/null | sort || true)
          if [ -z "$files" ]; then
            echo "::error::the actions analysis wrote no SARIF under sarif-results/, so nothing records which queries ran. A scan whose output cannot be read is one whose scope cannot be checked."
            exit 1
          fi
          rules='[.runs[]?.tool | (.driver.rules // []) + ([.extensions[]?.rules // []] | flatten)] | flatten'
          total=0
          quality=0
          for f in $files; do
            if ! t=$(jq "$rules | length" "$f"); then
              echo "::error::jq could not read $f as SARIF. The analysis produced a file this step cannot interpret, which leaves the query suite unmeasured exactly as an absent file would."
              exit 1
            fi
            q=$(jq "$rules
                    | map(select((.properties.tags // []) | (any(startswith(\"security\")) | not)
                          and any(. == \"maintainability\" or . == \"correctness\" or . == \"readability\" or . == \"reliability\")))
                    | length" "$f")
            total=$((total + t))
            quality=$((quality + q))
          done
          if [ "$total" -eq 0 ]; then
            echo "::error::the actions analysis names 0 queries across $files. CodeQL reported over an empty rule set, which is indistinguishable from a clean scan of everything; treat this as a broken analysis, not a quiet result."
            exit 1
          fi
          if [ "$quality" -eq 0 ]; then
            echo "::warning::the actions leg asked for security-and-quality and ran $total queries, none of them from the quality half — so CodeQL resolved the request down to its security-extended ceiling, as the init step's comment expects. Nothing is wrong; this is the fallback being observed rather than assumed."
          else
            echo "::notice::the actions leg ran $total queries, $quality of them from the quality half, so security-and-quality resolved rather than falling back."
          fi

  trivy-job-worker-image:
    name: Trivy (job_worker container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build job_worker image
        run: docker build -t job-worker:scan ./apps/job_worker

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-worker:scan
          format: sarif
          output: trivy-job-worker.sarif
          # Only fail the build on HIGH or CRITICAL — anything below is
          # noise without policy. Surfacing all severities to the
          # Security tab keeps low/medium visible without blocking PRs.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Don't fail the workflow itself — let the SARIF upload step
          # surface findings via the Security tab. PR review can decide
          # whether to bump the base image, patch, or accept the risk.
          # The job_worker Dockerfile's final stage is distroless so
          # this is expected to be quiet day-to-day; loud results mean
          # a builder-stage dep needs attention.
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-job-worker.sarif
          category: trivy-job-worker

  trivy-graph-cycle-image:
    name: Trivy (graph_cycle container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build graph_cycle image
        run: docker build -t graph-cycle:scan ./apps/graph_cycle

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: graph-cycle:scan
          format: sarif
          output: trivy-graph-cycle.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: trivy-graph-cycle.sarif
          # Distinct category — two uploads sharing one category make the
          # alert set flip-flop between whichever scan ran last.
          category: trivy-graph-cycle
