name: Security

# Static analysis + container scanning. Runs on every push to main, on PRs
# that touch code (docs-only PRs skipped), and weekly to catch CVEs
# disclosed since the last commit. Findings flow to the GitHub Security
# tab via SARIF.
#
# Adapted from project-account-payables/.github/workflows/security.yml
# for this monorepo's language mix:
#   - javascript-typescript covers apps/web + apps/web/lambda/coach
#     + apps/backend/supabase/functions (Deno EFs)
#   - go covers apps/job_worker
#   - java-kotlin covers apps/watch_wear (native Kotlin + Compose) plus
#     apps/mobile_android/android (Gradle host)
#   - actions covers every workflow under .github/workflows/
#   - Trivy scans apps/job_worker/Dockerfile (the only Dockerfile in
#     the repo; multi-stage, final image distroless).
#
# What's deliberately NOT covered:
#   - Swift (apps/watch_ios + apps/mobile_ios/ios). CodeQL's Swift
#     analyzer requires Xcode + a macOS runner, which is ~10x the
#     ubuntu cost. The two Swift surfaces are small and pre-launch;
#     revisit once the watchOS / iOS apps grow material attack surface.
#   - Dart / Flutter (apps/mobile_*/lib, packages/*). CodeQL has no
#     Dart analyzer. We rely on `dart analyze` + the architecture-
#     guards suite in the existing CI for these.
#
# Permissions in line with the existing release workflows' SHA-pinning
# discipline — every action below is pinned by commit SHA with the
# tag in a trailing comment, per the /audit/all GHA pinning pass.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    # Mondays at 06:00 UTC — catches CVEs disclosed since the last commit.
    - cron: '0 6 * * 1'

permissions:
  # SARIF upload requires `security-events: write`. `actions: read` is
  # needed by the CodeQL analyze step's telemetry / workflow-run lookup
  # (without it you get "Resource not accessible by integration" which
  # fails the whole job even when the analysis itself succeeded).
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-javascript:
    name: CodeQL (TypeScript/JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: javascript-typescript
          # Omit `queries:` to run the default suite. `security-extended`
          # and `security-and-quality` add 30-60s without material
          # additional hits on this codebase shape; revisit once the
          # SOC2-readiness checklist asks for one of them by name.
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: '/language:javascript-typescript'

  codeql-go:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: apps/job_worker/go.mod
          cache-dependency-path: apps/job_worker/go.sum
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: go
      # CodeQL's Go autobuild detects modules and runs `go build ./...`
      # in each one. Our only Go module is apps/job_worker; explicit
      # build below makes the failure mode debuggable if a downstream
      # dep ever goes ABI-incompatible.
      - name: Build job_worker for CodeQL
        working-directory: apps/job_worker
        run: go build ./...
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: '/language:go'

  codeql-kotlin:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: java-kotlin
      # Pre-fetch Gradle wrappers so CodeQL's autobuild doesn't blow
      # the network egress allowance on first run. Both Kotlin
      # surfaces live in their own Gradle projects.
      - name: Build watch_wear (Wear OS Kotlin)
        working-directory: apps/watch_wear/android
        run: ./gradlew --no-daemon compileDebugKotlin
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: '/language:java-kotlin'

  codeql-actions:
    name: CodeQL (GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: '/language:actions'

  trivy-job-worker-image:
    name: Trivy (job_worker container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build job_worker image
        run: docker build -t job-worker:scan ./apps/job_worker

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-worker:scan
          format: sarif
          output: trivy-job-worker.sarif
          # Only fail the build on HIGH or CRITICAL — anything below is
          # noise without policy. Surfacing all severities to the
          # Security tab keeps low/medium visible without blocking PRs.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Don't fail the workflow itself — let the SARIF upload step
          # surface findings via the Security tab. PR review can decide
          # whether to bump the base image, patch, or accept the risk.
          # The job_worker Dockerfile's final stage is distroless so
          # this is expected to be quiet day-to-day; loud results mean
          # a builder-stage dep needs attention.
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always()
        with:
          sarif_file: trivy-job-worker.sarif
          category: trivy-job-worker
