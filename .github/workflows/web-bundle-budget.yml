name: Web bundle budget

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/check_web_bundle_budget.mjs'
      - 'scripts/check_web_bundle_budget.test.mjs'
      - '.github/workflows/web-bundle-budget.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Stdlib-only and needs neither an install nor a build, so it runs beside the
  # measurement rather than after it: a broken guard should say so in seconds,
  # not three minutes into a vite build whose verdict it owns.
  budget-script-tests:
    name: Web bundle budget (guard tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Unit-test the budget guard
        run: node --test scripts/check_web_bundle_budget.test.mjs

  bundle-budget:
    name: Web bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - name: Build web (production)
        run: npm run build --workspace=apps/web
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          PUBLIC_MAPTILER_KEY: placeholder
          BASE_PATH: ""
      # Three ceilings over two populations — code (every reader, any language)
      # and message catalogues (one fetched per reader, so budgeted per
      # catalogue and never summed). The numbers, the measurements behind them
      # and the history of the single total ceiling this replaces all live in
      # the script's header, next to the arithmetic they govern.
      - name: Measure + assert budget
        run: node scripts/check_web_bundle_budget.mjs
