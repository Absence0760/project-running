name: gitleaks

# Secret-scan every push to main, every PR, and the full history once
# a week. Catches accidentally-committed AWS keys, Supabase service-
# role tokens, Strava client secrets, etc. — anything an automated
# pattern can recognise.
#
# CALLED by ci.yml's `gitleaks` job for the push / PR half, and
# triggered on its own only by the weekly cron. It ran on its own
# `push` + `pull_request` triggers until 2026-09-05, which made a
# found secret ADVISORY: branch protection requires exactly one
# context, the `CI gate` aggregator in ci.yml, and a `needs:` entry
# cannot name a job in another workflow — so a red gitleaks row
# merged (decisions § 1264). The action exits 1 on a detection
# (`process.exit(1)` in its `src/index.js` at the pinned SHA), and a
# called workflow's job result fans into the calling job, so that
# exit is now the merge gate it always read as.
#
# Complements existing controls:
#   - CodeQL (workflows/security.yml) — finds source-level injection
#     vulns, not secrets.
#   - Trivy (workflows/security.yml) — scans the built Docker image,
#     not the source tree.
#   - sops + AWS KMS for runtime secrets in `infra/envs/*/secrets.enc.yaml`
#     — defends correctly-stored secrets, doesn't catch a stray paste.
#
# What gitleaks adds: regex-matching against the entire working tree
# AND git history, with a built-in rule set tuned for common token
# shapes (AWS, GCP, Slack, GitHub, OpenAI, Stripe, RevenueCat, etc.).
# The free open-source action covers everything we need; the paid
# `gitleaks-pro` upgrade exists but adds little for this scale of repo.
#
# False positives go in `.gitleaks.toml` at the repo root: deliberately-
# fake test fixtures and documented dev placeholders, scoped to the exact
# secret (not the file) so a real key in the same source still fails.

on:
  workflow_call:
  schedule:
    # Weekly full-history sweep. The push / PR triggers above only
    # diff against the base, so a secret that landed on a forgotten
    # branch and got merged via fast-forward could slip through.
    - cron: '0 6 * * 1'

# A called workflow cannot escalate past what the calling job grants,
# so these are declared in BOTH places and the caller's are the ceiling.
# `security-events: write` used to sit here with a comment saying the
# action POSTs SARIF findings to the Security tab. It does not: read at
# the pinned SHA, none of gitleaks-action's four source files mentions
# `code-scanning`, `sarifs` or `security-events` at all. It writes a job
# summary, uploads a `gitleaks-results.sarif` ARTIFACT (which
# GITLEAKS_ENABLE_UPLOAD_ARTIFACT below turns off), and attempts PR
# review comments. So the scan's only signal is this job's own exit
# status, and the write scope was granted for nothing (decisions § 1264).
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-depth: 0` is required for the full-history scan
          # on the scheduled run. Push/PR triggers ignore the depth
          # because they have access to the base ref via the
          # workflow event itself.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is intentionally unset — public-repo free
          # tier covers everything we need. If we ever go private and
          # want the upstream-managed dashboard, set the license as a
          # repo secret and the action will pick it up.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          # The comment path needs `pull-requests: write`, which no caller
          # grants: it lists existing comments with the read scope, then
          # fails the POST and `core.warning`s. Off rather than warning on
          # every run about something it is not permitted to do; the job
          # summary and the exit status carry the finding.
          GITLEAKS_ENABLE_COMMENTS: 'false'
