  e2e-web-exporthub:
    needs: changes
    if: needs.changes.outputs.web_e2e == 'true'
    # The QUEUED Art 20 export rail, end-to-end (decisions.md § 717 + § 724).
    # The sharded e2e-web job runs every export spec against the
    # `export-data` Edge Function FALLBACK (PUBLIC_EXPORT_HUB_URL unset);
    # setting the hub URL there would flip all twelve onto a transport
    # they do not mock. This single, UNSHARDED job boots the real Go
    # worker — auth on, service key, draining its own `data_export`
    # queue — plus a dev server pointed at it
    # (playwright.exporthub.config.ts), so the spec drives the actual
    # enqueue → claim → tus upload into the `exports` bucket → signed
    # URL. § 717 shipped with that rail unobserved against a live stack.
    # Kept separate for the same reason as e2e-web-livehub: the Go
    # build+boot cost is paid once, not 14× across the e2e-web shards.
    name: Web e2e — queued Art 20 export (Go worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 — see e2e-web for why 22+ is mandatory (realtime-js
          # needs native WebSocket).
          node-version: 24.20.0
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/job_worker/go.mod
          cache-dependency-path: apps/job_worker/go.sum
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.84.2
      - name: Start local Supabase stack
        uses: ./.github/actions/start-supabase
      - name: Verify the seed loaded
        working-directory: apps/backend
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          seeded=$(psql "$DB_URL" -tAc "select count(*) from auth.users where email = 'runner@test.com'")
          if [ "$seeded" != "1" ]; then
            echo "::error::supabase start did not seed runner@test.com — the suite cannot sign in"
            exit 1
          fi
      - name: Verify the export queue's schema is applied
        working-directory: apps/backend
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          have=$(psql "$DB_URL" -tAc "select count(*) from pg_proc where proname = 'enqueue_data_export'")
          if [ "$have" = "0" ]; then
            echo "::error::enqueue_data_export is missing — migration 20270603_001 did not apply, so every export would 500 at the enqueue"
            exit 1
          fi
          bucket=$(psql "$DB_URL" -tAc "select count(*) from storage.buckets where id = 'exports'")
          if [ "$bucket" = "0" ]; then
            echo "::error::the exports Storage bucket is missing — migration 20270602_001 did not apply, so the archive upload would fail"
            exit 1
          fi
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - uses: ./.github/actions/install-playwright
      - name: Write apps/web/.env from supabase status
        working-directory: apps/backend
        run: |
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          {
            echo "PUBLIC_SUPABASE_URL=${API_URL}"
            echo "PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "PUBLIC_MAPTILER_KEY="
            echo "PUBLIC_STRAVA_CLIENT_ID="
            echo "PUBLIC_REVENUECAT_WEB_CHECKOUT_URL="
            echo "PUBLIC_VAPID_PUBLIC_KEY="
            echo "ANTHROPIC_API_KEY=ci-test-key-not-actually-called"
            echo "PUBLIC_BYPASS_PAYWALL=true"
          } > ../web/.env
      # playwright.exporthub.config.ts boots two webServers: the Go worker
      # (start-exporthub.sh — go build + run with auth ON, resolving the
      # Supabase creds and the JWT signing secret from `supabase status`,
      # and verifying that secret against the stack's own anon key before
      # booting) and a dev server with PUBLIC_EXPORT_HUB_URL set. Both are
      # reaped on teardown.
      - name: Sync SvelteKit generated types
        working-directory: apps/web
        run: pnpm exec svelte-kit sync
      - name: Run Playwright queued-export suite
        working-directory: apps/web
        run: pnpm exec playwright test --config=tests-e2e/playwright.exporthub.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-exporthub
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e-web-sso:
    needs: changes
    if: needs.changes.outputs.web_e2e == 'true'
    # The OAuth / SSO login path, end-to-end, against a mock OIDC
    # provider. Real Google/Apple can't run in CI and GoTrue special-cases
    # them, so config.toml's [auth.external.keycloak] is pointed at a
    # local oauth2-mock-server (apps/web/tests-e2e/scripts/start-mock-oidc.mjs)
    # and the lane drives provider:'keycloak'. Everything downstream of the
    # provider redirect is the real app code (exchangeCodeForSession ->
    # session -> the age/terms gate -> the app). Single unsharded job, same
    # shape as e2e-web-livehub. Full rationale + the keycloak-stands-in-for-
    # Google caveat: apps/web/tests-e2e/sso/README.md.
    name: Web e2e — SSO / OAuth (mock OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Non-secret test placeholders (NOT real credentials). Set at the job
      # level so config.toml's env() substitution wires GoTrue to the mock
      # when the start-supabase action runs `supabase start`. The mock binds
      # 0.0.0.0:9888; GoTrue (in the auth container) reaches it via
      # host.docker.internal, and Chromium maps that name to 127.0.0.1.
      SSO_MOCK_OIDC_CLIENT_ID: sso-e2e-client
      SSO_MOCK_OIDC_SECRET: sso-e2e-secret-not-real
      SSO_MOCK_OIDC_URL: http://host.docker.internal:9888
      SSO_MOCK_OIDC_PORT: "9888"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.84.2
      - name: Start local Supabase stack
        uses: ./.github/actions/start-supabase
      - name: Verify GoTrue picked up the keycloak provider
        run: |
          # The provider must be live for the lane to drive it. If env()
          # substitution didn't reach GoTrue the OAuth specs would fail
          # opaquely later, so fail fast here.
          #
          # Resolve the auth container by its service-name prefix instead
          # of hardcoding it. The CLI names it supabase_auth_<project_id>;
          # project_id is "project-running" (config.toml). This check was
          # first written against the dir-derived default "backend", and
          # the project_id pin (de360e4e) silently renamed the container
          # to supabase_auth_project-running — `docker exec` against the
          # stale name then failed, and the `|| true` masked it as an
          # empty value, so this guard reported a config problem that
          # didn't exist. One auth container per stack, so the prefix
          # filter is exact and survives any future project_id change.
          auth_container=$(docker ps --filter "name=supabase_auth_" --format '{{.Names}}' | head -n1)
          if [ -z "$auth_container" ]; then
            echo "::error::no supabase_auth_* container is running"
            docker ps --format '{{.Names}}' || true
            exit 1
          fi
          got=$(docker exec "$auth_container" printenv GOTRUE_EXTERNAL_KEYCLOAK_URL 2>/dev/null || true)
          if [ "$got" != "$SSO_MOCK_OIDC_URL" ]; then
            echo "::error::GoTrue keycloak url is '$got', expected '$SSO_MOCK_OIDC_URL' — config.toml env() did not reach the auth container ($auth_container)"
            exit 1
          fi
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - uses: ./.github/actions/install-playwright
      - name: Write apps/web/.env from supabase status
        working-directory: apps/backend
        run: |
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          {
            echo "PUBLIC_SUPABASE_URL=${API_URL}"
            echo "PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "PUBLIC_MAPTILER_KEY="
            echo "PUBLIC_STRAVA_CLIENT_ID="
            echo "PUBLIC_REVENUECAT_WEB_CHECKOUT_URL="
            echo "PUBLIC_VAPID_PUBLIC_KEY="
            echo "ANTHROPIC_API_KEY=ci-test-key-not-actually-called"
            echo "PUBLIC_BYPASS_PAYWALL=true"
          } > ../web/.env
      # playwright.sso.config.ts boots two webServers: the mock OIDC server
      # (start-mock-oidc.mjs) and a dedicated vite dev server on :7780.
      # Both are reaped on teardown.
      - name: Sync SvelteKit generated types
        working-directory: apps/web
        run: pnpm exec svelte-kit sync
      - name: Run Playwright SSO suite
        working-directory: apps/web
        run: pnpm exec playwright test --config=tests-e2e/playwright.sso.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-sso
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  test-watch-ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test watchOS app (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The WatchApp scheme is shared (xcshareddata/xcschemes), so the
      # test target is wired deterministically rather than relying on
      # xcodebuild auto-generating a scheme.
      #
      # Resolve the simulator by UDID at runtime instead of hardcoding a
      # device name. `xcodebuild test` needs a concrete bootable simulator
      # (unlike `build`, which resolves to the generic placeholder), and the
      # concrete watch-simulator model names rotate with every Xcode release
      # — pinning "Apple Watch Series 9" exit-70'd on the macos-15 image
      # (run 27659555491) because no device by that name existed. Querying
      # simctl for whatever watchOS simulator the image ships is stable
      # across image/Xcode bumps; the guard fails loudly with diagnostics if
      # the image has no watchOS runtime at all, rather than a cryptic 70.
      - name: Resolve a watchOS simulator
        id: watch-sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("watchOS"))
                      | .value[] | select(.isAvailable)] | .[0].udid // empty')"
          if [ -z "$udid" ]; then
            echo "No pre-created watchOS simulator; creating one."
            runtime="$(xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.identifier | test("watchOS"))
                        | select(.isAvailable)] | .[-1].identifier // empty')"
            devtype="$(xcrun simctl list devicetypes --json \
              | jq -r '[.devicetypes[] | select(.identifier | test("Apple-Watch"))]
                        | .[-1].identifier // empty')"
            if [ -z "$runtime" ] || [ -z "$devtype" ]; then
              echo "::error::No watchOS simulator runtime/device type on this runner image."
              echo "--- runtimes ---";    xcrun simctl list runtimes
              echo "--- watch devicetypes ---"; xcrun simctl list devicetypes | grep -i watch || true
              exit 1
            fi
            udid="$(xcrun simctl create ci-watch "$devtype" "$runtime")"
          fi
          echo "Using watchOS simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Pre-boot the simulator and block until the boot fully completes.
      # Left to its own devices, `xcodebuild test` boots the cold simulator
      # itself and can race its own install: the app lands on disk before
      # SpringBoard/LaunchServices finish coming up, and the launch request
      # dies with FBSOpenApplicationErrorDomain "Unknown application display
      # identifier" (RequestDenied/NotFound) — run 28709488211, exit 65 on
      # the same image/Xcode/UDID that had passed 78 minutes earlier.
      # `bootstatus -b` boots if needed and blocks until data migration +
      # SpringBoard are ready, so the install/launch always targets a
      # settled device.
      - name: Boot the simulator and wait for it to settle
        run: xcrun simctl bootstatus "${{ steps.watch-sim.outputs.udid }}" -b
      - name: Run WatchAppTests
        run: |
          xcodebuild test \
            -project apps/watch_ios/WatchApp.xcodeproj \
            -scheme WatchApp \
            -destination "platform=watchOS Simulator,id=${{ steps.watch-sim.outputs.udid }}" \
            -resultBundlePath WatchAppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-ios-xcresult
          path: WatchAppTests.xcresult
          retention-days: 7

  # Single required status check for branch protection. `main` requires
  # only this context; it fans in on every job above so adding a new CI
  # job automatically gates merges once it's listed under `needs` —
  # without having to touch the branch-protection config each time.
  #
  # `if: always()` so the gate still runs when an upstream job fails
  # (a failed dependency would otherwise skip it, leaving the required
  # check pending forever and blocking the PR). A skipped upstream job
  # counts as passing — GitHub's own required-check semantics — so a
  # `needs`-cascade skip behind a genuine failure still fails here via
  # the failing job itself.
  #
  # This workflow always runs, so it is the ONLY emitter of "CI gate" and
  # the required check always reflects real results. On a docs-only diff
  # the `changes` filter skips the heavy jobs rather than the workflow
  # skipping itself, and the skipped-counts-as-passing rule above lets the
  # gate report green without a second workflow faking the context.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - workflow-lint
      - test-packages
      - test-worker
      - test-graph-cycle
      - parity-types
      - build-web
      - env-isolation
      - parity-matrix
      - watch-ble-uuids
      - watch-wire-vectors
      - ios-native-declarations
      - watch-ios-locale-parity
      - watch-garmin-source
      - lambda-alias-coverage
      - infra-guards
      - terraform
      - gitleaks
      - build-watch-wear
      - build-firmware
      - sim-firmware
      - sim-scenarios
      - build-mobile-android
      - twin-parity
      - schema-codegen-drift
      - api-client-integration
      - cross-client-roundtrip
      - edge-functions
      - pgtap-rls
      - e2e-web
      - e2e-web-livehub
      - e2e-web-exporthub
      - e2e-web-sso
      - test-watch-ios
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
