name: CI

on:
  push:
    # Only main. A push to a feature branch is validated by its PR, and a
    # push run's job is to re-validate main itself after a merge.
    branches: [main]
  # Deliberately NOT filtered to `branches: [main]`. A stacked PR — one
  # based on another feature branch, which is the normal way to split a
  # large change into reviewable pieces — matched no filter and so ran
  # NOTHING: no CI gate, no gitleaks, no CodeQL. It reported two green
  # checks (title lint + labeller, the only two workflows without a base
  # filter) and looked healthy, which is worse than an obvious red.
  # Branch protection only requires the gate on pushes to main, so such a
  # PR could merge into its parent branch entirely unscanned.
  #
  # Gotcha worth knowing: retargeting an existing PR's base does NOT start
  # a run. `pull_request` fires on opened / synchronize / reopened, and a
  # base change is `edited`, which is not in that set. Adding `edited`
  # would rebuild ~19 jobs on every description typo — against the runner
  # budget the concurrency block below is already rationing — so it stays
  # out. Push a commit, or close and reopen the PR, to force a run.
  pull_request:

concurrency:
  # A run is ~19 jobs at ~85-90 min, and every workflow in the repo competes
  # for one hosted-runner job budget — so a superseded run left queued starves
  # the ones behind it. A merge sweep did exactly that for over an hour,
  # including the `CI gate` aggregator branch protection requires. Only a PR's
  # tip is worth building, so cancel the rest; dropping `paths-ignore` above
  # makes that pressure worse, since docs-only pushes now build too. Pushes to
  # main take a per-SHA group rather than a shared one: every merge commit
  # still gets its own validated run, and back-to-back merges run
  # independently instead of serialising behind one group.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default: every job inherits `contents: read` and
# must opt in to anything more. CodeQL's
# `actions/missing-workflow-permissions` flags individual jobs when
# the workflow lacks this top-level grant.
permissions:
  contents: read

# Opt every JS-based action (actions/checkout, actions/cache,
# supabase/setup-cli, …) into Node 24 ahead of GitHub's 2026-06-02
# forced upgrade. Without this, the runner emits a deprecation
# warning per action invocation because each one's action.yml still
# declares `runs.using: node20`.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Every `subosito/flutter-action` below is SHA-pinned but used to take
  # only `channel: stable`, so the SDK itself floated: whatever Flutter
  # was newest when a job started is what ran. On 2026-08-12 that turned
  # a green PR red with no code change — 3.47.0 (Dart 3.13) published at
  # 18:52 UTC, 51 minutes after main's last green run finished, and its
  # new `unawaited_return_in_try_block` warning fired on untouched code.
  # `dart analyze` exits 2 on any warning. Pin the version so a new
  # upstream release arrives as a deliberate bump (new lints, new
  # deprecations, engine changes) instead of at random on an unrelated
  # PR. Bump this one value to move all six jobs in this file at once —
  # and the matching one in release-android.yml + release-ios.yml, which
  # must equal it (a workflow-level `env` is per-file, so it cannot be
  # shared across the three). `scripts/check_toolchain_pins.mjs`,
  # run by the `workflow-lint` job, fails CI when they disagree.
  FLUTTER_VERSION: "3.47.0"

jobs:
  # ci.yml used to skip itself on docs-only diffs via `paths-ignore`, which
  # left the required "CI gate" context pending forever — so ci-gate-docs.yml
  # existed purely to emit a same-named passing check. A PR touching BOTH docs
  # and code triggered both workflows, and the trivial one could satisfy the
  # required check while the real jobs were still queued, letting unverified
  # code merge. Now ci.yml always runs and is the sole emitter of "CI gate";
  # the heavy jobs skip on a docs-only diff instead of the workflow skipping,
  # and the gate below already counts `skipped` as a pass.
  changes:
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      web_e2e: ${{ steps.filter.outputs.web_e2e }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Decide whether anything outside docs changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          else
            files=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null) || files=""
          fi
          # Fail OPEN: an undeterminable change list runs the full suite. The
          # cost of a needless run is minutes; the cost of wrongly skipping is
          # unverified code on main.
          if [ -z "$files" ]; then
            echo "::notice::could not determine changed files — running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "web_e2e=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::docs-only diff — heavy jobs skip, CI gate still reports"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # The Playwright suite (14 shards) plus the live-hub and SSO runs are
          # 89 of the ~139 runner-minutes a full run costs — 63%. A change
          # confined to a native client or a Dart package cannot reach any of
          # it, and paying that on a firmware-only PR is what starves the
          # runner budget during a merge sweep (see the concurrency note above).
          #
          # Written as an EXCLUSION list on purpose. The gate treats `skipped`
          # as a pass, so a filter that is too NARROW deletes coverage silently
          # — green having tested nothing. Excluding known-irrelevant trees
          # instead of listing web-relevant ones inverts that: an unrecognised
          # path (a new top-level directory, a new app) runs the suite by
          # default, and only a deliberate edit here can drop coverage.
          #
          # Deliberately NOT excluded, though they look unrelated to the web:
          #   apps/job_worker — the live-hub e2e go-builds and runs it
          #                     (apps/web/tests-e2e/scripts/start-livehub.sh)
          #   apps/backend    — the whole suite runs against a real Supabase
          #                     stack: schema, RLS, edge functions, seed
          #   root lockfiles  — how a web dependency bump actually arrives
          #                     (maplibre-gl v6 came in exactly this way)
          # bin/ IS excluded: operator + watch-sim tooling nothing in the web
          # jobs executes (the live-hub script lives under apps/web/tests-e2e/
          # scripts/, and the sim CI job replicates bin/watch-sim.sh rather
          # than calling it) — a bin/ edit alongside firmware work was pulling
          # the full Playwright suite back in.
          if echo "$files" | grep -qvE '^(docs/|\.claude/|infra/|bin/|packages/|apps/(custom_watch|watch_wear|watch_ios|watch_garmin|mobile_android|mobile_ios)/)|\.md$|^(analysis_options\.yaml|melos\.yaml|pubspec\.yaml)$'; then
            echo "web_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing the web suite can reach changed — web e2e skips"
            echo "web_e2e=false" >> "$GITHUB_OUTPUT"
          fi
          # The path filter that used to live on terraform.yml's own `push` /
          # `pull_request` triggers, moved here because the file is now CALLED
          # rather than triggered (decisions § 1149). An INCLUSION list is safe
          # for exactly this job and not for the `web_e2e` one above, because
          # the three checks read an enumerable input set and nothing else:
          # `terraform fmt -recursive infra`, `validate` on the five stacks
          # under infra/, and Trivy's `scan-ref: infra` with its suppressions
          # in the root .trivyignore. `check_infra_coverage.mjs` (in the gated
          # `infra-guards` job) fails the PR if a Terraform directory under
          # infra/ falls outside the fmt scope or the validate matrix, so the
          # set cannot widen inside infra/ without a red.
          #
          # This file is in the list because the CALLER lives here now: the
          # `terraform` job's `uses:`, its `if:` and the `security-events`
          # scope the Trivy SARIF upload needs are all edited in ci.yml, and a
          # filter that skipped on a ci.yml diff would ship a change to the
          # wiring without ever exercising it. actionlint catches a reference
          # that does not resolve; it cannot catch a permission that is too
          # narrow, which only shows up when the call actually runs.
          if echo "$files" | grep -qE '^(infra/|\.trivyignore$|\.github/workflows/(terraform|ci)\.yml$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing under infra/ changed — the Terraform checks skip"
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  # A workflow file GitHub's parser rejects never fails a PR job — it produces
  # zero-job failed runs on main and silently kills the release it gates
  # (release-android.yml was invalidated by an empty GitHub expression inside a
  # shell comment; runs 29341457271 / 29342366906, and the mobile_android@1.0.3
  # release event deployed nothing). actionlint reproduces GitHub's expression
  # parser statically so that class of break fails here, before merge.
  workflow-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Workflow lint (actionlint, toolchain pins, CI diagnoses, guard coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # -shellcheck= / -pyflakes= disable the external-linter integrations:
      # the runner image ships shellcheck, whose style findings across every
      # existing run block would fail this job. The gate's purpose is only
      # what GitHub itself enforces — workflow syntax + expression parsing.
      - name: actionlint (workflow syntax + expression parsing)
        run: |
          if ! "$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes=; then
            echo "::error::A workflow file does not parse the way GitHub parses it — bad YAML, an unknown key, or an expression GitHub would reject. Nothing here is about the toolchain pins, the CI diagnoses or the run-time-download guard; those are the other checks in this job."
            echo "The failing line above names the file, the line and the rule. Reproduce with: actionlint -shellcheck= -pyflakes= (the two linter integrations are off on purpose)."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      # decisions.md § 595 — the Flutter SDK pin is declared once per workflow
      # file, because a workflow-level `env` cannot span ci.yml and the two
      # release workflows; the melos pin is checked against pubspec.lock,
      # which `pub global activate` otherwise ignores entirely. This is what
      # stops either from drifting, and it lives here because it is a lint on
      # workflow files. The same script also fails any third-party `uses:`
      # that pins a tag instead of a commit SHA — including one inside a
      # comment, which is how release-ios.yml's TestFlight upload survived the
      # sweep that pinned everything else, and including composite actions
      # under .github/actions, which Dependabot does not scan at all.
      - name: Toolchain pin drift (Flutter + melos + Rust + Node + action SHAs + .tool-versions)
        run: |
          if ! node scripts/check_toolchain_pins.mjs; then
            echo "::error::A toolchain this build installs is unpinned or two call sites disagree — a floating Flutter SDK, a melos version that does not match pubspec.lock, an unpinned defmt-print or a stale cache key for it, a firmware rust-toolchain.toml channel that is not an exact version, an actions/setup-node step naming no node-version or naming a different one than the rest, a .tool-versions line (commented or not) disagreeing with the pin this repo enforces, or a third-party action on a mutable tag instead of a commit SHA. Nothing here is about workflow syntax or the CI diagnoses; those are other checks in this job."
            echo "The failing line above names the file, the line and the value to pin. decisions § 595 is why the Flutter version is declared once per workflow file rather than inherited from 'channel: stable'; § 911 is why .tool-versions is read against those pins, commented lines included."
            exit 1
          fi
          if ! node --test scripts/check_toolchain_pins.test.mjs; then
            echo "::error::The toolchain-pin guard's own unit tests failed. The pins themselves are fine — the check above just passed — so this is a defect in scripts/check_toolchain_pins.mjs, not pin drift."
            echo "Reproduce with: node --test scripts/check_toolchain_pins.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # A step's `if: failure()` is true for a failure anywhere earlier in the
      # job, so a diagnosis printed from one speaks for steps it cannot see —
      # parity-types' trailing step reported "database.types.ts is out of sync"
      # over a web unit-test failure and sent the reader to the migrations. This
      # fails the build on that shape anywhere in the repo, and on a check step
      # added to a bundled job without a diagnosis of its own.
      - name: CI failure diagnoses name what actually failed
        run: |
          if ! node scripts/check_ci_diagnostics.mjs; then
            echo "::error::A CI failure would go unattributed or unseen — an '::error::' printed under a bare 'if: failure()', a check step in a job that bundles several guards saying nothing of its own, or a job the 'CI gate' aggregator does not wait for. Nothing here is about workflow syntax or the toolchain pins; those are other checks in this job."
            echo "The failing line above names the file, the line and the shape to use. decisions § 764 is why the bundled jobs are derived from the guards they run rather than listed."
            exit 1
          fi
          if ! node --test scripts/check_ci_diagnostics.test.mjs; then
            echo "::error::The CI-diagnosis guard's own unit tests failed. The workflows themselves are fine — the check above just passed — so this is a defect in scripts/check_ci_diagnostics.mjs, not a misattributed diagnosis."
            echo "Reproduce with: node --test scripts/check_ci_diagnostics.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # The Edge Functions are a Deno program, so no tsconfig root covers them
      # and `scripts/tsconfig_coverage.test.mjs` exempts the tree. What covers
      # it is the `deno check` step in `edge-functions`; this asserts that step
      # still reads the WHOLE tree, by lifting its own `files=$(…)` expression
      # out of this file and running it. A lint on a workflow file, hence here
      # — and it needs no deno, no node_modules and no Docker.
      - name: Edge Function typecheck lane covers the whole tree
        run: |
          if ! node --test scripts/edge_functions_typecheck_coverage.test.mjs; then
            echo "::error::The 'Edge Function typecheck' step in the edge-functions job no longer reads the whole supabase/functions tree, so some of it is typechecked by nothing (no tsconfig root covers a Deno program). Nothing here is about workflow syntax, the toolchain pins or the CI diagnoses."
            echo "The failing assertion names the files the lane's own file-list expression now misses. Reproduce with: node --test scripts/edge_functions_typecheck_coverage.test.mjs."
            exit 1
          fi
      # The stack-start wait loop is shell inside a composite action, so it
      # runs in no job's test suite. Its accounting (a wall-clock deadline the
      # error string can be trusted to report) and its failure forensics are
      # pinned here by driving it with stub curl/docker on PATH.
      - name: Supabase stack sidecar wait loop
        run: |
          if ! node --test .github/actions/start-supabase/wait_for_sidecars.test.mjs; then
            echo "::error::The start-supabase composite action's wait loop regressed — its deadline accounting or its failure forensics. That shell runs inside a composite action, so it is in no job's test suite and this is the only thing that reads it. Nothing here is about workflow syntax, the toolchain pins or the CI diagnoses."
            echo "Reproduce with: node --test .github/actions/start-supabase/wait_for_sidecars.test.mjs (drives the loop with stub curl/docker on PATH)."
            exit 1
          fi
      # Same shape as the step above, one action over. install-playwright's
      # verification + apt fallback was inline in its action.yml, where nothing
      # could run it — and its apt branch fires only after a launch has already
      # failed, so the whole repair path shipped unexecuted (decisions § 912).
      - name: Playwright Chromium verification + apt fallback
        run: |
          if ! node --test .github/actions/install-playwright/verify_chromium.test.mjs; then
            echo "::error::The install-playwright composite action's Chromium verification regressed — the launch check, the conditional apt fallback, or the rule that the final verdict is a browser launch rather than apt's exit code. That shell runs inside a composite action, so it is in no job's test suite and this is the only thing that reads it. Nothing here is about workflow syntax, the toolchain pins or the CI diagnoses."
            echo "Reproduce with: node --test .github/actions/install-playwright/verify_chromium.test.mjs (drives the script with stub node/pnpm/sudo on PATH)."
            exit 1
          fi
      # `npm run test:scripts` was the only caller of check_root_scripts.mjs and
      # no job invoked it, so the guard enforced nothing for as long as it had
      # existed (§ 439). It reads package.json and the workspace manifests as
      # text, so it belongs in this install-free job like the rest.
      - name: Root package.json scripts name targets that exist
        run: |
          if ! node scripts/check_root_scripts.mjs; then
            echo "::error::A script in the root package.json cds into a directory that does not exist, or hands a package runner a script target its package.json does not declare. Nothing here is about action SHAs, workflow syntax, the toolchain pins or the CI diagnoses — those are the other guards in this job."
            echo "The failing line above names the script and the missing directory or target. Reproduce with: npm run test:scripts."
            exit 1
          fi
          if ! node --test scripts/check_root_scripts.test.mjs scripts/shell_lex.test.mjs; then
            echo "::error::The root-script guard or the shell lexer it reads commands with regressed. The manifest itself is fine — the check above just passed — so this is a defect in scripts/check_root_scripts.mjs or scripts/shell_lex.mjs, not a broken script target."
            echo "Reproduce with: node --test scripts/check_root_scripts.test.mjs scripts/shell_lex.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # `npx <bin>` runs whatever node_modules/.bin provides — and when nothing
      # provides it, downloads the newest thing the registry answers with and
      # executes it against this checkout. The web unit suite ran that way for
      # its whole life (decisions § 764). A lint on workflow files, hence here,
      # and it needs no install: it reads the package.json files as text.
      - name: CI runs no binary it downloads at run time
        run: |
          if ! node scripts/check_workflow_binaries.mjs; then
            echo "::error::A workflow hands a package runner (npx / pnpm exec / dlx) a binary that no package.json in this repo declares, so CI downloads an unpinned copy at run time. Nothing here is about action SHAs, the Flutter pin or the CI diagnoses — those are the other guards in this job."
            echo "The failing line above names the file, the line and the package to declare. decisions § 764 is why a run-time download is treated like an action pinned to a mutable tag."
            exit 1
          fi
          if ! node --test scripts/check_workflow_binaries.test.mjs; then
            echo "::error::The run-time-download guard's own unit tests failed. The workflows themselves are fine — the check above just passed — so this is a defect in scripts/check_workflow_binaries.mjs."
            echo "Reproduce with: node --test scripts/check_workflow_binaries.test.mjs (stdlib only, no install needed)."
            exit 1
          fi

  test-packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: dart pub global activate melos 7.8.2
      - run: melos bootstrap
      - run: cp apps/mobile_android/.env.example apps/mobile_android/.env.development
      - run: cp apps/mobile_android/.env.example apps/mobile_ios/.env.development
      # Warm Flutter's engine cache once before the parallel `melos exec`
      # below: two `flutter test` processes racing on `bin/cache/engine.stamp`
      # produces a malformed `flutter//engine_stamp.json` 404.
      - run: flutter precache
      # ui_kit and core_models carry 16 test files between them and were
      # absent from this list, so their suites — including every theme
      # guard added by the issue #666 rounds — had never run in CI.
      - run: melos exec --scope="run_recorder" --scope="mobile_android" --scope="api_client" --scope="gpx_parser" --scope="ui_kit" --scope="core_models" -- flutter test
      - run: melos exec -- dart analyze

  test-worker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test job_worker (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/job_worker/go.mod
          cache-dependency-path: apps/job_worker/go.sum
      # Nothing in .github/ read `gofmt` until now: `go vet` and the compiler
      # are both blind to formatting, so seven files under this module sat
      # unformatted on main long enough for nobody to notice. The cost is not
      # the whitespace — it is that a diff touching one of them re-aligns a
      # struct block the author did not edit, so the review reads as a bigger
      # change than it is. Same mechanism as the per-stack `terraform fmt`
      # scope § 1111 closed one tree over (decisions § 1150).
      - name: gofmt
        working-directory: apps/job_worker
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files under apps/job_worker are not gofmt-clean. Neither go vet nor go test can see formatting, so this step is the only thing in CI that reads it. Nothing here is a vet finding or a test failure; those are the other steps in this job."
            echo "$unformatted"
            echo 'Reproduce and fix with: cd apps/job_worker && gofmt -l . && gofmt -w $(gofmt -l .)'
            exit 1
          fi
      # The build is already covered by CodeQL (security.yml) + the e2e
      # live-hub job; this job is the only place `go test` runs, so the
      # personal-data export-completeness guard (and every other worker
      # test) finally gates a PR instead of only failing locally.
      - name: go vet
        working-directory: apps/job_worker
        run: |
          if ! go vet ./...; then
            echo "::error::go vet reported a suspicious construct in apps/job_worker. Nothing here is gofmt drift or a failing test; those are the other steps in this job."
            echo "Reproduce with: cd apps/job_worker && go vet ./..."
            exit 1
          fi
      # `-race`, not a plain run: this binary is the most concurrent thing in
      # the repo — an in-process pub/sub hub with per-room goroutines, a GC
      # sweeper, a bridge poller, an atomic heartbeat and six HTTP servers on
      # one mux — and until now nothing had ever put the detector over it. A
      # data race is invisible to a plain run until it corrupts something in
      # production, which is the one place it cannot be debugged. Measured
      # cost of the flag on this suite: 20 s -> 35 s.
      - name: go test
        working-directory: apps/job_worker
        run: |
          if ! go test -race ./...; then
            echo "::error::The apps/job_worker suite failed, or the race detector reported a data race. Nothing here is gofmt drift or a vet finding; those are the other steps in this job."
            echo "Reproduce with: cd apps/job_worker && go test -race ./..."
            exit 1
          fi

  test-graph-cycle:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test graph_cycle sidecar (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/graph_cycle/go.mod
          cache-dependency-path: apps/graph_cycle/go.sum
      # The same gofmt gate the worker job carries, for the reason stated
      # there. This module is gofmt-clean today; the step exists so it stays
      # that way rather than because it starts red (decisions § 1150).
      - name: gofmt
        working-directory: apps/graph_cycle
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files under apps/graph_cycle are not gofmt-clean. Neither go vet nor go test can see formatting, so this step is the only thing in CI that reads it. Nothing here is a vet finding or a test failure; those are the other steps in this job."
            echo "$unformatted"
            echo 'Reproduce and fix with: cd apps/graph_cycle && gofmt -l . && gofmt -w $(gofmt -l .)'
            exit 1
          fi
      # The graph-cycle map sidecar is a separate Go module; this is the only
      # place its foot-graph build, Dijkstra, cycle search, guard, and HTTP
      # handlers run under `go test` in CI.
      - name: go vet
        working-directory: apps/graph_cycle
        run: |
          if ! go vet ./...; then
            echo "::error::go vet reported a suspicious construct in apps/graph_cycle. Nothing here is gofmt drift or a failing test; those are the other steps in this job."
            echo "Reproduce with: cd apps/graph_cycle && go vet ./..."
            exit 1
          fi
      # `-race` for the reason the worker job states: the cycle search runs
      # concurrent workers over a shared graph, and a plain run cannot see a
      # race at all. Measured cost here: 5 s -> 5.5 s.
      - name: go test
        working-directory: apps/graph_cycle
        run: |
          if ! go test -race ./...; then
            echo "::error::The apps/graph_cycle suite failed, or the race detector reported a data race. Nothing here is gofmt drift or a vet finding; those are the other steps in this job."
            echo "Reproduce with: cd apps/graph_cycle && go test -race ./..."
            exit 1
          fi

  parity-types:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The name states everything in here, because it used to state only the
    # last step and every failure inherited that framing. Each step below
    # therefore diagnoses ITSELF: a job-level `if: failure()` cannot tell
    # which step failed, so the one that used to sit at the bottom printed
    # "database.types.ts is out of sync" over a web unit-test failure and
    # sent the reader to the migrations and the generated types, neither of
    # which was involved. `scripts/check_ci_diagnostics.mjs` is what stops a
    # new step being added here without its own diagnosis.
    name: Schema / type drift + web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 to match the Playwright shards. Needed at all
          # because the Web TS unit tests step at the bottom imports
          # third-party packages (e.g. `jszip` in backup_reader.test.ts)
          # — the runner can't resolve them without a populated workspace
          # `node_modules/`, and `tsx` itself is one of them.
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      # Cheap, deterministic guard ahead of the stack start: two migrations
      # sharing a version key (the CLI parses only the leading digits before
      # the first underscore, so `_NNN` does not disambiguate) make
      # `supabase start` die mid-apply with an opaque schema_migrations_pkey
      # collision — that took down five jobs in run 26820381977. Fail here in
      # milliseconds with a named error instead.
      #
      # The guard's own suite runs FIRST here and in the step below it: a
      # broken guard's verdict on the migration set means nothing, so saying
      # so is more useful than reporting the verdict it produced.
      - name: Migration version keys are unique
        run: |
          if ! node --test apps/backend/scripts/check_migration_versions.test.mjs; then
            echo "::error::The migration version-key guard's own unit tests failed, so its verdict on the migration set cannot be trusted. This is not schema drift."
            echo "Fix apps/backend/scripts/check_migration_versions.mjs (or its tests) first, then re-read what it says about the migrations."
            exit 1
          fi
          if ! node apps/backend/scripts/check_migration_versions.mjs; then
            echo "::error::Two migrations share a version key, so 'supabase start' would die mid-apply on a schema_migrations_pkey collision. Nothing here is about the generated types."
            echo "Rename one migration so the digits before its first underscore are unique — the Supabase CLI parses only those, so a trailing '_NNN' does not disambiguate."
            exit 1
          fi
      # A new migration that adds a CHECK/FK to a high-volume table (runs,
      # notifications, …) without the NOT VALID two-step scans every existing
      # row under a blocking lock — downtime against prod. Grandfathers the
      # shipped history; see docs/backend/migration_locks.md.
      - name: Migration online-safety (NOT VALID on guarded tables)
        run: |
          if ! node --test apps/backend/scripts/sql_lex.test.mjs; then
            echo "::error::The Postgres statement lexer the online-safety guard reads migrations with failed its own tests, so every verdict below it is a guess. This is not schema drift."
            echo "Reproduce with: node --test apps/backend/scripts/sql_lex.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
          if ! node --test apps/backend/scripts/check_migration_online_safety.test.mjs; then
            echo "::error::The migration online-safety guard's own unit tests failed, so its verdict on the migration set cannot be trusted. This is not schema drift."
            echo "Fix apps/backend/scripts/check_migration_online_safety.mjs (or its tests) first, then re-read what it says about the migrations."
            exit 1
          fi
          if ! node apps/backend/scripts/check_migration_online_safety.mjs; then
            echo "::error::A migration adds a constraint to a guarded high-volume table without the NOT VALID two-step, which would take a blocking lock against populated prod tables."
            echo "Split it into ADD CONSTRAINT ... NOT VALID plus a later VALIDATE CONSTRAINT — the playbook is docs/backend/migration_locks.md."
            exit 1
          fi
      # `revoke select (col) on t from authenticated` revokes nothing while the
      # role still holds SELECT on the whole table — Postgres resolves a
      # privilege from the broadest grant. 20260707_001 warns about it in its
      # own header; 20261229_001 and 20270213_001 shipped it anyway, and on
      # instructor_payout_accounts the host could read their raw Stripe Connect
      # id for the life of the table. No allowlist: the set is replayed and a
      # column revoke is reported only if the table-level grant survives to the
      # end, so a repair is a migration rather than an edit here.
      - name: Migration column revokes are not no-ops
        run: |
          if ! node --test apps/backend/scripts/check_migration_column_revoke_noop.test.mjs; then
            echo "::error::The column-revoke guard's own unit tests failed, so its verdict on the migration set cannot be trusted. This is not schema drift and not a lock-safety failure."
            echo "Fix apps/backend/scripts/check_migration_column_revoke_noop.mjs (or its tests) first, then re-read what it says about the migrations."
            exit 1
          fi
          if ! node apps/backend/scripts/check_migration_column_revoke_noop.mjs; then
            echo "::error::A migration revokes a privilege on named columns while the role still holds it on the whole table, so the revoke locks nothing down. Nothing here is about version keys, blocking locks or the generated types."
            echo "Use the shape 20260707_001 prescribes — revoke the TABLE-level privilege, then re-grant column by column — and register the withheld columns in apps/backend/supabase/tests/column_grant_lockdown_registry_test.sql."
            exit 1
          fi
      # The same disease one object class over, and it is IMAGE-DEPENDENT.
      # anon reaches a function through two channels — the built-in PUBLIC
      # grant and a grant of its own — and the two CLI images disagree about
      # which one a new function arrives with: 2.109.1 (workstation) gives it
      # PUBLIC only, the pinned 2.84.2 (this job, and Supabase Cloud) installs
      # an explicit anon grant. So `from public` alone withholds on one image
      # and `from anon` alone on the other; only `from public, anon` withholds
      # on both, which is why that is the house form. Same no-allowlist replay
      # as the step above: a revoke naming one channel is reported only if the
      # other is still at its default at the end of the set.
      - name: Migration EXECUTE revokes withhold on both CLI images
        run: |
          if ! node --test apps/backend/scripts/check_migration_function_revoke_noop.test.mjs; then
            echo "::error::The function-revoke guard's own unit tests failed, so its verdict on the migration set cannot be trusted. This is not schema drift, not a lock-safety failure and not the column-revoke guard."
            echo "Fix apps/backend/scripts/check_migration_function_revoke_noop.mjs (or its tests) first, then re-read what it says about the migrations."
            exit 1
          fi
          if ! node apps/backend/scripts/check_migration_function_revoke_noop.mjs; then
            echo "::error::A migration revokes EXECUTE on a function from PUBLIC or from anon but not both, so it withholds nothing on one of the two Supabase CLI images — this job's pinned 2.84.2 and prod install an explicit anon grant that a PUBLIC-revoke does not reach. Nothing here is about version keys, blocking locks, column grants or the generated types."
            echo "Name both — 'revoke execute on function <f> from public, anon;' — in that migration or a later one, and re-grant the roles that must keep it. A shipped migration is uneditable, so repair it forward in a new one."
            exit 1
          fi
      # The four `pnpm.overrides` entries are security pins, and a bot can drop
      # them. Dependabot #812 regenerated pnpm-lock.yaml without its top-level
      # `overrides:` block, and all 17 pnpm jobs then died at
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH before running anything — an error
      # naming pnpm and not the change (decisions § 730). The loud case is not
      # what this guards: a divergence that no frozen install reads leaves the
      # pins declared and not applied, silently. Sits here rather than in the
      # pnpm lanes because it is a lockfile-matches-its-source check like the
      # deno one below, it costs milliseconds, and it must report ahead of the
      # 14 shards it explains rather than inside them.
      #
      # Drift first, then the tool's own suite — the same order the deno step
      # below uses, and for the same reason: this suite's own last cases read
      # the committed tree, so running it first would report "the tool is
      # broken" over an ordinary stale lockfile.
      - name: pnpm security overrides declared and in effect
        run: |
          if ! node scripts/check_pnpm_overrides.mjs; then
            echo "::error::A pnpm.overrides security pin is missing from a lockfile or was resolved around. Nothing here is about the Supabase schema, the migrations, or the generated row types — the pins are the CVE nudges in package.json's _overrides_rationale."
            echo "Run 'pnpm install --lockfile-only' locally and commit both lockfiles; the failing line above names which pin and which resolved version broke it."
            exit 1
          fi
          if ! node --test scripts/check_pnpm_overrides.test.mjs; then
            echo "::error::The pnpm-overrides guard's own unit tests failed. The lockfiles themselves are fine — the check above just passed — so this is a defect in scripts/check_pnpm_overrides.mjs, not override drift."
            echo "Fix scripts/check_pnpm_overrides.mjs (or its tests); reproduce with: node --test scripts/check_pnpm_overrides.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # A dependency nothing imports is not merely clutter. `unplugin-icons`
      # sat in apps/web with `autoInstall: true` and no `~icons/` import
      # anywhere the build compiles, so on a miss the plugin would install a
      # package the lockfile does not carry, at build time; `normalize.css` was
      # declared in the scaffold commit and never imported at all. Both were
      # DESCRIBED as live by docs a reader would consult, which is why a
      # periodic sweep is not the answer — the sweep is the thing nobody runs
      # (decisions § 786). Reads the source trees as text, so it sits with the
      # other manifest-vs-reality checks here rather than behind an install.
      #
      # Drift first, then the tool's own suite, for the deno step's reason
      # below: this suite's last case runs the guard over the committed tree,
      # so running it first would report "the tool is broken" over an ordinary
      # dead dependency.
      - name: Declared dependencies are read by something
        run: |
          if ! node scripts/check_dead_dependencies.mjs; then
            echo "::error::A package.json declares a dependency nothing in this repo imports, reads out of node_modules, or needs for its types. Nothing here is about the Supabase schema, the migrations, the generated row types or the security overrides — those are the other checks in this job."
            echo "The failing line above names the manifest and the package. Delete it and commit both lockfiles, or add it to INDIRECT in scripts/check_dead_dependencies.mjs saying how it is consumed."
            exit 1
          fi
          if ! node --test scripts/check_dead_dependencies.test.mjs; then
            echo "::error::The dead-dependency guard's own unit tests failed. The manifests themselves are fine — the check above just passed — so this is a defect in scripts/check_dead_dependencies.mjs, not a dead dependency."
            echo "Fix scripts/check_dead_dependencies.mjs (or its tests); reproduce with: node --test scripts/check_dead_dependencies.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # deno.lock's `workspace` section is generated from the npm workspace's
      # package.json files, and drifted on every web dep bump because nothing
      # looked — six hand-sync commits between 2026-05 and 2026-07, each a
      # session that had to work out what the file was first (decisions § 706).
      # Belongs in this job rather than edge-functions: it is a
      # generated-artifact-matches-its-source check like gen:types:check below
      # it, it costs ~1 s, and it must not sit behind a Docker stack start that
      # can fail first and take the signal with it.
      #
      # deno is what writes the section (it canonicalizes the ranges), so the
      # guard needs the same toolchain the edge-functions job uses — but no
      # network and no node_modules: it stages the package.json files in a temp
      # dir and runs `deno check --no-remote` there.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      # Drift is checked BEFORE the tool's own suite, the reverse of the two
      # migration guards above. Those run their tests first because a broken
      # guard's verdict is worthless; here the suite's last case IS the drift
      # check, so running it first would report "the tool is broken" over an
      # ordinary stale lockfile. This order keeps both messages true: the
      # second can only fire once the first has established there is no drift.
      - name: deno.lock workspace section vs package.json
        run: |
          if ! npm run sync:deno-lock:check; then
            echo "::error::The 'workspace' section of deno.lock has drifted from the npm workspace's package.json files. Nothing here is about the Edge Functions' integrity pins, the migrations, or the generated row types."
            echo "Run 'pnpm sync:deno-lock' locally and commit the result — deno rewrites the section, because it canonicalizes 0.x ranges and a hand-edit does not stick."
            exit 1
          fi
          if ! node --test scripts/sync_deno_lock.test.mjs; then
            echo "::error::The deno.lock sync tool's own unit tests failed. The lockfile itself is in sync — the check above just passed — so this is a defect in scripts/sync_deno_lock.mjs, not drift."
            echo "Fix scripts/sync_deno_lock.mjs (or its tests); reproduce with: node --test scripts/sync_deno_lock.test.mjs (needs deno on PATH, two cases skip without it)."
            exit 1
          fi
      # These two checks parse source files only (no DB), so they run BEFORE
      # the Supabase stack starts. Keeping them after it meant a broken stack
      # — e.g. the run-26820381977 migration-version collision — silently
      # SKIPPED the entire web unit suite, so ~2 days of guard drift from the
      # i18n string-extraction work landed unnoticed and only surfaced once
      # the stack was fixed. Running them up front makes web-unit / constraint
      # regressions fail fast and independent of stack health.
      #
      # Drift first, then the guard's own suite — this suite's last two cases
      # read the committed migrations and types, so running it first would
      # report "the guard is broken" over an ordinary stale union.
      - name: CHECK constraints vs client vocabularies
        run: |
          if ! npm run check:check-constraints --workspace=apps/web; then
            echo "::error::A set-shaped CHECK constraint and a client vocabulary that enumerates it have drifted apart, so one client can write a value the other rejects (postgres 23514) — or a dropdown silently lacks a value the column admits. This is not database.types.ts drift. The failure names the file and the declaration, and the client may be a TS union, a const array, a Svelte option list, or a Dart enum / const list (decisions § 791)."
            echo "Update the CHECK in its migration and EVERY rail the failure names. A brand-new set-shaped CHECK column also needs a PAIRS entry in apps/web/scripts/check_constraint_unions.mjs — with its client rails, or an empty clients list plus a note saying no client enumerates it."
            exit 1
          fi
          if ! node --test apps/web/scripts/check_constraint_unions.test.mjs; then
            echo "::error::The CHECK-constraint guard's own unit tests failed. The constraints and unions themselves agree — the check above just passed — so this is a defect in apps/web/scripts/check_constraint_unions.mjs, not union drift."
            echo "Reproduce with: node --test apps/web/scripts/check_constraint_unions.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # The sibling of the step above, and the boundary between them is the
      # rails, not the subject: a CHECK's value set against the CLIENT
      # declarations that enumerate it is the step above's whole scope
      # (decisions § 791), so nothing here re-registers one. This reads every
      # other shape of a value with more than one home — a threshold copied
      # into SQL, a vocabulary copied out of it into a second SQL function, an
      # eligibility list copied from one SQL function into the next — and it is
      # code-gated with the rest of this job on purpose: every rail it reads is
      # a source file, so a docs-only diff cannot move one (decisions § 787).
      #
      # Drift first, then the guard's own suite, for the reason the step above
      # gives: that suite's last cases read the committed tree, so running it
      # first would report "the guard is broken" over ordinary drift.
      - name: Shared constants agree across every home
        run: |
          if ! node scripts/check_shared_constants.mjs; then
            echo "::error::A registered constant with more than one home no longer says the same thing in all of them — a threshold, a bucket boundary, a vocabulary or an eligible-source list written in SQL and in a client, or in two SQL functions. Nothing here is about a CHECK against its TS union (the step above), database.types.ts drift or the web unit tests."
            echo "The failing lines above name every home and the values each carries. The rails are read from source, so the fix is to make them agree — not to update a transcription; decisions § 787."
            exit 1
          fi
          if ! node --test scripts/check_shared_constants.test.mjs; then
            echo "::error::The shared-constant guard's own unit tests failed. The constants themselves agree — the check above just passed — so this is a defect in scripts/check_shared_constants.mjs, not constant drift."
            echo "Reproduce with: node --test scripts/check_shared_constants.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # The accent fold the famous-segment catalogue searches and sorts with is
      # DERIVED data on the Dart side: web computes it from `normalize('NFD')`
      # and the Unicode `Diacritic` property, which Dart's core library cannot
      # do at all, so the answer is generated into a committed table. The
      # hand-written class it replaced left 14,719 code points folding
      # differently on the two platforms — every Vietnamese letter, all of
      # Greek, every Hangul syllable — with nothing able to see it, because the
      # parity-pair registry compares the two REGISTRIES and not the two
      # behaviours (decisions § 852).
      #
      # Drift first, then the guard's own suite, for the reason the two steps
      # above give: that suite's last cases read the committed table, so running
      # it first would report "the guard is broken" over ordinary drift.
      - name: The catalogue accent-fold table is what its generator renders
        run: |
          if ! node scripts/check_catalogue_fold_table.mjs; then
            echo "::error::apps/mobile_android/lib/catalogue_fold_table.dart is not what scripts/gen_catalogue_fold_table.mjs renders, so the phone folds search keys differently from the web. Nothing here is about a CHECK constraint, a shared constant, database.types.ts or the web unit tests."
            echo "The lines above say which of the two causes it is — a hand-edit or a stale commit, or this Node's Unicode tables having moved. Both repair the same way: node scripts/gen_catalogue_fold_table.mjs, mirror the file into apps/mobile_ios/lib/, commit both."
            exit 1
          fi
          if ! node --test scripts/check_catalogue_fold_table.test.mjs; then
            echo "::error::The accent-fold-table guard's own unit tests failed. The table itself matches its generator — the check above just passed — so this is a defect in scripts/check_catalogue_fold_table.mjs or scripts/gen_catalogue_fold_table.mjs, not table drift."
            echo "Reproduce with: node --test scripts/check_catalogue_fold_table.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # `src/**`, not `src/lib/**`: the route-level source guards under
      # src/routes (e.g. the preferences i18n guard) were silently never run.
      # Invokes the package's own `test:unit` script rather than restating its
      # globs, so the documented reproduce command and the command CI runs are
      # the same string. They were not: this step spelled the globs out and ran
      # `npx tsx`, while `test:unit` invoked a bare `tsx` that no lockfile
      # installed — so the reproduce command failed with `tsx: command not
      # found` on any clean checkout, and CI fetched an unpinned tsx from the
      # registry at test time. `tsx` is a declared devDependency of apps/web
      # now, so this resolves out of `node_modules` after `npm ci`
      # (decisions § 764).
      #
      # tests-e2e/fixtures (in the script's globs) holds the Playwright harness
      # guards, which run in no Playwright shard — the config ignores
      # **/fixtures/** — so they are unit tests of the harness itself.
      - name: Web TS unit tests
        working-directory: apps/web
        run: |
          if ! npm run test:unit; then
            echo "::error::The web TypeScript unit suite failed. Nothing here involves the migrations, the Supabase schema, or the generated row types — read the failing test name above."
            echo "Reproduce locally with: npm ci && npm run test:unit --workspace=apps/web."
            exit 1
          fi
      # The Playwright tree is outside `.svelte-kit/tsconfig.json`'s include, so
      # `npm run check` (svelte-check, in build-web) never saw it, and Playwright
      # transpiles specs with esbuild without type-checking them — a spec could
      # carry a real type error indefinitely, and ten did. `tsconfig.tests-e2e.json`
      # is a second tsc root over `tests-e2e/` only; decisions § 749.
      - name: Playwright tree typecheck
        run: |
          if ! npm run check:e2e-types --workspace=apps/web; then
            echo "::error::apps/web/tests-e2e does not typecheck. Nothing here involves the migrations, the schema or the generated row types — read the TS error above."
            echo "Reproduce locally with: npm ci && npm run check:e2e-types --workspace=apps/web."
            exit 1
          fi
      # The same hole as the Playwright tree, in three more places at once:
      # apps/web/scripts, apps/web/lambda (eight production handlers) and
      # static/sw.js are outside `.svelte-kit/tsconfig.json`'s include too, so
      # `npm run check` has never read any of them. Two roots because a
      # service worker's globals come from the WebWorker lib, which cannot
      # share a program with DOM; decisions § 752.
      - name: Node + service-worker tree typecheck
        run: |
          if ! npm run check:node-types --workspace=apps/web; then
            echo "::error::apps/web's Node side (scripts/, lambda/, svelte.config.js) does not typecheck. Nothing here involves the migrations, the schema or the generated row types — read the TS error above."
            echo "Reproduce locally with: npm ci && npm run check:node-types --workspace=apps/web."
            exit 1
          fi
          if ! npm run check:sw-types --workspace=apps/web; then
            echo "::error::apps/web/static/sw.js does not typecheck. That file is the web-push service worker, shipped verbatim to every browser that registers it — nothing here is about the schema or the generated types."
            echo "Reproduce locally with: npm ci && npm run check:sw-types --workspace=apps/web."
            exit 1
          fi
          if ! npm run test:tsconfig-coverage --workspace=apps/web; then
            echo "::error::A compilable file under apps/web is inside no tsconfig root, so nothing typechecks it. The failing assertion names the files."
            echo "Reproduce locally with: npm ci && npm run test:tsconfig-coverage --workspace=apps/web."
            exit 1
          fi
      # And the same hole once more OUTSIDE apps/web, which § 752 left open on
      # purpose: this repo has no root tsconfig.json at all, so the guard
      # scripts under scripts/ and apps/backend/scripts/ — the files whose
      # verdicts every merge depends on — were in no tsc program, along with
      # the CloudFront Function that runs at the edge on every request to the
      # site. Two roots because cloudfront-js-2.0 is neither Node nor a
      # browser; decisions § 757.
      - name: Repo-root script + CloudFront tree typecheck
        run: |
          if ! npm run check:script-types; then
            echo "::error::The repo's own Node scripts (scripts/, apps/backend/scripts/, .github/, infra/) do not typecheck. Nothing here involves the migrations, the schema or the generated row types — read the TS error above."
            echo "Reproduce locally with: npm ci && npm run check:script-types."
            exit 1
          fi
          if ! npm run check:cloudfront-types; then
            echo "::error::infra/modules/web-stack/functions does not typecheck against the cloudfront-js-2.0 runtime, which has no Promise, no timers and no fetch. That code runs at the edge on every request to the site; nothing here is about the schema or the generated types."
            echo "Reproduce locally with: npm ci && npm run check:cloudfront-types."
            exit 1
          fi
          if ! npm run check:tsconfig-coverage; then
            echo "::error::A compilable file outside apps/web is inside no tsconfig root, so nothing typechecks it. The failing assertion names the files."
            echo "Reproduce locally with: npm ci && npm run check:tsconfig-coverage."
            exit 1
          fi
      # Typechecking the edge function proved it compiles; nothing ever ran
      # it. This drives `handler` against real viewer-request events — the
      # first code every visitor, crawler and API client to the site touches.
      # Stdlib only, so it needs nothing installed (decisions § 894).
      - name: CloudFront edge function behaviour
        run: |
          if ! node --test infra/modules/web-stack/functions/www_redirect.test.mjs; then
            echo "::error::The www-to-apex CloudFront Function does not behave as specified. It runs at the edge on every request to the site; nothing here is about the schema or the generated types."
            echo "Reproduce with: node --test infra/modules/web-stack/functions/www_redirect.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.84.2
      # Retry + port-cleanup rationale lives in the composite action.
      - name: Start local Supabase stack
        uses: ./.github/actions/start-supabase
      - name: Generated TS row types vs the live schema
        run: |
          if ! npm run gen:types:check --workspace=apps/backend; then
            echo "::error::apps/web/src/lib/database.types.ts is out of sync with the Supabase schema."
            echo "Run 'npm run gen:types' locally and commit the result."
            exit 1
          fi

  build-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Web build compile check + bundle budget (no deploy)
    runs-on: ubuntu-latest
    # A route that fails to compile under the pinned Svelte/Vite was only
    # caught here by chance: the main CI never production-built the web app
    # (the retired web-bundle-budget.yml ran the only `vite build`, and only
    # on pull_request — a direct push to main skipped it entirely). So a
    # Svelte compile error reached main and surfaced only because one
    # Playwright shard happened to navigate the broken route (run
    # 26844715187: the Svelte 5.56.0 `{type === ...}` text-expression
    # regression in dashboard/period/[type]/[date]). This job rebuilds every
    # route through rolldown on push AND PR, so a compile error fails loudly
    # and early instead of probabilistically through e2e sharding.
    #
    # The bundle budget measures the output of THAT build, here, rather than
    # in a workflow of its own. It used to live in web-bundle-budget.yml,
    # which was in no `needs:` of the `CI gate` aggregator — the single
    # required check — so a red budget did not block a merge however tight
    # the ceilings were (decisions § 771, § 764). Moving it costs the
    # measurement's own runtime, 0.2 s against a build already running:
    # the budget's old job spent 47 s repeating the `npm ci` + `vite build`
    # this job spends 69 s on, and deleting that duplicate gives a runner
    # slot back. Wall-clock on the gate is unchanged either way — the
    # critical path is `test-packages` at 17 min (run 33175862509) and every
    # candidate here is two orders of magnitude under it — so the choice is
    # about runner-minutes and about a failure the gate actually waits for.
    # Bundling rather than splitting is what `parity-matrix` already decided
    # for four unrelated guards: a separate job buys a second checkout and a
    # second install to say nothing a per-step diagnosis does not.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      # Stdlib-only, so it runs before the install: a broken guard should say
      # so in seconds rather than three minutes into a build whose verdict it
      # owns.
      - name: Unit-test the bundle-budget guard
        run: |
          if ! node --test scripts/check_web_bundle_budget.test.mjs; then
            echo "::error::The web bundle-budget guard's own unit tests failed, so its verdict on the build below cannot be trusted. Nothing here is about the Svelte sources, the vite build or the bundle's actual size."
            echo "Reproduce with: node --test scripts/check_web_bundle_budget.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - run: npm ci
      # The icon font apps/web ships is a SUBSET, cut to the icons the sources
      # name (decisions § 780). Nothing in a build can tell that an icon is
      # missing from it — a name with no ligature renders as the name — so the
      # coverage claim is checked here instead, by re-deriving the icon set from
      # the same sources the generator read and comparing it with the manifest
      # committed beside the font. Needs no font tooling, and runs after the
      # install so it can also confirm the upstream font has not moved under the
      # subset.
      - name: Verify the web icon-font subset covers every icon the sources name
        run: |
          if ! node --test scripts/web_icon_font.test.mjs; then
            echo "::error::The committed icon-font subset does not match apps/web's sources. Nothing here is about the bundle's size or the Svelte build — an icon named in the source and absent from the subset renders as its own name, and this is the only gate that can see that."
            echo "Reproduce with: node --test scripts/web_icon_font.test.mjs; fix with: node scripts/gen_web_icon_font.mjs (needs fontTools) and commit the font + manifest."
            exit 1
          fi
      # svelte-check is the only gate that type-checks INSIDE .svelte files:
      # `tsx --test` never loads them, and the vite build below compiles
      # Svelte without cross-module type checking. It caught a real
      # planned-vs-actual mismatch on /gym/[id] that had shipped unnoticed
      # since decisions § 304 — the reader dropped `stepIndex`, half of the
      # key that matches a logged set to its planned one. Warnings do not
      # affect its exit code, so this stays green under the two pre-existing
      # PlanEditor warnings without suppressing future ones from the log.
      - name: Type-check the Svelte sources (svelte-check)
        run: |
          if ! npm run check --workspace=apps/web; then
            echo "::error::svelte-check reports type errors inside apps/web. Nothing here is about the production build below or the bundle's size — this is the only gate that reads types across .svelte boundaries, so a route can compile and still be wrong here."
            echo "Reproduce with: npm ci && npm run check --workspace=apps/web"
            exit 1
          fi
      # This is a COMPILE GATE, not a deploy — it never uploads or
      # releases anything (the prod/preview release is tag-gated in
      # release-web.yml). The SvelteKit build resolves the PUBLIC_* keys
      # through `$env/static/public` at build time, so without them every
      # importing module fails with MISSING_EXPORT before the compiler is
      # even reached. Feed placeholder values — real secrets are irrelevant
      # to a compile check and must never appear here.
      - name: Build web (production)
        run: |
          if ! npm run build --workspace=apps/web; then
            echo "::error::The production vite build of apps/web failed. This is a compile gate and it deploys nothing — read the compiler error above. A route that fails only here and not under svelte-check is usually a Svelte/rolldown regression against the pinned versions, not a type error."
            echo "Reproduce with: npm ci && npm run build --workspace=apps/web (with the PUBLIC_* placeholders this step sets)."
            exit 1
          fi
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          PUBLIC_MAPTILER_KEY: placeholder
          BASE_PATH: ""
      # Four ceilings over three populations — code (every reader, any
      # language), message catalogues (one fetched per reader) and assets
      # (fonts, images, prerendered pages: one loaded per reader). The
      # numbers and the measurements behind them live in the script's header,
      # next to the arithmetic they govern.
      - name: Measure + assert the bundle budget
        run: |
          if ! node scripts/check_web_bundle_budget.mjs; then
            echo "::error::The web bundle is over one of its budgets. The build itself succeeded — the step above is the compile gate — so this is about size, and the failing line names which population and by how much."
            echo "Reproduce with: npm run build --workspace=apps/web && node scripts/check_web_bundle_budget.mjs"
            exit 1
          fi
      # The artifact half of three head/SEO guards, which cannot run in the job
      # that owns them. `test:unit` runs in `parity-types`, which never builds,
      # so each of these reads `build/` only when one is present and otherwise
      # reports `# no apps/web/build` — a self-skip that is indistinguishable
      # from a pass on a green row (decisions § 1115, § 1167, § 1168). Their
      # source-level cases do bind there and are not repeated here; what is
      # uncovered without this step is everything that can only be read off the
      # emitted HTML, the learn JSON-LD claims in particular, which have no
      # source-level twin at all. `npx tsx` rather than a bare `tsx`: the binary
      # is declared in apps/web's devDependencies, so the runner resolves it out
      # of node_modules rather than off the registry at run time (§ 764).
      - name: Assert the built artifact's head signals + structured data
        working-directory: apps/web
        run: |
          if ! npx tsx --test src/lib/share/spa_shell_head_signals.test.ts src/lib/seo/document_title.test.ts src/lib/seo/learn_structured_data.test.ts src/lib/seo/prerendered_head_contract.test.ts; then
            echo "::error::The built apps/web artifact does not carry the head signals or the JSON-LD these guards claim. The compile gate and the bundle budget above both passed, so this is not about whether the app builds or how big it is — it is about what the emitted HTML says."
            echo "Reproduce with: npm ci && npm run build --workspace=apps/web && cd apps/web && npx tsx --test src/lib/share/spa_shell_head_signals.test.ts src/lib/seo/document_title.test.ts src/lib/seo/learn_structured_data.test.ts src/lib/seo/prerendered_head_contract.test.ts"
            exit 1
          fi

  # Three checks over one subject: no production value reaches a dev build, no
  # dev value reaches a release build, and no live value sits in a committed
  # env file. They were a workflow of their own — env-isolation.yml, on a
  # `pull_request` path filter — so none of them appeared in the `CI gate`
  # aggregator's `needs:` list, which is the single required status check, and
  # a PR that regressed the release-build env guard merged green. That is
  # § 775's shape exactly (decisions § 862), on the guard standing between a
  # release build and a placeholder or loopback endpoint.
  #
  # The path filter is deliberately NOT reproduced here. Every step is
  # stdlib-only and install-free — no `npm ci`, no build — so running on every
  # non-docs diff costs seconds against a run measured in tens of minutes, and
  # the filter was already wrong in one direction: the scan below reads
  # apps/watch_ios/WatchApp/SupabaseService.swift, which matched no path in it,
  # so a live key pasted there was scanned by nothing. Two jobs became one, so
  # this costs a runner slot less than what it replaces.
  env-isolation:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Env isolation (dev-env guard, release-build guard, committed env files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      # Three checks under one job name, so each says which one broke
      # (decisions § 764): dev refuses to start against prod endpoints, release
      # refuses to build against placeholder / loopback ones, and no committed
      # env file carries a live value.
      - name: env_isolation tests (dev-env guard)
        run: |
          if ! node --test apps/web/scripts/env_isolation.test.mjs; then
            echo "::error::The dev-env isolation guard regressed — the check that 'npm run dev' refuses to start against a production Supabase URL. This is not the release-build guard or the committed-env-file scan; those are the other steps in this job."
            echo "Reproduce with: node --test apps/web/scripts/env_isolation.test.mjs. The override and what it does and does not cover are in docs/testing/dev_prod_isolation.md."
            exit 1
          fi
      # The guard's own CLI runs at release-web.yml tag time, where the release
      # env it asserts about exists; CI has only placeholders, so what the gate
      # can hold is this suite — which spawns that CLI against crafted envs.
      # Before it was folded in here, a regression to the guard surfaced weeks
      # later, when someone cut a release tag.
      - name: check_production_env tests (release-build guard)
        run: |
          if ! node --test apps/web/scripts/check_production_env.test.mjs; then
            echo "::error::The release-build env guard regressed — the check that a production web build refuses placeholder or loopback endpoints. This is not the dev-env guard or the committed-env-file scan; those are the other steps in this job."
            echo "Reproduce with: node --test apps/web/scripts/check_production_env.test.mjs. The guard itself runs at tag time in release-web.yml, against the release env it asserts about."
            exit 1
          fi
      - name: Committed env files carry no live values (env-example scan)
        shell: bash
        run: |
          set -euo pipefail
          # The .env.example templates AND the committed local-dev defaults
          # (gitleaks-allowlisted in .gitleaks.toml) — both must stay free of
          # any live key/URL. The dev defaults carry the PUBLIC Supabase local
          # demo JWTs, which are fine; this scan catches a real one slipping in.
          #
          # DERIVED from the index rather than listed. The list was written by
          # hand and had fallen four files behind the repo — three of the six
          # committed .env.example templates (mobile_android, mobile_ios,
          # watch_wear) and the edge runtime's own committed .env were absent
          # from it, so a step named for the .env.example scan was reading half
          # of them. gitleaks covers those four for SECRET shapes, but two of
          # the four patterns below are not secrets — a live-shaped project URL
          # and ALLOW_PROD_URL_IN_DEV=true — so nothing read them at all. A new
          # app's env file is now scanned the day it is committed.
          mapfile -t FILES < <(git ls-files -- ':(glob).env*' ':(glob)**/.env*' | grep -E '(^|/)\.env(\..+)?$')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::the committed-env scan derived NO files from the index, so every pattern below would pass over nothing. The \`git ls-files\` pathspec or the filter above it has stopped matching — this is a defect in this step, not a finding about the repo."
            exit 1
          fi
          # The one non-env file in scope, and the only entry still named by
          # hand: it hard-codes a Supabase URL in Swift, so no env-file
          # derivation reaches it. Its absence is a failure rather than a skip —
          # a rename used to drop it from the scan in silence.
          SWIFT=apps/watch_ios/WatchApp/SupabaseService.swift
          if [ ! -f "$SWIFT" ]; then
            echo "::error file=$SWIFT::this file is the scan's only hand-named entry and it is not there, so the one non-env source that hard-codes a Supabase URL is being read by nothing. Point the path at wherever it moved."
            exit 1
          fi
          FILES+=("$SWIFT")
          errors=0
          for f in "${FILES[@]}"; do
            echo "Scanning $f"
            # Live key formats — keep the regex deliberately narrow so a
            # placeholder like 'sk_live_REPLACE_ME' (which isn't a real
            # key) doesn't trip it. The marker is sk_live_/pk_live_
            # followed by 24+ hex/alphanum chars.
            if grep -E '(sk_live|pk_live)_[A-Za-z0-9]{24,}' "$f"; then
              echo "::error file=$f::Live Stripe key pattern in committed .env.example. Replace with sk_test_/pk_test_ placeholder."
              errors=$((errors+1))
            fi
            # Supabase project ref pattern is 20 lower-case letters.
            # Match only when it's wrapped in .supabase.co (live URL).
            if grep -E '[a-z]{20,}\.supabase\.co' "$f"; then
              echo "::error file=$f::Live-shaped Supabase URL in committed .env.example. Replace with http://127.0.0.1:54321."
              errors=$((errors+1))
            fi
            # Real Anthropic key prefix sk-ant-api03- followed by enough chars.
            if grep -E 'sk-ant-api[0-9]+-[A-Za-z0-9_-]{64,}' "$f"; then
              echo "::error file=$f::Anthropic API key pattern in committed .env.example. Leave the var empty."
              errors=$((errors+1))
            fi
            # ALLOW_PROD_URL_IN_DEV must NEVER be set to true in a
            # committed file — the override is for ad-hoc shell use.
            if grep -E '^ALLOW_PROD_URL_IN_DEV\s*=\s*true' "$f"; then
              echo "::error file=$f::ALLOW_PROD_URL_IN_DEV=true must not be committed. Remove or set to false."
              errors=$((errors+1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::env-example scan found $errors live-pattern violation(s) in a committed env file. Nothing regressed in a guard — the two steps above are the guards, and they just passed; a file in this repo contains something shaped like a live key or a live Supabase URL. The annotations above name the file and what to replace it with."
            exit 1
          fi
          echo "Clean."

  parity-matrix:
    name: Doc registry drift (parity matrix, iOS column, TS↔Dart pairs, checkboxes, watch counts, doc links, test counts)
    # Lightweight markdown audits of the registries that describe what ships
    # where, which helpers must move together, and how a doc says a thing is
    # only half done.
    #
    #   check_parity_matrix.dart       — walks docs/product/parity.md, asserts
    #     every row has 7 cells, uses only the legal `✓ / ✗ / Partial / N/A`
    #     symbols, flags any `Partial` row missing a Notes explanation, and
    #     refuses a pipe-leading line that belongs to no table (§ 779). It no
    #     longer carries an "iOS ahead of Android" rule — the derivation the
    #     guard below reads forbids a bare iOS `✓` outright, which subsumes it.
    #   check_parity_ios_column.mjs    — that same column against the ONE rule
    #     the document states for it, which has exactly one home
    #     (decisions § 739).
    #   check_parity_pair_registry.mjs — the TS↔Dart parity-pair list says the
    #     same thing in CLAUDE.md and in the shared-library-syncer agent's
    #     table, and every path either names exists (decisions § 604).
    #   check_twin_claims.mjs          — and the source agrees with them: a
    #     header comment declaring a cross-platform twin names a file that
    #     exists and a pair the syncer table carries. Both registries can agree
    #     perfectly about a pair that is in neither of them, which is how
    #     `turn_cues` diverged in three implementations at once
    #     (decisions § 910).
    #   check_doc_checkboxes.mjs       — a checkbox is one of the three states
    #     docs/architecture/conventions.md documents, and a `[~]` partial links
    #     the survey file carrying its still-open half. The surveys grep
    #     `- [ ]`, so a third state is invisible to them (decisions § 756).
    #   check_watch_doc_counts.mjs     — a number a custom_watch doc states
    #     ABOUT a firmware symbol is that symbol's own number, read out of the
    #     Rust (decisions § 867). It reads docs AND `apps/custom_watch/**`, so
    #     it is here rather than in the code-gated `watch-wire-vectors` job:
    #     the doc half of its input is exactly what the `changes` filter calls
    #     a docs-only diff.
    #   check_doc_links.mjs            — every relative markdown link in the
    #     repo resolves to a file that exists, and every `#anchor` on one
    #     resolves to a heading that file generates. A doc that moves leaves
    #     every link to it dead and still valid-looking.
    #   check_test_inventory_counts.mjs — a per-file test count stated in
    #     docs/testing/test_inventory.md is re-derived from the suite it
    #     describes, so the inventory cannot claim coverage the tree does not
    #     have. Reads docs AND the suites, like the guard above it.
    #
    # Seven unrelated registries under one job name, so the name cannot say
    # which drifted and every step says it for itself — the rule
    # scripts/check_ci_diagnostics.mjs derives for any job running more than
    # one guard (decisions § 764). Bundled rather than split into seven
    # jobs deliberately: seven runners and seven checkout+setup pairs to save
    # nothing a per-step diagnosis does not already say, and each split job
    # would need its own line in the CI gate's `needs:` list, where an
    # omission makes a failure invisible rather than merely unlabelled.
    #
    # Deliberately NOT gated on `needs.changes.outputs.code`. Every file these
    # guards read is markdown — docs/product/parity.md, CLAUDE.md,
    # .claude/agents/shared-library-syncer.md — and the `changes` filter
    # classifies `docs/`, `.claude/` and `*.md` as a docs-only diff. So the
    # gate skipped this job on exactly the edits it exists to police, and the
    # CI gate counts a skip as a pass. The registry drift § 604 records
    # arrived that way. The Node scripts are seconds of work; the Flutter
    # setup is the only real cost, and it is worth paying on a docs PR that can
    # silently invalidate a registry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: CLAUDE.md vs shared-library-syncer pair registry
        run: |
          if ! node --test scripts/markdown_lines.test.mjs; then
            echo "::error::The markdown lexer every guard in this job reads its input through — the soft-wrap folder and the GFM table walk — failed its own tests, so every verdict below it is a guess. This is not registry drift."
            echo "Reproduce with: node --test scripts/markdown_lines.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
          if ! node scripts/check_parity_pair_registry.mjs; then
            echo "::error::A TS<->Dart parity pair is registered in CLAUDE.md but not in the shared-library-syncer agent's table (or the reverse), or one of them points at a file that no longer exists. Nothing here is about the parity matrix, its iOS column or the doc checkboxes — those are the other three guards in this job."
            echo "The failing line above names the pair and which registry is missing it. Both are edited in the same change; decisions § 604 is why a pair in only one of them is a pair whose divergence is never detected."
            exit 1
          fi
          if ! node --test scripts/check_parity_pair_registry.test.mjs; then
            echo "::error::The parity-pair-registry guard's own unit tests failed. The two registries themselves agree — the check above just passed — so this is a defect in scripts/check_parity_pair_registry.mjs, not registry drift."
            echo "Reproduce with: node --test scripts/check_parity_pair_registry.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - name: Source twin claims are registered pairs
        run: |
          if ! node scripts/check_twin_claims.mjs; then
            echo "::error::A source header declares a cross-platform twin at a path that does not exist, or declares a pair no row of the shared-library-syncer table carries. Nothing here is about the two registries agreeing with EACH OTHER — that is the check above; this one is about the source agreeing with them."
            echo "A pair the syncer table does not carry is a pair whose divergence is never detected, while its own header reads as though it is covered. Register it in CLAUDE.md's lockstep bullet AND the syncer table, point the header at where the file moved to, or reword the header. Reproduce with: node scripts/check_twin_claims.mjs."
            exit 1
          fi
          if ! node --test scripts/check_twin_claims.test.mjs; then
            echo "::error::The twin-claim guard's own unit tests failed. The declarations themselves are fine — the check above just passed — so this is a defect in scripts/check_twin_claims.mjs, not a stale claim."
            echo "Reproduce with: node --test scripts/check_twin_claims.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # Lives HERE and not in `parity-types` — a parity.md edit is a docs-only
      # diff, so `needs.changes.outputs.code` is false, every code-gated job
      # skips, and the CI gate counts a skip as a pass. A guard for this file
      # in a gated job would never run on the PRs it polices. Same reason the
      # job comment above gives for the two guards it already carries.
      #
      # Drift first, then the tool's own suite — this suite's last two cases
      # read the committed matrix, so running it first would report "the guard
      # is broken" over an ordinary stale column.
      - name: parity.md iOS column matches its one stated rule
        run: |
          if ! node scripts/check_parity_ios_column.mjs; then
            echo "::error::docs/product/parity.md's iOS column does not match the rule the document states for it, or that rule is stated in more than one place. Nothing here is about the TS<->Dart parity pairs or the matrix's table structure — those are the two other guards in this job."
            echo "The failing line above names the row (or the second statement) and the fix. The rule itself is the <!-- parity-ios-rule --> block in the doc; decisions § 739 is why it has exactly one home."
            exit 1
          fi
          if ! node --test scripts/check_parity_ios_column.test.mjs; then
            echo "::error::The iOS-column guard's own unit tests failed. The matrix itself is fine — the check above just passed — so this is a defect in scripts/check_parity_ios_column.mjs, not column drift."
            echo "Reproduce with: node --test scripts/check_parity_ios_column.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - name: Doc checkboxes use a documented state and name their follow-up
        run: |
          if ! node scripts/check_doc_checkboxes.mjs; then
            echo '::error::A Markdown checkbox uses a state nothing documents, or a [~] partial names no follow-up. Neither is about the parity matrix or the TS<->Dart pairs — those are the other guards in this job.'
            echo 'The failing lines above name the file, the line and the fix. The vocabulary is the <!-- doc-checkbox-states --> block in docs/architecture/conventions.md; decisions § 756 is why a partial has to link docs/product/followups.md or roadmap.md.'
            exit 1
          fi
          if ! node --test scripts/check_doc_checkboxes.test.mjs; then
            echo "::error::The doc-checkbox guard's own unit tests failed. The docs themselves are fine — the check above just passed — so this is a defect in scripts/check_doc_checkboxes.mjs, not checkbox drift."
            echo "Reproduce with: node --test scripts/check_doc_checkboxes.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - name: custom_watch doc counts vs the enums and consts they describe
        run: |
          if ! node scripts/check_watch_doc_counts.mjs; then
            echo "::error::A docs/custom_watch or apps/custom_watch doc states a count that the firmware symbol it describes no longer holds, or states one no template in the registry reads. Nothing here is about the parity matrix, its iOS column, the TS<->Dart pairs or the doc checkboxes — those are the other four guards in this job."
            echo "The failing line names the sentence, the number it states and the symbol's own value. The Rust declares the number; the prose restates it, so fix the prose — or write the sentence count-free, which is the fix decisions § 867 prefers. A count the registry does not read must be registered or exempted with a reason."
            exit 1
          fi
          if ! node --test scripts/check_watch_doc_counts.test.mjs; then
            echo "::error::The watch-doc-count guard's own unit tests failed. The docs themselves agree with the firmware — the check above just passed — so this is a defect in scripts/check_watch_doc_counts.mjs, not count drift."
            echo "Reproduce with: node --test scripts/check_watch_doc_counts.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # Both guards read markdown that no other job's guards read, and both
      # are stdlib-only, so they land here for the reason this job's header
      # already gives: `check_doc_links.mjs` resolves relative links and
      # heading anchors across every `.md` in the repo, and
      # `check_test_inventory_counts.mjs` re-derives every per-file test count
      # docs/testing/test_inventory.md states. A docs-only diff is exactly the
      # diff that breaks either, and every gated job skips on one.
      - name: Relative doc links and heading anchors resolve
        run: |
          if ! node scripts/check_doc_links.mjs; then
            echo "::error::A relative markdown link points at a file that does not exist, or at a heading anchor no heading in the target file generates. Nothing here is about the parity registries, the doc checkboxes, the watch counts or the test-inventory numbers — those are the other guards in this job."
            echo "The failing line above names the source file, the line and the target it could not resolve. Fix the link, or add the heading it names. Reproduce with: node scripts/check_doc_links.mjs."
            exit 1
          fi
          if ! node --test scripts/check_doc_links.test.mjs; then
            echo "::error::The doc-link guard's own unit tests failed. The links themselves resolve — the check above just passed — so this is a defect in scripts/check_doc_links.mjs, not a broken link."
            echo "Reproduce with: node --test scripts/check_doc_links.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - name: test_inventory.md counts match the suites they describe
        run: |
          if ! node scripts/check_test_inventory_counts.mjs; then
            echo "::error::A per-file test count stated in docs/testing/test_inventory.md is not the count that file's suite actually declares. Nothing here is about relative doc links, the parity registries, the doc checkboxes or the watch counts — those are the other guards in this job."
            echo "The failing line above names the entry, the number it states and the number re-derived from the suite. The suite declares the number; the inventory restates it, so fix the inventory. Reproduce with: node scripts/check_test_inventory_counts.mjs."
            exit 1
          fi
          if ! node --test scripts/check_test_inventory_counts.test.mjs; then
            echo "::error::The test-inventory-count guard's own unit tests failed. The inventory itself agrees with the suites — the check above just passed — so this is a defect in scripts/check_test_inventory_counts.mjs, not count drift."
            echo "Reproduce with: node --test scripts/check_test_inventory_counts.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # Named and self-diagnosing like the three above it. It was neither: an
      # unnamed step is displayed by its command, which reads as a diagnosis
      # right up until the reader has to work out which of four registries
      # `check_parity_matrix.dart` is about.
      - name: parity.md table structure — columns, symbols, Partial needs Notes
        run: |
          if ! dart run scripts/check_parity_matrix.dart; then
            echo "::error::docs/product/parity.md's table is malformed — a row without 7 cells, a symbol outside \`✓ / ✗ / Partial / N/A\`, a \`Partial\` with no Notes, or a pipe-leading line belonging to no table at all. Nothing here is about the TS<->Dart pairs or the doc checkboxes — those are two of the other guards in this job."
            echo "The failing line above names the row and the cell. Reproduce with: dart run scripts/check_parity_matrix.dart."
            exit 1
          fi
          if ! node --test scripts/check_parity_matrix.test.mjs; then
            echo "::error::The matrix guard's own unit tests failed. The matrix itself is fine — the check above just passed — so this is a defect in scripts/check_parity_matrix.dart, not table drift."
            echo "Reproduce with: node --test scripts/check_parity_matrix.test.mjs (stdlib only, but it drives the guard as a process, so it needs the Dart SDK the step above already set up)."
            exit 1
          fi

  watch-ble-uuids:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Watch ↔ phone GATT UUID drift
    # decisions.md § 416 — the firmware's GATT table in
    # apps/custom_watch/app/src/tasks/ble.rs is the source of truth for its own
    # UUIDs, and the phone's reactive_ble_watch_transport.dart must point at the
    # same rows. That path has never run on hardware and cannot be simulated
    # (§ 210), so a shifted row is invisible until a board exists — § 410 was
    # exactly that, and watch→phone run sync could not have worked at all. The
    # script parses both sources rather than transcribing either; without a job
    # running it, it enforced nothing. Only the Android copy is read: the iOS
    # twin is byte-identical by the twin-parity job (§ 39).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Firmware GATT table vs phone client constants
        run: |
          if ! node scripts/check_watch_ble_uuids.mjs; then
            echo "::error::The phone's BLE characteristic UUIDs no longer match the watch firmware's GATT table. The failing line names the ble.rs row, the Dart constant and the value to set. decisions.md § 410 is the drift this catches; ble.rs is the source of truth."
            exit 1
          fi
          if ! node --test scripts/check_watch_ble_uuids.test.mjs; then
            echo "::error::The GATT-drift guard's own unit tests failed. The two tables are fine — the check above just passed — so this is a defect in scripts/check_watch_ble_uuids.mjs, not UUID drift."
            echo "Reproduce with: node --test scripts/check_watch_ble_uuids.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # Both of the guard's parsers used to read UUIDs out of comments, so a
      # stale table quoted in each file's prose agreed with itself while both
      # declarations had drifted (decisions § 773). This is the lexer that
      # stopped it, and it is exercised by nothing else.
      - name: Rust and Dart comment blanking
        run: |
          if ! node --test scripts/comment_strip.test.mjs; then
            echo "::error::The comment blanker scripts/check_watch_ble_uuids.mjs reads both its sources through regressed. The GATT tables themselves are fine — the check above just passed — so this is a defect in scripts/comment_strip.mjs, not UUID drift."
            echo "Reproduce with: node --test scripts/comment_strip.test.mjs (stdlib only, no install needed)."
            exit 1
          fi

  watch-wire-vectors:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Watch wire vectors + cross-rail constants
    # decisions.md § 793 — every CRS1 / WKT1 / RBK1 / SCR1 / SET1 / TRK1 golden
    # vector exists twice, a Rust test recomputing it from the firmware encoder
    # and a Dart test recomputing it from the phone encoder, and until this job
    # nothing compared the two hex strings. Both rails carried a failure message
    # reading "update BOTH this vector and the … mirror", which is an
    # instruction, not an enforcement: a one-sided change fails only the rail
    # that moved. Neither suite can make the comparison — cargo test cannot see
    # a Dart file and flutter test cannot see a Rust one — so it happens here,
    # alongside the values restated on the Swift, Kotlin and Monkey C rails.
    # Only the Android copies are read: the iOS twin is byte-identical by the
    # twin-parity job (§ 39).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Firmware golden vectors vs the phone encoder's, and the shared constants
        run: |
          if ! node scripts/check_watch_wire_vectors.mjs; then
            echo "::error::A watch wire format or a cross-rail constant no longer agrees between its rails. The failing line names both files and the value each holds; every figure is read from the source, so fix the rail that moved rather than the vector. decisions.md § 793."
            exit 1
          fi
      - name: The wire-vector guard's own unit tests
        run: |
          if ! node --test scripts/check_watch_wire_vectors.test.mjs; then
            echo "::error::The wire-vector guard's own unit tests failed. The rails themselves are fine — the check above just passed — so this is a defect in scripts/check_watch_wire_vectors.mjs, not wire drift."
            echo "Reproduce with: node --test scripts/check_watch_wire_vectors.test.mjs (stdlib only, no install needed)."
            exit 1
          fi
      # The same shape one file over: navigation.md's page-cycle diagram is
      # page.rs's own `next()` chain drawn out, and the § 793 sweep found it
      # missing the § 376 storm page. The Page declaration order is the bit
      # order of the 64-bit SET1 pages mask, so a gap in the drawing puts every
      # page after it off by one for anyone deriving a bit position from it.
      - name: Firmware page cycle vs the navigation diagram
        run: |
          if ! node scripts/check_watch_page_ring.mjs; then
            echo "::error::docs/custom_watch/navigation.md's page ring no longer matches page.rs's next() chain. The failing lines name each edge that is declared-but-undrawn or drawn-but-not-declared. page.rs is the source of truth for its own cycle."
            exit 1
          fi
      - name: The page-ring guard's own unit tests
        run: |
          if ! node --test scripts/check_watch_page_ring.test.mjs; then
            echo "::error::The page-ring guard's own unit tests failed. The ring itself agrees — the check above just passed — so this is a defect in scripts/check_watch_page_ring.mjs, not ring drift."
            echo "Reproduce with: node --test scripts/check_watch_page_ring.test.mjs (stdlib only, no install needed)."
            exit 1
          fi

  ios-native-declarations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: iOS capability declarations vs the code that needs them
    # decisions.md § 742 — an iOS capability the Dart exercises but the
    # Info.plist / Runner.entitlements does not declare fails SILENTLY: iOS
    # denies the permission or refuses the session, the feature returns
    # nothing, and no exception surfaces. Spoken cues stopping the moment the
    # phone pockets, and a push token that never arrives, were both exactly
    # that shape.
    #
    # A `group('iOS Info.plist')` in architecture_guards_test.dart used to read
    # these files, but every assertion sat behind `if (!file.existsSync())
    # return;` and the only package where they exist — mobile_ios — is not in
    # the `test-packages` job's `melos exec --scope=` list. Twelve tests, zero
    # executions: the § 741 shape, a verdict decided by the environment rather
    # than by the code. Hence a repo-level job that always runs.
    #
    # The script DERIVES each requirement from the source that obliges it
    # (§ 739 / § 740) rather than restating the plist, so deleting the code
    # deletes the requirement and adding a capability fails until it is
    # declared. Its own `node --test` suite runs beside it because a parser
    # that silently stops matching passes vacuously.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      # Drift first, then the tool's own suite — the suite's last two cases
      # read the committed tree, so running it first would report "the guard is
      # broken" over an ordinary undeclared capability.
      - name: Info.plist + Runner.entitlements vs the Dart and Swift that need them
        run: |
          if ! node scripts/check_ios_native_declarations.mjs; then
            echo "::error::apps/mobile_ios declares iOS capabilities that do not match the code that needs them — a missing UIBackgroundModes entry, a missing entitlement, a missing usage-description string, or a background mode nothing exercises. Nothing here is about Dart source, the twin invariant or the parity matrix."
            echo "The failing line above names the source file whose behaviour obliges the declaration and the exact fix. decisions.md § 742 is why the requirement is derived from the code rather than listed."
            exit 1
          fi
          if ! node --test scripts/check_ios_native_declarations.test.mjs; then
            echo "::error::The iOS-declaration guard's own unit tests failed. The committed tree is fine — the check above just passed — so this is a defect in scripts/check_ios_native_declarations.mjs, not a missing declaration."
            echo "Reproduce with: node --test scripts/check_ios_native_declarations.test.mjs (stdlib only, no install needed)."
            exit 1
          fi

  watch-ios-locale-parity:
    name: watchOS source-level guards (catalog, declarations, duplicated sources)
    # decisions.md § 761 — apps/watch_ios/scripts/check_xcstrings_parity.sh has
    # existed since the catalog did and ran in NO job: a translation missing
    # from Localizable.xcstrings, or a locale translated but absent from
    # CFBundleLocalizations / knownRegions, reached a Mac unchallenged. The
    # second case is the quiet one — an undeclared locale is never loaded, so
    # the app shows English and nothing fails.
    #
    # The script DERIVES the shipped locale set from the catalog (§ 748 /
    # § 755) rather than restating it, so a seventh locale cannot ship
    # half-declared, and it is pure `python3` against a bare checkout — no
    # Xcode, no Mac, no `npm ci`, seconds on a Linux runner. The Mac job
    # `test-watch-ios` builds and runs the Swift suite; it does not read the
    # catalog, and paying for macOS minutes to parse JSON would be silly.
    #
    # UNGATED, and it used to be gated. § 761 gated it on
    # `needs.changes.outputs.code` on the stated ground that none of the three
    # files it read (Localizable.xcstrings, Info.plist, project.pbxproj) was
    # `docs/`, `.claude/` or `*.md`, so every diff able to break it set
    # `code=true`. § 886's guard reads `Complications/README.md` — the only
    # instruction an operator has for typing the App Group identifier into
    # Xcode — and that reasoning stops holding the moment a markdown file
    # enters the read set: a README-only rename sets `code=false`, the gate
    # counts the skip as a pass, and the drift the claim exists to catch ships
    # green. `parity-matrix` is ungated for exactly this reason. The whole job
    # is `python3` plus a bare `node` against a checkout — no `npm ci`, no
    # Xcode, seconds on a Linux runner — so running it on a docs-only PR costs
    # less than reasoning about whether it needed to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: String Catalog coverage vs CFBundleLocalizations + knownRegions
        run: |
          if ! bash apps/watch_ios/scripts/check_xcstrings_parity.sh; then
            echo "::error::apps/watch_ios ships a locale it has not fully declared — a String Catalog entry missing a translation, or a locale the catalog translates that Info.plist's CFBundleLocalizations or the project's knownRegions does not list. An undeclared locale is never loaded at runtime: the watch shows English and nothing throws."
            echo "The failing line above names the string and the locale, or the declaration site that disagrees. Reproduce with: bash apps/watch_ios/scripts/check_xcstrings_parity.sh (python3 only, no Xcode needed). decisions.md § 761."
            exit 1
          fi
      # The guard above is the only thing standing between a half-declared
      # watchOS locale and the store, and the failure it catches is neither a
      # compile error nor a crash — so no Swift test can reach it, and this
      # repo can run a Swift test in one macOS job anyway. Its own suite
      # mutates a copy of the real tree in each of the ways a locale ships
      # half-declared and asserts it refuses, with the unmutated copy as the
      # positive control.
      - name: The String Catalog guard's own unit tests
        run: |
          if ! node --test scripts/check_xcstrings_parity.test.mjs; then
            echo "::error::The watchOS String Catalog guard's own unit tests failed. The catalog itself is fine — the check above just passed — so this is a defect in apps/watch_ios/scripts/check_xcstrings_parity.sh, not a half-declared locale."
            echo "Reproduce with: node --test scripts/check_xcstrings_parity.test.mjs (stdlib only, needs python3 + bash, no install needed)."
            exit 1
          fi
      # decisions.md § 884 – § 887. The guard above holds the catalog against
      # its two locale-declaration sites and nothing else about the tier. This
      # one holds the other seven things a Linux parse can honestly claim about
      # `apps/watch_ios`: a localization key with no catalog entry (renders
      # English in every locale and throws nothing), a catalog entry no Swift
      # references, a capability declared without the call that needs it or
      # exercised without the declaration, the complication's duplicated
      # formatters drifting from their `RunFormat.swift` copies, the App Group
      # named two different ways, a key one end of the run hand-off envelope
      # sends that the other end never lifts out, and — going the other way on
      # the same session — a route-push key that one of its three ends spells
      # differently. Every one of them is silent on the platform, so the macOS
      # `test-watch-ios` job would pass through all of them. The last two claims
      # read outside `apps/watch_ios`: an envelope has ends in more than one app,
      # and a guard holding only the watch's cannot see the drift.
      - name: watchOS catalog usage, native declarations and duplicated sources
        run: |
          if ! node scripts/check_watch_ios_source.mjs; then
            echo "::error::apps/watch_ios carries a source-level defect no compiler reports — a localizing literal with no String Catalog entry, a catalog entry nothing references, an Info.plist / entitlements capability that disagrees with the code, a complication formatter that has drifted from its RunFormat copy, an App Group named two ways, a run hand-off metadata key one end of the WCSession envelope sends and the other never lifts out, or a route-push key one of that envelope's three ends spells differently (which drops the whole route, after the runner has been told it was armed). Nothing here is about a half-declared locale; that is the check above."
            echo "The failing line above names the file, the line and the fix. Reproduce with: node scripts/check_watch_ios_source.mjs (stdlib only, no Xcode needed). decisions § 884 – § 887, § 966."
            exit 1
          fi
      - name: The watchOS source guard's own unit tests
        run: |
          if ! node --test scripts/check_watch_ios_source.test.mjs; then
            echo "::error::The watchOS source guard's own unit tests failed. The tree itself is fine — the check above just passed — so this is a defect in scripts/check_watch_ios_source.mjs, not a defect in apps/watch_ios."
            echo "Reproduce with: node --test scripts/check_watch_ios_source.test.mjs (stdlib only, no install needed)."
            exit 1
          fi

  watch-garmin-source:
    name: Garmin data-field source-level guards (grade reset, annotations, permissions, strings)
    # The Garmin tier is the least verified thing in the monorepo. No job
    # compiles the Monkey C, no job runs its `(:test)` suite, and the Connect IQ
    # SDK is on no machine here — so until now the ONLY automated claim about it
    # was the four numbers `check_watch_wire_vectors.mjs` reads out of one file.
    # `check_garmin_source.sh` has covered five more since it was written and ran
    # in no job at all: it passed on every commit and nothing would have noticed
    # the day it stopped.
    #
    # Its own job rather than a step inside `watch-ios-locale-parity`, which was
    # the obvious host. That job is already bundled and already prints a
    # per-step `::error::`, so rule 2 would have been satisfied — but a job NAME
    # is what a reader sees red in the checks list, and "watchOS source-level
    # guards" going red for a Garmin defect is a name that is wrong about the
    # TIER, which no per-step annotation can correct. The two tiers also fail
    # for unrelated reasons and are read by different people.
    #
    # UNGATED, for the reason `watch-ios-locale-parity` is: the whole job is
    # bash + python3 + a bare `node` against a checkout — no `npm ci`, no SDK,
    # seconds on a Linux runner — so running it on a docs-only PR costs less
    # than reasoning about whether it needed to, and an ungated job always
    # reports a real result rather than a skip the gate counts as a pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Monkey C source-level claims (no Connect IQ SDK needed)
        run: |
          if ! bash apps/watch_garmin/scripts/check_garmin_source.sh; then
            echo "::error::apps/watch_garmin carries a source-level defect no compiler reports — a grade tracker that cannot recover from an activity reset or discard (the field then applies the discarded run's last hill to the whole of the next one, as a confident number), a source-test file the release build no longer excludes, a permission-gated Toybox module used without its manifest declaration (the runtime refuses it on the watch, mid-activity), a cross-rail constant spelled inline where another rail reads it by name, or a string the table and the source disagree about."
            echo "The failing line above names the claim and the fix. Reproduce with: bash apps/watch_garmin/scripts/check_garmin_source.sh (bash + python3 only, no SDK needed)."
            exit 1
          fi
      - name: The Garmin source guard's own unit tests
        run: |
          if ! node --test scripts/check_garmin_source.test.mjs; then
            echo "::error::The Garmin source guard's own unit tests failed. The tier itself is fine — the check above just passed — so this is a defect in apps/watch_garmin/scripts/check_garmin_source.sh, not a defect in apps/watch_garmin. A guard that has stopped matching passes vacuously, which is the failure mode a source-reading guard has instead of a false negative."
            echo "Reproduce with: node --test scripts/check_garmin_source.test.mjs (stdlib only, needs python3 + bash, no install needed)."
            exit 1
          fi

  lambda-alias-coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lambda alias sync coverage
    # decisions.md § 433 — an env-only `terraform apply` publishes a fresh
    # Lambda version, but the `live` aliases the Function URLs target are
    # CI-owned, so a rotation only reaches the serving path once
    # bin/lambda-alias-sync.sh repoints them. That script's coverage was a
    # hand-maintained bash array: correct for the eight Lambdas that exist, and
    # silently short the day a ninth is added — the exact drift issue #590 was
    # opened over, one function at a time. The script parses the Terraform
    # module, the sync script and release-web.yml rather than transcribing any
    # of them (§ 416 / § 439), and runs offline: no AWS credentials, no
    # `terraform init`. Its own `node --test` suite runs beside it because a
    # parser that silently stops matching passes vacuously.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Terraform Lambda aliases vs the tooling that repoints them
        run: |
          node scripts/check_lambda_alias_sync.mjs
          node --test scripts/check_lambda_alias_sync.test.mjs

  infra-guards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Infra IAM + coverage guards
    # The Terraform under infra/ provisions the production web stack, the KMS
    # keys behind sops, the GitHub OIDC deploy roles and DNS, and most of what
    # is load-bearing about it was stated in prose and enforced by nothing.
    # Two guards, both offline — no AWS credentials, no `terraform init`, so
    # this job needs neither the Terraform CLI nor a network round trip:
    #
    #   check_infra_iam.mjs      the OIDC trust contract (StringEquals on a
    #                            wildcard-free environment-shaped sub, the
    #                            environment set moving in lockstep with
    #                            release-web.yml — the half that failed the
    #                            web@1.0.3 release), no wildcard grant, one
    #                            environment's ARNs per role, and every Lambda
    #                            Function URL AWS_IAM-authed with BOTH
    #                            CloudFront invoke grants (issue #590).
    #   check_infra_error_responses.mjs
    #                            the distribution's `custom_error_response` set
    #                            — no 404 mapping (the share Lambdas own that
    #                            status since § 1036, and the mapping discarded
    #                            their `noindex`), the 403 one still laundering
    #                            to 200, and every share handler still returning
    #                            the shell that makes the first claim safe.
    #   check_infra_coverage.mjs every Terraform directory validated and
    #                            dependency-tracked, no Terraform at all outside
    #                            infra/ (where the path filter, the stack matrix
    #                            and the fmt scopes all stop, so such a stack is
    #                            read by nothing), and every Lambda in the
    #                            module carrying an error-rate and a p95 alarm
    #                            — the only signal a Lambda-origin failure has,
    #                            since the distribution-wide 403 fallback
    #                            rewrites one into a 200 shell.
    #
    # Each guard's own `node --test` suite runs beside it: a parser that
    # silently stops matching passes vacuously, which is the failure mode a
    # source-reading guard has instead of a false negative.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: IAM least privilege + the OIDC trust contract
        run: |
          if ! node scripts/check_infra_iam.mjs; then
            echo "::error::An IAM rail under infra/ is wider than the pipeline uses, or the two halves of the OIDC trust contract have come apart. Nothing here is about alarm or stack coverage; that is the other check in this job."
            echo "The failing line above names the role, the statement and the property. decisions § 889 is why the trust conditions are read rather than trusted."
            exit 1
          fi
          if ! node --test scripts/check_infra_iam.test.mjs; then
            echo "::error::The infra IAM guard's own unit tests failed. The Terraform itself is fine — the check above just passed — so this is a defect in scripts/check_infra_iam.mjs, and a parser that stopped matching would have passed the check vacuously."
            exit 1
          fi
      - name: The distribution's error responses, and the handlers that justify them
        run: |
          if ! node scripts/check_infra_error_responses.mjs; then
            echo "::error::The distribution's custom_error_response set has changed, or a share Lambda has stopped answering its own 404 with the SPA shell. Nothing here is about IAM scope or alarm coverage; those are the other checks in this job."
            echo "The failing line above names the status or the handler. decisions § 1084 is why the 404 mapping is gone and § 1022 is why the 403 one must stay at 200."
            exit 1
          fi
          if ! node --test scripts/check_infra_error_responses.test.mjs; then
            echo "::error::The error-response guard's own unit tests failed. The Terraform itself is fine — the check above just passed — so this is a defect in scripts/check_infra_error_responses.mjs, and a parser that stopped matching would have passed the check vacuously."
            exit 1
          fi
      - name: Every stack validated, every Lambda alarmed
        run: |
          if ! node scripts/check_infra_coverage.mjs; then
            echo "::error::A Terraform directory under infra/ is validated or dependency-tracked by nothing, a Terraform directory exists OUTSIDE infra/ where no CI job reads it at all, or a Lambda in the web-stack module has no error-rate or p95 alarm. Nothing here is about IAM scope or the OIDC trust policies; that is the other check in this job."
            echo "The failing line above names the directory or the function. decisions § 890 is why a Lambda-origin failure is invisible without its alarm."
            exit 1
          fi
          if ! node --test scripts/check_infra_coverage.test.mjs; then
            echo "::error::The infra coverage guard's own unit tests failed. The Terraform itself is fine — the check above just passed — so this is a defect in scripts/check_infra_coverage.mjs."
            exit 1
          fi

  # The Terraform checks, CALLED rather than triggered. `fmt (whole tree)`,
  # `validate (<stack>)` and the Trivy IaC scan lived in terraform.yml under
  # its own `pull_request` trigger, where none of them could ever block a
  # merge: branch protection requires exactly one context — the `CI gate`
  # aggregator below — and a `needs:` entry is scoped to its own workflow, so
  # no wiring could have named them. They were three rows that went red and
  # merged anyway, and on a PR touching no infra the path filter meant they
  # were not merely non-blocking but absent (decisions § 1149).
  #
  # A reusable-workflow call rather than three jobs copied over here, because
  # `scripts/check_infra_coverage.mjs` reads the `stack:` matrix and the
  # `terraform fmt` invocations OUT of terraform.yml — that guard is what
  # fails the PR when a new stack is added to no matrix, and moving the matrix
  # would have taken it with it. Calling the file leaves both where the guard
  # looks, and gives the property inlining would not: a called workflow's job
  # results fan into the calling job, so this ONE `needs:` entry covers every
  # job terraform.yml has today and every one it gains later, with nothing to
  # remember.
  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    name: Terraform (fmt, validate, Trivy IaC)
    permissions:
      contents: read
      # The Trivy job uploads SARIF to the Security tab. A called workflow's
      # own `permissions:` is a ceiling the caller sets, so the scope has to be
      # granted here as well as declared there.
      security-events: write
    uses: ./.github/workflows/terraform.yml

  # The secret scan, CALLED rather than triggered — the same fix § 1149
  # applied to terraform.yml, for the same reason. gitleaks.yml ran on its own
  # `push` + `pull_request` triggers, where its red could never block a merge:
  # branch protection requires exactly one context, the `CI gate` aggregator
  # below, and a `needs:` entry is scoped to its own workflow. So a committed
  # AWS key produced a red row on a mergeable PR (decisions § 1264).
  #
  # UNGATED deliberately, like `parity-matrix`. A pasted credential arrives in
  # a markdown file as readily as in code — a `.env` snippet in a runbook, a
  # curl example in an ADR — and the `changes` filter calls that a docs-only
  # diff, on which every code-gated job skips and the gate counts a skip as a
  # pass. The measured cost of not gating it is 18 s (run 33955515670).
  #
  # The action's own exit status is the whole signal: read at the pinned SHA,
  # gitleaks-action posts no SARIF anywhere — it writes a job summary and
  # exits 1 on a detection. Nothing else about the scan reaches a reader.
  gitleaks:
    name: Secret scan (gitleaks)
    permissions:
      contents: read
      # The action lists a PR's existing review comments before deciding
      # whether to add one. It cannot add one — that needs `write` — so the
      # called workflow turns the comment path off; the read stays because it
      # is what the scan's own event handling reads.
      pull-requests: read
    uses: ./.github/workflows/gitleaks.yml

  build-watch-wear:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build Wear OS app (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-watch-wear-${{ hashFiles('apps/watch_wear/android/**/*.gradle*', 'apps/watch_wear/android/gradle/wrapper/gradle-wrapper.properties') }}
      - working-directory: apps/watch_wear/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  build-firmware:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build custom_watch firmware (Rust + Embassy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/custom_watch/target
          key: cargo-firmware-${{ hashFiles('apps/custom_watch/**/Cargo.toml', 'apps/custom_watch/rust-toolchain.toml') }}
          restore-keys: cargo-firmware-
      - name: Install Rust toolchain (driven by rust-toolchain.toml)
        working-directory: apps/custom_watch
        # rustup honours rust-toolchain.toml automatically: an EXACT channel
        # (decisions § 705 — clippy `-D warnings` on a floating one breaks the
        # build on whoever pushes next), thumbv7em-none-eabihf target, rust-src
        # + llvm-tools-preview + clippy + rustfmt components. `rustup show`
        # triggers the install.
        run: rustup show
      - name: Build firmware (release, embedded target)
        working-directory: apps/custom_watch
        run: cargo build --release --target thumbv7em-none-eabihf
      - name: Host-side tests for pure-logic driver crates
        working-directory: apps/custom_watch
        run: |
          HOST_TRIPLE="$(rustc -vV | sed -n 's|host: ||p')"
          cargo test --target "$HOST_TRIPLE" --workspace --exclude app --exclude nrf52840_dk
      - name: Clippy (no warnings allowed)
        working-directory: apps/custom_watch
        run: cargo clippy --workspace --release --target thumbv7em-none-eabihf -- -D warnings
      # The steps above only cover the DEFAULT feature set, so both
      # off-by-default builds drifted unnoticed (a dead `FRAME_GAP` const in
      # the phone task that only the `ble` build could see). `ble` needs its
      # own --no-default-features invocation: the S140 SoftDevice owns
      # critical-section, so it is mutually exclusive with the default
      # `single-core-cs`. The sim set mirrors what bin/watch-sim.sh builds.
      - name: Build firmware (ble feature set, S140 SoftDevice)
        working-directory: apps/custom_watch
        run: cargo build --release --target thumbv7em-none-eabihf -p app --no-default-features --features ble
      - name: Clippy (ble feature set, no warnings allowed)
        working-directory: apps/custom_watch
        run: cargo clippy --release --target thumbv7em-none-eabihf -p app --no-default-features --features ble -- -D warnings
      - name: Build firmware (sim feature set)
        working-directory: apps/custom_watch
        run: cargo build --release --target thumbv7em-none-eabihf -p app --features sim-autostart,sim-alerts,sim-buttons,sim-course,sim-workout,dev-blink
      - name: Clippy (sim feature set, no warnings allowed)
        working-directory: apps/custom_watch
        run: cargo clippy --release --target thumbv7em-none-eabihf -p app --features sim-autostart,sim-alerts,sim-buttons,sim-course,sim-workout,dev-blink -- -D warnings
      - name: Rustfmt check
        working-directory: apps/custom_watch
        run: cargo fmt --check
      # The sim harness's own logic, hosted here rather than in the two Renode
      # jobs so a harness regression fails in ~90 s instead of behind a 14 min
      # emulation. Needs no Renode: the wedge detector's whole point is that it
      # fires when the guest has STOPPED, which no live sim can be asked to do
      # on demand, so it is driven against a synthetic stream and a fake clock.
      - name: Sim harness host tests
        run: python3 -m unittest discover -s apps/custom_watch/sim -p 'test_*.py' -v

  # `build-firmware` above defends the "build-verified" rung of the four-rung
  # verification contract in decisions.md § 314; this job is what defends
  # "sim-verified". apps/custom_watch/README.md makes ~15 sim-verified claims
  # that, until now, only a manual `bin/watch-sim.sh` session on a Linux dev box
  # could check — so a change that broke the simulator stayed invisible until
  # someone next ran it by hand.
  #
  # Split from `sim-scenarios` because the two entered the `CI gate`
  # aggregator's `needs:` list at different times: `smoke` is the sequence the
  # 2026-07-19 manual pass stands behind and was blocking from the start, while
  # `pages` and `alerts` were two runs old and would have put every PR behind
  # assertions with no flake history. `sim-scenarios` accrued that history and
  # was promoted into `needs:` in #637, so BOTH are required now — the split
  # costs one extra Renode install per run and survives because a scenario
  # regression still names which sequence broke.
  sim-firmware:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Simulate custom_watch firmware (Renode)
    runs-on: ubuntu-latest
    # The whole sim run is ~3-5 min of virtual time on top of the build; the cap
    # is here so a wedged emulator cannot burn a runner for six hours. The
    # harness carries its own tighter per-assertion deadlines and a --budget.
    timeout-minutes: 25
    env:
      RENODE_VERSION: 1.16.1
      # Pinned like every action sha in this file: the portable package is a
      # 77 MB self-contained binary fetched at job time from a release asset.
      RENODE_SHA256: 00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0
      # The distance + fix assertions read DEBUG-level defmt lines and defmt
      # filters at COMPILE time, so the ELF the sim boots has to be built with
      # this set — the same level the manual verification pass used.
      # `.cargo/config.toml`'s `[env] DEFMT_LOG = "info"` has no `force`, so an
      # inherited value wins.
      DEFMT_LOG: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/custom_watch/target
          # Separate key from build-firmware's (this job's ELF is a different
          # feature set and log level) but falls back to its cache when cold.
          key: cargo-firmware-sim-${{ hashFiles('apps/custom_watch/**/Cargo.toml', 'apps/custom_watch/rust-toolchain.toml') }}
          restore-keys: |
            cargo-firmware-sim-
            cargo-firmware-
      - name: Install Rust toolchain (driven by rust-toolchain.toml)
        working-directory: apps/custom_watch
        run: rustup show
      - name: Install Renode (portable, self-contained .NET build)
        run: |
          set -euo pipefail
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          curl -fsSL --retry 3 -o /tmp/renode.tar.gz "$url"
          echo "${RENODE_SHA256}  /tmp/renode.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/renode" "$HOME/.local/bin"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          # Wrapper rather than a bare PATH entry: Renode resolves @platforms/…
          # and @scripts/… relative to its own root, so it has to run with that
          # root as the working directory. `exec` keeps the PID the real one, so
          # watch-sim.sh's --pid-file cleanup still kills the emulator.
          printf '#!/usr/bin/env bash\ncd "$HOME/renode" && exec ./renode "$@"\n' \
            > "$HOME/.local/bin/renode"
          chmod +x "$HOME/.local/bin/renode"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the Renode binary runs
        run: renode --version
      - name: Cache defmt-print
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/defmt-print
          # The exact version is IN the key on purpose: the install step below
          # short-circuits on `command -v`, so a stale cache would silently keep
          # serving the old binary and make the pin cosmetic. Bumping the version
          # must miss this key and force a real install.
          key: defmt-print-1.1.0-${{ runner.os }}
      - name: Install defmt-print (decodes the RTT stream against the ELF)
        # Bare version = exact in `cargo install` (unlike a Cargo.toml dependency,
        # it is NOT read as a caret). `^1.1` here floated across all of 1.x, and
        # defmt-print is not in apps/custom_watch/Cargo.lock — it is a host CLI,
        # not a firmware dependency — so nothing else resolves it. Keep the major
        # line equal to the firmware's `defmt` dependency: the decoder has to
        # understand the wire format the firmware emits.
        run: command -v defmt-print || cargo install defmt-print --locked --version 1.1.0
      # Built here rather than left to the launcher so a compile failure is
      # distinguishable from a sim failure. It does NOT save the launcher a
      # build: each scenario boots only the rails it asserts on
      # (ci_smoke.py's SCENARIO_ARMED_RAILS, decisions.md § 465), so no single
      # feature set is the one every session wants. What this buys is a named
      # red step when the widest sim set stops compiling.
      - name: Build the sim feature set
        working-directory: apps/custom_watch
        run: cargo build --release --bin app --features sim-autostart,sim-alerts,sim-buttons,sim-course,sim-workout,dev-blink
      # One step per scenario rather than a single `--scenario all`. A sim
      # failure is the hardest kind to diagnose remotely — Renode is not
      # installable on every contributor machine, so CI is usually the only
      # executor — and a named red step says which surface broke before anyone
      # opens a log. Keeping `smoke` its own step matters most: it is the only
      # sequence with a manual verification pass behind it
      # (sim/verification-2026-07-19/), so a red `smoke` beside a green `pages`
      # points at the pipeline while the reverse points at the new scenario
      # code. Ordered most-proven first, so a broken pipeline fails before two
      # more emulator boots are spent on it.
      #
      # Cost: each step boots its own emulator, so the budgets are what keeps
      # this inside the cap. 3 x 300 s is 15 min against `timeout-minutes: 25`,
      # leaving ~10 min for the Renode fetch, the toolchain and a cold cargo
      # build. Deliberately BELOW the cap: overrunning the budget makes the
      # harness exit with its own last-40-lines + renode.log dump, where the job
      # timeout would kill it bare with nothing to read.
      #
      # A scenario added to the harness needs a step added here — the harness's
      # `--scenario all` default is not what runs.
      #
      # No --fixture: each scenario's own default is the one it was written
      # against (the sim-course breadcrumb only lines up under bench_jog).
      - name: Renode sim — smoke scenario
        run: >-
          python3 apps/custom_watch/sim/ci_smoke.py
          --scenario smoke
          --out-dir "${{ runner.temp }}/watch-sim-ci/smoke"
          --budget 300
      # The binary the logs were produced by, staged INTO the artifact dir
      # rather than added as a second upload path: two paths would move the
      # artifact root to their common ancestor and reshuffle every scenario
      # subdirectory below it.
      #
      # Without this, a firmware address in a renode.log can only be resolved
      # against a locally rebuilt binary and hoped to match — which is exactly
      # where issue #754's diagnosis had to stop. Scenarios run in sequence and
      # a failing one stops the rest, so the ELF still on disk is the one that
      # failed, built with that scenario's own feature set.
      - name: Stage the firmware ELF beside the sim logs
        if: failure()
        run: |
          elf=apps/custom_watch/target/thumbv7em-none-eabihf/release/app
          if [ -f "$elf" ]; then
            cp "$elf" "${{ runner.temp }}/watch-sim-ci/firmware.elf"
          else
            echo "no firmware ELF on disk — the job failed before a build"
          fi
      # Every scenario writes into its own subdirectory of this path, so one
      # upload still carries all of them — and they can't overwrite each other's
      # sim-output.log / frame.ppm / renode.log, which a shared out-dir would.
      - name: Upload sim logs + panel dumps on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-watch-sim-logs
          path: ${{ runner.temp }}/watch-sim-ci
          retention-days: 7

  # The newer half of the Renode coverage: the 33-page BTN3 cycle and the on-run
  # alert engine. Split out of `sim-firmware` as a soak — it stayed out of the
  # required gate while the assertions were new, so a wobble in them could not
  # block every PR in the repo.
  #
  # 2026-07-27 — folded into the `CI gate` `needs:` list. The soak did its job
  # first: the alerts scenario raced the panel repaint on both halves of its
  # banner/quiet pair, went red twice on a PR that touches no firmware, and the
  # quiet half failed silently (the baseline came back carrying the banner it
  # was meant to exclude). Fixed in ci_smoke.py before this job was allowed to
  # block anything — gating on it while it flaked would have taxed every PR.
  sim-scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Simulate custom_watch firmware — page, alert, terrain, dropout, screens, idle, workout + storm scenarios (Renode)
    runs-on: ubuntu-latest
    # The whole sim run is ~3-5 min of virtual time on top of the build; the cap
    # is here so a wedged emulator cannot burn a runner for six hours. The
    # harness carries its own tighter per-assertion deadlines and a --budget.
    #
    # Raised 25 -> 35 when `dropout` was added, 35 -> 40 for `screens`,
    # 40 -> 45 for `idle`, 45 -> 50 for `workout` and 50 -> 55 for `storm`: the
    # eight budgets below now sum to 42 min against ~10 min of Renode fetch,
    # toolchain and a cold cargo build, and a cap that only just covered them
    # left the harness no room to fail with its own diagnostics before the
    # runner was killed bare. The cap is still what it has always been — a
    # backstop over the budgets, not the thing that ends a healthy run, so it
    # tracks their sum whenever a scenario is added.
    timeout-minutes: 55
    env:
      RENODE_VERSION: 1.16.1
      # Pinned like every action sha in this file: the portable package is a
      # 77 MB self-contained binary fetched at job time from a release asset.
      RENODE_SHA256: 00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0
      # The distance + fix assertions read DEBUG-level defmt lines and defmt
      # filters at COMPILE time, so the ELF the sim boots has to be built with
      # this set — the same level the manual verification pass used.
      # `.cargo/config.toml`'s `[env] DEFMT_LOG = "info"` has no `force`, so an
      # inherited value wins.
      DEFMT_LOG: debug
