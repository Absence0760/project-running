name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt every JS-based action (actions/checkout, actions/cache,
# supabase/setup-cli, …) into Node 24 ahead of GitHub's 2026-06-02
# forced upgrade. Without this, the runner emits a deprecation
# warning per action invocation because each one's action.yml still
# declares `runs.using: node20`.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-packages:
    name: Test Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: cp apps/mobile_android/.env.example apps/mobile_android/.env.local
      - run: cp apps/mobile_android/.env.example apps/mobile_ios/.env.local
      # Warm Flutter's engine cache once before the parallel `melos exec`
      # below: two `flutter test` processes racing on `bin/cache/engine.stamp`
      # produces a malformed `flutter//engine_stamp.json` 404.
      - run: flutter precache
      - run: melos exec --scope="run_recorder" --scope="mobile_android" --scope="api_client" --scope="gpx_parser" -- flutter test
      - run: melos exec -- dart analyze

  parity-types:
    name: Schema / type drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 # v2.0.0
        with:
          version: 2.84.2
      - working-directory: apps/backend
        run: supabase start
      - run: npm run gen:types:check --workspace=apps/backend
      - if: failure()
        run: |
          echo "::error::apps/web/src/lib/database.types.ts is out of sync with the Supabase schema."
          echo "Run 'npm run gen:types' locally and commit the result."
      - name: CHECK constraints vs TS unions
        run: npm run check:check-constraints --workspace=apps/web
      - name: Web TS unit tests
        working-directory: apps/web
        run: npx tsx --test src/lib/*.test.ts

  build-watch-wear:
    name: Build Wear OS app (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-watch-wear-${{ hashFiles('apps/watch_wear/android/**/*.gradle*', 'apps/watch_wear/android/gradle/wrapper/gradle-wrapper.properties') }}
      - working-directory: apps/watch_wear/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  build-mobile-android:
    name: Build mobile_android APK (smoke)
    runs-on: ubuntu-latest
    # `flutter test` (in test-packages) catches Dart-level regressions
    # but does NOT exercise the Android Gradle build. Plugin pin
    # mismatches like the AGP 8.13 / Kotlin 2.2 / reactive_ble_mobile
    # compileSdk-33 case (apps/mobile_android/android/build.gradle.kts
    # subprojects.afterEvaluate hook) only surface during a real
    # assembleRelease — and those breakages are expensive to discover
    # during a release tag. This job builds the release APK on every
    # PR so the toolchain stays green.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: dart pub global activate melos
      - run: melos bootstrap
      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobile-android-${{ hashFiles('apps/mobile_android/android/**/*.gradle*', 'apps/mobile_android/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile_android/pubspec.lock') }}
      - run: cp apps/mobile_android/.env.example apps/mobile_android/.env.local
      # `flutter build apk --release` exercises the full Gradle
      # toolchain (AGP, Kotlin compiler, plugin compileSdk overrides)
      # without needing a signing keystore — debug-style signing is
      # implicit. We don't upload the artifact; this is a
      # toolchain-only smoke test.
      - working-directory: apps/mobile_android
        run: flutter build apk --release --no-tree-shake-icons

  twin-parity:
    name: mobile_android ↔ mobile_ios twin parity
    runs-on: ubuntu-latest
    # decisions.md §39 — apps/mobile_android/lib + test must be
    # byte-identical to apps/mobile_ios/lib + test, and pubspec.yaml
    # may differ only in `name` and `description`. The mobile-twin-mirror
    # agent enforces this proactively on edit, but this job is the
    # backstop: a diverged PR fails CI rather than landing.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: lib/ + test/ byte-identical
        run: |
          if ! diff -rq apps/mobile_android/lib apps/mobile_ios/lib; then
            echo "::error::apps/mobile_android/lib has diverged from apps/mobile_ios/lib (decisions.md §39)."
            echo "Mirror the change or invoke the mobile-twin-mirror agent."
            exit 1
          fi
          if ! diff -rq apps/mobile_android/test apps/mobile_ios/test; then
            echo "::error::apps/mobile_android/test has diverged from apps/mobile_ios/test (decisions.md §39)."
            echo "Mirror the change or invoke the mobile-twin-mirror agent."
            exit 1
          fi
      - name: pubspec.yaml deltas limited to name + description
        run: |
          # Strip the only-allowed-deltas (name + description) from both
          # files and diff what remains. Anything non-empty is a
          # violation per decisions.md §39.
          tmp_a=$(mktemp); tmp_i=$(mktemp)
          grep -vE '^(name|description):' apps/mobile_android/pubspec.yaml > "$tmp_a"
          grep -vE '^(name|description):' apps/mobile_ios/pubspec.yaml > "$tmp_i"
          if ! diff -u "$tmp_a" "$tmp_i"; then
            echo "::error::apps/mobile_android/pubspec.yaml and apps/mobile_ios/pubspec.yaml diverge beyond name + description (decisions.md §39)."
            echo "Mirror dependency / version / asset changes across both files in the same commit."
            exit 1
          fi

  schema-codegen-drift:
    name: Kotlin row codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 # v2.0.0
        with:
          version: 2.84.2
      - working-directory: apps/backend
        run: supabase start
      - name: Regenerate Dart + Kotlin row classes
        run: dart run scripts/gen_dart_models.dart
      - name: Fail if committed outputs drifted
        run: |
          if ! git diff --exit-code packages/core_models/lib/src/generated/db_rows.dart apps/watch_wear/android/app/src/main/kotlin/com/runapp/watchwear/generated/DbRows.kt; then
            echo "::error::Generated row classes are out of sync with migrations."
            echo "Run 'dart run scripts/gen_dart_models.dart' locally and commit the result."
            exit 1
          fi

  pgtap-rls:
    name: pgtap RLS suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 # v2.0.0
        with:
          version: 2.84.2
      - name: Start local Supabase stack
        working-directory: apps/backend
        run: supabase start
      - name: Run pgtap RLS suite
        working-directory: apps/backend
        run: supabase test db --local

  e2e-web:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Node 24 (current Active LTS). Must be 22+ regardless:
          # @supabase/realtime-js >=2.105 dropped the ws-package
          # fallback and now needs native WebSocket support, which
          # only landed in Node 22. On older runtimes
          # `createClient(...)` crashes at construction and the Vite
          # dev server dies before Playwright's webServer connects.
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 # v2.0.0
        with:
          version: 2.84.2
      # `supabase start` brings the stack up but does NOT run seed.sql
      # (seed.sql only runs on `supabase db reset`). The e2e suite
      # depends on the pinned UUIDs + seeded users, so we reset
      # immediately after start.
      - name: Start local Supabase stack
        working-directory: apps/backend
        run: supabase start
      - name: Apply migrations + seed (db reset)
        working-directory: apps/backend
        run: supabase db reset --local
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      # The dev server reads PUBLIC_* keys from apps/web/.env. Write the
      # local-stack URL + anon key from `supabase status` so the in-test
      # browser hits the same DB the seed populated.
      #
      # ANTHROPIC_API_KEY is set to a dummy non-empty value so the
      # `/api/coach` handler's early-503 gate (handler.ts:49 — "Coach
      # is not configured") doesn't fire ahead of the auth + daily-cap
      # branches that paywall-wire.spec.ts and tier-cache-resilience
      # .spec.ts pin. The dummy is never used to actually call
      # Anthropic — those tests assert 401 (anon) and 429 (free-cap),
      # both of which the handler returns BEFORE reaching the
      # provider stream call.
      - name: Write apps/web/.env from supabase status
        working-directory: apps/backend
        run: |
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          {
            echo "PUBLIC_SUPABASE_URL=${API_URL}"
            echo "PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "PUBLIC_MAPTILER_KEY="
            echo "PUBLIC_STRAVA_CLIENT_ID="
            echo "PUBLIC_REVENUECAT_WEB_API_KEY="
            echo "PUBLIC_VAPID_PUBLIC_KEY="
            echo "ANTHROPIC_API_KEY=ci-test-key-not-actually-called"
          } > ../web/.env
      - name: Run Playwright suite
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
