            echo "PUBLIC_MAPTILER_KEY="
            echo "PUBLIC_STRAVA_CLIENT_ID="
            echo "PUBLIC_REVENUECAT_WEB_CHECKOUT_URL="
            echo "PUBLIC_VAPID_PUBLIC_KEY="
            echo "ANTHROPIC_API_KEY=ci-test-key-not-actually-called"
