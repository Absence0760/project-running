name: Install Playwright Chromium
description: >
  Download the Chromium build the pinned @playwright/test needs, then
  install that browser's system libraries under a bounded retry.

  Why a composite action rather than three inline copies: this install is
  duplicated across every Playwright job (e2e-web's 14 shards,
  e2e-web-livehub, e2e-web-sso) as byte-identical blocks. One source of
  truth keeps the retry budget — and the incident comment below — from
  diverging, which is the same reason start-supabase exists.

  The `actions/cache` step that restores ~/.cache/ms-playwright stays
  INLINE at each call site and is deliberately not folded in here.
  Dependabot's github-actions ecosystem scans .github/workflows plus a
  ROOT action.yml only, so a SHA-pinned action moved under .github/actions
  stops receiving updates — decisions.md § 595 declined the same trade for
  flutter-action, and start-supabase carries no `uses:` for this reason.
  Only `run:` steps belong here.

  Why the two halves are separate subcommands rather than one
  `playwright install --with-deps chromium`:

  `--with-deps` runs `apt-get update` from inside the browser install, so
  the apt half has no budget of its own and one unreachable Ubuntu mirror
  stalls the whole step. This took main red twice in five hours on
  2026-08-17/18: run 32069680540 (shard 13) and run 32090988359 (shards
  9, 10 and 14). azure.archive.ubuntu.com answered `Ign:` instead of
  serving, apt fell through to archive.ubuntu.com for InRelease and then
  sat in silence on the Packages indices; the shards were still inside
  this step 23 minutes later when `timeout-minutes: 25` killed them, and
  each run — every other job green — went red at the `CI gate`. A healthy
  run of this step is 14-17s, so nothing in the output distinguished the
  hang from ordinary progress until the cap hit.

  Split, each half gets the handling it actually needs. The browser
  download is cache-backed and must succeed. The apt half is bounded at
  120s x 3 (~7x headroom over a healthy 17s) and fails LOUDLY naming the
  mirrors, so ~6 minutes is the worst case against the 25-minute cap that
  the slowest observed shard (12 min) leaves ~13 minutes of.

  Deliberately NOT continue-on-error. Every library it installs is
  already the newest version on the GitHub-hosted image — the step only
  ever VERIFIES — so skipping it would usually pass, and on the run where
  it did not it would surface as every spec in the shard failing with
  "browser closed unexpectedly" rather than as one named red step.

runs:
  using: composite
  steps:
    - name: Download Chromium
      shell: bash
      working-directory: apps/web
      run: pnpm exec playwright install chromium

    # Bound apt so a dead mirror fails fast instead of hanging. Both
    # halves are needed: the conf caps each index fetch so the usual case
    # exits non-zero on its own within seconds, and the outer `timeout`
    # still bounds the pathological case the per-fetch cap cannot (~20
    # index files x a retried timeout each is minutes, not seconds).
    - name: Install Chromium system libraries
      shell: bash
      working-directory: apps/web
      run: |
        set -uo pipefail

        sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'CONF'
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        Acquire::Retries "2";
        CONF

        # `timeout` kills the node process, but the apt-get it spawned
        # through sudo can outlive it still holding the apt/dpkg locks —
        # which would fail the NEXT attempt on "Could not get lock"
        # rather than on the mirror, hiding the real cause behind our own
        # leftovers. Reap the tree, then repair any half-configured
        # package the kill interrupted.
        reap_apt() {
          sudo pkill -9 -x apt-get 2>/dev/null || true
          sudo pkill -9 -x dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a 2>/dev/null || true
        }

        for attempt in 1 2 3; do
          # -k: SIGKILL 10s after the SIGTERM, because apt ignores TERM
          # while it is inside a socket read on an unresponsive mirror.
          if timeout -k 10 120 pnpm exec playwright install-deps chromium; then
            exit 0
          fi

          echo "::warning::playwright install-deps attempt ${attempt} failed or exceeded 120s"

          if [ "${attempt}" = "3" ]; then
            echo "::error::playwright install-deps failed three times — the runner's apt mirrors are not answering, so Chromium's system libraries could not be verified"
            grep -hoE 'https?://[^ /]+' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | sort -u || true
            exit 1
          fi

          reap_apt
        done
