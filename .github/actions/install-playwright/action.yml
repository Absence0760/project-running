name: Install Playwright Chromium
description: >
  Download the Chromium build the pinned @playwright/test needs, then prove
  that browser can actually launch — reaching for apt only if it cannot.

  Why a composite action rather than three inline copies: this install is
  duplicated across every Playwright job (e2e-web's 14 shards,
  e2e-web-livehub, e2e-web-sso) as byte-identical blocks. One source of
  truth keeps the verification — and the incident comment below — from
  diverging, which is the same reason start-supabase exists.

  The `actions/cache` step that restores ~/.cache/ms-playwright stays
  INLINE at each call site and is deliberately not folded in here.
  Dependabot's github-actions ecosystem scans .github/workflows plus a
  ROOT action.yml only, so a SHA-pinned action moved under .github/actions
  stops receiving updates — decisions.md § 595 declined the same trade for
  flutter-action, and start-supabase carries no `uses:` for this reason.
  Only `run:` steps belong here.

  Why the apt half is conditional rather than unconditional:

  `playwright install-deps` exists to make Chromium's system libraries
  present. On a GitHub-hosted image they already ARE — every library it
  would install is the newest version on the image — so the command only
  ever verifies, and it verifies by talking to a third party. That turned
  an Ubuntu-mirror outage into a red test shard five times across two
  pushes on 2026-08-18 (round 4: shards 1, 7, 13; round 5: shards 6, 7),
  each identical: three 120s attempts all timing out, then a hard fail,
  no test ever run, and a re-run clean every time. Two earlier outages
  took main red the same way (runs 32069680540 and 32090988359).

  So verify the libraries directly instead, and let apt run only when the
  verification says something is genuinely missing. The verification is a
  real Chromium launch — the exact thing the shards go on to do, and
  strictly stronger than inspecting `ldd` output, which cannot see what
  Chromium dlopens. Playwright names the missing library itself when a
  launch fails on a dependency, so the failure path stays loud and
  specific.

  What this deliberately does NOT do: pass when it cannot tell. A launch
  that fails for ANY reason sends the job to apt, and a launch that still
  fails afterwards fails the step with the browser's own error text and
  the mirror list. A check that could only ever pass would be worse than
  the outage it replaces.

  The apt half keeps its bounded 120s x 3 budget for the case where a
  library really is missing: that is a real install, it must be allowed
  to finish, and a dead mirror must not hang it for 25 minutes.

runs:
  using: composite
  steps:
    - name: Download Chromium
      shell: bash
      working-directory: apps/web
      run: pnpm exec playwright install chromium

    - name: Verify Chromium's system libraries
      shell: bash
      working-directory: apps/web
      run: |
        set -uo pipefail

        # `node -e` resolves require() from the cwd, which is why this runs
        # from apps/web rather than from a script written to a temp dir.
        # chromium.launch() with no options is the headless shell — the same
        # binary devices['Desktop Chrome'] drives in the shards' config.
        launch_check() {
          timeout -k 10 120 node -e '
            const { chromium } = require("@playwright/test");
            chromium
              .launch()
              .then((browser) => browser.close())
              .then(() => process.exit(0))
              .catch((error) => {
                console.error(String((error && error.message) || error));
                process.exit(1);
              });
          ' 2>&1
        }

        if launched=$(launch_check); then
          echo "Chromium launched — its system libraries are present, apt not needed"
          exit 0
        fi

        echo "::warning::Chromium would not launch, so a system library is genuinely missing — falling through to apt"
        printf '%s\n' "${launched}"

        # Bound apt so a dead mirror fails fast instead of hanging. Both
        # halves are needed: the conf caps each index fetch so the usual case
        # exits non-zero on its own within seconds, and the outer `timeout`
        # still bounds the pathological case the per-fetch cap cannot (~20
        # index files x a retried timeout each is minutes, not seconds).
        sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'CONF'
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        Acquire::Retries "2";
        CONF

        # `timeout` kills the node process, but the apt-get it spawned
        # through sudo can outlive it still holding the apt/dpkg locks —
        # which would fail the NEXT attempt on "Could not get lock"
        # rather than on the mirror, hiding the real cause behind our own
        # leftovers. Reap the tree, then repair any half-configured
        # package the kill interrupted.
        reap_apt() {
          sudo pkill -9 -x apt-get 2>/dev/null || true
          sudo pkill -9 -x dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a 2>/dev/null || true
        }

        for attempt in 1 2 3; do
          # -k: SIGKILL 10s after the SIGTERM, because apt ignores TERM
          # while it is inside a socket read on an unresponsive mirror.
          if timeout -k 10 120 pnpm exec playwright install-deps chromium; then
            break
          fi
          echo "::warning::playwright install-deps attempt ${attempt} failed or exceeded 120s"
          reap_apt
        done

        # The verdict is the browser, not apt's exit code: install-deps can
        # succeed and still leave the launch broken, and it can fail on a
        # mirror having already installed what was missing.
        if launched=$(launch_check); then
          echo "Chromium launched after installing its system libraries"
          exit 0
        fi

        echo "::error::Chromium still will not launch after the system-library install — its own error is below, and a library named there is one the runner's apt mirrors could not resolve"
        printf '%s\n' "${launched}"
        grep -hoE 'https?://[^ /]+' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null | sort -u || true
        exit 1
