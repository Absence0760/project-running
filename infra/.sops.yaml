# sops routing for this repo — DELIBERATELY RULE-LESS.
#
# This repo is PUBLIC. Production secrets are NOT encrypted or stored here —
# they live in the PRIVATE estate repo Absence0760/infra-secrets (cloned as a
# sibling at ../infra-secrets), one subdir per project:
#
#     ../infra-secrets/running/prod.sops.yaml
#     ../infra-secrets/running/preview.sops.yaml
#
# The creation rules + KMS ARNs for those files live in
# ../infra-secrets/.sops.yaml. `bin/sops-init.sh <env>` wires this project's
# per-env KMS ARN (from `terraform output kms_key_arn`) into that estate config
# and seeds the encrypted file; `bin/secret-set.sh <env> <KEY>` edits it. The
# Terraform `sops_file` data source in infra/envs/<env>/main.tf reads the
# external path (the `secrets_file` var, default
# ../infra-secrets/running/<env>.sops.yaml).
#
# This file intentionally declares NO creation_rules so that running
# `sops --encrypt` anywhere under infra/ FAILS CLOSED ("no matching creation
# rules found") instead of silently producing ciphertext that could be committed
# to public history. infra/.gitignore blocks any `secrets.enc.yaml` as a second
# fail-safe.
#
# See infra/README.md (Secrets) and decisions.md §53.
