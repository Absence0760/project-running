name: run-app

# watch_wear is intentionally NOT a Melos package — it's pure Kotlin /
# Compose-for-Wear (decisions.md §15) with its own Gradle build at
# apps/watch_wear/android/. Build it with `./gradlew assembleDebug`
# from that directory; melos has nothing to bootstrap there.
packages:
  - apps/mobile_ios
  - apps/mobile_android
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  test:
    run: melos exec -- flutter test
    description: Run tests in all Flutter packages

  analyze:
    run: melos exec -- flutter analyze
    description: Dart analysis across all packages

  build:ios:
    run: flutter build ipa --no-codesign
    packageFilters:
      scope: mobile_ios

  build:android:
    run: flutter build appbundle
    packageFilters:
      scope: mobile_android

  format:
    run: melos exec -- dart format .
